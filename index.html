      <div class="text-[11px] text-emerald-300/60 text-right mt-1">${icon} 나</div>
    </div>
  </div>`;
}
function renderChatLog() {
  const box = $('#chatLog');
  if (!box || !S) return;
  box.innerHTML = S.log.length
    ? S.log.map((m, i) => (m.role === 'ai' ? aiBubbleHtml(m.text, i, false) : userBubbleHtml(m.text, m.inputType, false))).join('')
    : '';
  box.scrollTop = box.scrollHeight;
}
function appendAiBubble(text) {
  if (!S) return;
  S.log.push({ role: 'ai', text });
  const box = $('#chatLog');
  if (!box) return;
  box.insertAdjacentHTML('beforeend', aiBubbleHtml(text, S.log.length - 1, true));
  box.scrollTop = box.scrollHeight;
}
function appendUserBubble(text, inputType) {
  if (!S) return;
  S.log.push({ role: 'user', text, inputType });
  const box = $('#chatLog');
  if (!box) return;
  box.insertAdjacentHTML('beforeend', userBubbleHtml(text, inputType, true));
  box.scrollTop = box.scrollHeight;
}
function applySubtitles() {
  const hidden = !state.settings.showSubtitles;
  $$('.ai-sub').forEach(el => el.classList.toggle('blurred-sub', hidden));
  $$('.sub-hint').forEach(el => el.classList.toggle('hidden', !hidden));
  const b = $('#subToggle');
  if (b) b.textContent = hidden ? '🙈 자막 OFF' : '💬 자막 ON';
}
function lastAiText() {
  return [...(S?.log || [])].reverse().find(m => m.role === 'ai')?.text || '';
}

function updateLevelMeter(level, elapsedMs) {
  const bar = $('#levelBar'), sec = $('#recSec');
  if (bar) bar.style.width = `${Math.round(level * 100)}%`;
  if (sec) sec.textContent = `${(elapsedMs / 1000).toFixed(1)}s`;
}

function renderControls() {
  const box = $('#talkControls');
  if (!box || !S) return;
  const prevInput = $('#talkInput');
  if (prevInput) S.draftText = prevInput.value;
  const st = S.status, mode = state.settings.inputMode;
  const modes = Object.entries(INPUT_MODES).filter(([k]) => k !== 'browserStt' || SR);
  const modeSwitch = `<div class="flex gap-1">${modes.map(([k, m]) => `
    <button data-action="switchMode" data-mode="${k}" ${st === 'listening' ? 'disabled' : ''} title="${m.label}"
      class="h-9 min-w-[40px] px-2 rounded-lg text-xs border ${k === mode ? 'border-emerald-400/60 bg-emerald-500/10 text-emerald-200' : 'border-slate-700 text-slate-400'}">${m.icon}<span class="hidden sm:inline ml-1">${m.label}</span></button>`).join('')}</div>`;
  let hint = '';
  if (mode === 'record') hint = state.settings.autoStopOnSilence ? '탭: 시작 · 다시 탭/무음 2초: 전송' : '탭: 시작 · 다시 탭: 전송';
  else if (mode === 'browserStt') hint = '⚠️ 텍스트만 전송 · 발음 평가 불가';
  else hint = 'Enter 전송 · Shift+Enter 줄바꿈';

  const micBtn = (cls, label) => `<button data-action="micTap" class="shrink-0 w-16 h-16 rounded-full text-2xl font-bold ${cls}">${label}</button>`;
  const textArea = `
    <div class="flex items-end gap-2">
      <textarea id="talkInput" rows="2" class="flex-1 min-w-0 rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-400 outline-none px-3 py-2 resize-none" placeholder="영어로 답해 보세요…" autocapitalize="sentences">${esc(S.draftText || '')}</textarea>
      <button data-action="sendTyped" class="tap shrink-0 h-12 px-4 rounded-xl bg-emerald-500 text-slate-950 font-bold">전송</button>
    </div>`;

  let body = '';
  if (st === 'opening' || st === 'processing' || st === 'closing') {
    const loadingVoice = st === 'processing' && S.ttsAbort && !S.ttsAbort.signal.aborted && S.log.length && S.log[S.log.length - 1].role === 'ai';
    const label = st === 'opening' ? 'AI가 첫 질문을 준비 중' : st === 'closing' ? 'AI가 마무리 인사를 준비 중' : loadingVoice ? '🔊 음성 불러오는 중' : 'AI가 듣고 답을 생각 중';
    body = `
      <div class="flex items-center justify-between gap-3 min-h-[64px]">
        <div class="flex items-center gap-3 text-slate-300"><span class="inline-block spin text-xl">⏳</span><span>${label}<span class="dots"></span></span></div>
        ${loadingVoice ? `<button data-action="skipSpeech" class="tap shrink-0 px-3 rounded-lg border border-slate-700 text-xs text-slate-300">⏭ 음성 건너뛰기</button>` : ''}
      </div>`;
  } else if (st === 'speaking') {
    body = `
      <div class="flex items-center justify-between gap-3 min-h-[64px]">
        <div class="flex items-center gap-2 text-emerald-200"><span class="text-xl">🔊</span><span>${esc(personaName(S.stage))}가 말하는 중 <span class="text-[11px] text-slate-500">${S.ttsMode === 'browser' ? '(브라우저 음성)' : '(Gemini 음성)'}</span></span></div>
        <div class="flex items-center gap-2">
          <button data-action="skipSpeech" class="tap px-3 rounded-lg border border-slate-700 text-xs text-slate-300">⏭ 건너뛰기</button>
          ${mode !== 'keyboard' ? micBtn('bg-emerald-500/80 text-slate-950 text-xl', mode === 'record' ? '🎙️' : '⚡') : ''}
        </div>
      </div>
      ${mode === 'keyboard' ? textArea : ''}`;
  } else if (st === 'listening') {
    if (S.sttActive) {
      body = `
        <div class="flex items-center gap-3 min-h-[64px]">
          ${micBtn('bg-rose-500 text-white mic-live', '⏹')}
          <div class="flex-1 min-w-0">
            <div id="sttInterim" class="text-sm text-slate-200 break-words">듣는 중…</div>
            <div class="text-[11px] text-slate-500 mt-1">⚡ 브라우저 음성 인식 중 · 탭하면 전송</div>
          </div>
          <button data-action="cancelListen" class="tap shrink-0 px-3 rounded-lg border border-slate-700 text-xs text-slate-300">취소</button>
        </div>`;
    } else {
      body = `
        <div class="flex items-center gap-3 min-h-[64px]">
          ${micBtn('bg-rose-500 text-white mic-live', '⏹')}
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between text-sm"><span class="text-rose-200 font-semibold">● 녹음 중 — 다 말하면 탭</span><span id="recSec" class="font-mono text-xs text-slate-400">0.0s</span></div>
            <div class="h-2 mt-2 rounded-full bg-slate-800 overflow-hidden"><div id="levelBar" class="level-bar h-full bg-gradient-to-r from-emerald-400 to-amber-300" style="width:0%"></div></div>

        </div>`;
    }
  } else if (st === 'openingFailed') {
    body = `
      <div class="flex items-center justify-between gap-3 min-h-[64px]">
        <span class="text-sm text-rose-200">⚠️ 첫 질문을 받지 못했어요</span>
        <button data-action="retryOpening" class="tap px-4 rounded-xl bg-emerald-500 text-slate-950 font-bold">🔁 다시 시도</button>
      </div>`;
  } else { // ready
    const extra = [

    ].filter(Boolean).join('');
    if (mode === 'keyboard') {
      body = `${textArea}${extra ? `<div class="flex flex-wrap items-center gap-2 mt-2">${extra}</div>` : ''}`;
    } else {
      body = `
        <div class="flex items-center gap-3 min-h-[64px]">
          ${micBtn('bg-emerald-500 hover:bg-emerald-400 text-slate-950 glow-emerald', mode === 'record' ? '🎙️' : '⚡')}

          </div>
        </div>
        ${extra ? `<div class="flex flex-wrap items-center gap-2 mt-1">${extra}</div>` : ''}`;
    }
  }
  box.innerHTML = `
    <div class="flex items-center justify-between gap-2 mb-1.5">${modeSwitch}<span class="text-[11px] text-slate-500 text-right">${hint}</span></div>
    ${body}`;

}

function reportViewHtml(r) {
  const d = r.draft;
  const t = d.topic;
  if (r.status === 'loading') {
    return `
    <div class="max-w-xl mx-auto p-6 min-h-full flex flex-col items-center justify-center text-center gap-4">
      <div class="text-5xl spin inline-block">🧠</div>

      <div class="text-sm text-slate-400">${esc(t.title)} · ${d.turns.length}턴 · ${d.minutes}분</div>
      <div class="text-xs text-slate-500">분석 모델 <span class="font-mono">${esc(modelForRole('analysis'))}</span> · thinking high</div>
    </div>`;
  }
  if (r.status === 'error') {
    return `
    <div class="max-w-xl mx-auto p-6 space-y-4">
      <div class="rounded-2xl border border-rose-500/40 bg-rose-500/10 p-5">
        <div class="text-lg font-bold">⚠️ 리포트를 만들지 못했어요</div>
        <div class="text-sm text-rose-100/90 mt-1 break-words">${esc(r.error)}</div>
        <div class="text-xs text-slate-400 mt-2">세션 데이터(${d.turns.length}턴)는 이 기기에 보존돼 있어요. 네트워크·키·모델 설정을 확인한 뒤 다시 시도하세요.</div>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <button data-action="reportRetry" class="tap rounded-xl bg-emerald-500 text-slate-950 font-bold">🔁 다시 시도</button>
        <button data-action="reportLater" class="tap rounded-xl border border-slate-700">나중에</button>
        <button data-action="reportDiscard" class="tap rounded-xl border border-rose-500/40 text-rose-200">🗑 버리기</button>
      </div>
    </div>`;
  }
  const rep = r.report;
  const tid = r.topicId;
  const statsHtml = SIGNAL_KEYS.map(k => {
    const v = rep.statScores[k];
    return `
    <div>
      <div class="flex justify-between text-xs"><span class="text-slate-300">${STAT_LABELS[k]}</span><span class="font-mono ${v == null ? 'text-slate-500' : 'text-emerald-300'}">${v == null ? '발음 평가 없음' : v}</span></div>
      <div class="h-2 rounded-full bg-slate-800 overflow-hidden mt-1"><div class="h-full ${v == null ? '' : 'bg-gradient-to-r from-emerald-500 to-emerald-300'}" style="width:${v == null ? 0 : v}%"></div></div>

function pickProModel() {
  const ids = (runtime.modelList || []).map(m => m.id)
    .filter(id => /pro/i.test(id) && !/tts|vision|image|embedding/i.test(id) && !isPaidModel(id));
  const ver = id => parseFloat((/gemini-(\d+(?:\.\d+)?)/.exec(id) || [])[1] || 0);
  ids.sort((a, b) => ver(b) - ver(a) || (/(preview|exp)/.test(a) ? 1 : 0) - (/(preview|exp)/.test(b) ? 1 : 0));
  return ids[0] || HYBRID_ANALYSIS_FALLBACK;
}

function setModel(role, id) {
  id = normalizeModelId(id);
  if (!id) { toast('모델 ID를 입력해 주세요', 'warn'); return; }
  state.settings.models[role] = id;
  saveState();
  renderHeader();
  const warn = $(`#paidWarn-${role}`);
  if (warn) warn.classList.toggle('hidden', !isPaidModel(id));
  if (isPaidModel(id)) toast(`💰 ${id}: 무료 등급에서 사용 불가·과금될 수 있어요`, 'warn', 6000);
}
function applyPreset(preset) {
  const m = state.settings.models;
  if (preset === 'hybrid') { m.chat = DEFAULT_MODELS.chat; m.analysis = pickProModel(); toast(`⚡ 하이브리드: 회화 ${m.chat} / 분석 ${m.analysis}`, 'success'); }
  else if (preset === 'speed') { m.chat = DEFAULT_MODELS.chat; m.analysis = DEFAULT_MODELS.chat; toast('🚀 속도 우선: 회화·분석 모두 Flash', 'success'); }
  else { toast('🔧 아래에서 역할별 모델을 직접 지정하세요', 'info'); $('#modelInput-chat')?.focus(); return; }
  if (isPaidModel(m.analysis)) toast(`💰 ${m.analysis}: 무료 등급에서 사용 불가·과금될 수 있어요`, 'warn', 6000);
  saveState();
  renderHeader();
  rerenderSettings();
}
function previewVoice() {
  ensureAudioContext();
  unlockSpeechSynthesis();
  toast(`🔊 ${state.settings.voiceName} 미리듣기 불러오는 중…`, 'info', 2000);
  speak("Hey! Ready to get some speaking reps in today? Let's do this.", { voice: state.settings.voiceName });
}

async function copySaveCode() {
  const code = makeSaveCode();
  try {
    await navigator.clipboard.writeText(code);
    toast(`📤 세이브 코드를 복사했어요 (${Math.max(1, Math.round(code.length / 1024))}KB)`, 'success');
  } catch {
    openModal(`
      <div class="p-5 space-y-3">
        <h3 class="text-lg font-bold">📤 세이브 코드</h3>
        <p class="text-sm text-slate-400">자동 복사가 막혀 있어요. 아래 코드를 전체 선택해 복사하세요.</p>
        <textarea readonly rows="6" onfocus="this.select()" class="w-full rounded-xl bg-slate-950 border border-slate-700 p-3 font-mono text-xs break-all">${esc(code)}</textarea>
        <button data-action="closeTopModal" class="tap w-full rounded-xl border border-slate-700">닫기</button>
      </div>`);
  }
}
function openImport() {
  if (S) { toast('대화 중에는 불러올 수 없어요', 'warn'); return; }
  runtime.importCandidate = null;
  openModal(`
    <div class="p-5 space-y-3">
      <h3 class="text-lg font-bold">📥 세이브 코드 불러오기</h3>
      <textarea id="importCode" rows="5" placeholder="${SAVE_PREFIX}..." class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-400 outline-none p-3 font-mono text-xs" autocapitalize="off" spellcheck="false"></textarea>
      <div id="importPreview"></div>
      <div class="grid grid-cols-2 gap-2" id="importButtons">
        <button data-action="closeTopModal" class="tap rounded-xl border border-slate-700">취소</button>
        <button data-action="validateImport" class="tap rounded-xl bg-emerald-500 text-slate-950 font-bold">🔍 코드 확인</button>
      </div>
    </div>`, { id: 'import' });
}
function validateImport() {
  try {
    const inc = parseSaveCode($('#importCode')?.value);
    runtime.importCandidate = inc;
    $('#importPreview').innerHTML = `
      <div class="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-3 text-sm space-y-1">
        <div>✅ 유효한 세이브 코드 (마지막 저장 ${fmtDate(inc.meta.updatedAt)})</div>
        <div class="text-xs text-slate-400">EXP ${inc.profile.exp.toLocaleString()} · 세션 ${inc.sessions.length} · 도감 ${inc.dex.length} · 내 토픽 ${inc.customTopics.length}</div>
      </div>`;
    $('#importButtons').innerHTML = `
      <button data-action="applyImport" data-mode="overwrite" class="tap rounded-xl border border-rose-500/40 text-rose-200 font-semibold">덮어쓰기</button>
      <button data-action="applyImport" data-mode="merge" class="tap rounded-xl bg-emerald-500 text-slate-950 font-bold">합치기</button>`;
  } catch (e) {
    toast(e.message, 'error', 5000);
  }
}
async function applyImport(mode) {
  const inc = runtime.importCandidate;
  if (!inc) return;
  if (mode === 'overwrite') {
    const ok = await showConfirm({ title: '덮어쓰기', body: '이 기기의 모든 기록이 세이브 코드 내용으로 바뀌어요. 계속할까요?', okText: '덮어쓰기', danger: true });
    if (!ok) return;
    const deviceId = state.meta.deviceId;
    state = inc;
    state.meta.deviceId = deviceId;
  } else {
    state = mergeStates(state, inc);
  }
  runtime.importCandidate = null;
  persistNow();
  closeModal('import');
  rerenderSettings();
  rerenderAll();
  toast(mode === 'overwrite' ? '📥 세이브 코드로 덮어썼어요' : '📥 기록을 합쳤어요', 'success');
}
async function resetAll() {
  const ok = await showConfirm({ title: '🧨 전체 초기화', body: 'EXP·기록·도감·내 토픽·설정이 모두 지워져요. 되돌릴 수 없어요.\n(API 키는 유지돼요)', okText: '초기화', danger: true });
  if (!ok) return;
  if (S) abortSession();
  state = defaultState();
  persistNow();
  clearPendingReport();
  talk.pending = null;
  talk.report = null;
  closeModal('settings');
  rerenderAll();
  toast('초기화했어요', 'info');
}
function rerenderAll() {
  renderHeader();
  renderNav();
  if (currentView === 'talk') { if (!S) renderTalk(); }
  else switchView(currentView);
}

function onSettingChanged(key) {
  renderHeader();
  if (key === 'showSubtitles') applySubtitles();
  if (key === 'autoStopOnSilence' && S) renderControls();
  if (key === 'excludeWaitTime' && S) updateTimerUI();
  if (!S && talk.pending && currentView === 'talk') renderTalk();
}

// ===== [SECTION: INIT] =====
const ACTIONS = {
  nav: el => switchView(el.dataset.view),
  goTopics: () => { talk.report = null; switchView('topics'); },
  goDex: () => { talk.report = null; switchView('dex'); },
  goStageTopics: () => switchView('topics'),
  openSettings: () => openSettings(),
  closeTopModal: () => closeTopModal(),

  setStage: el => {
    state.settings.stage = clampInt(el.dataset.stage, 1, 4, 1);
    saveState();
    renderHeader();
    renderTopics();
  },
  startCustomTopic: () => startCustomTopic(),
  smartRandom: () => smartRandom(),
  pickTopic: el => pickTopic(el.dataset.id),
  deleteCustomTopic: (el, e) => { e.stopPropagation(); return deleteCustomTopic(el.dataset.id); },

  cancelSetup: () => { talk.pending = null; switchView('topics'); },
  setTimer: el => { state.settings.timerPreset = Number(el.dataset.min); saveState(); renderTalk(); },
  setInputMode: el => {
    const mode = el.dataset.mode;
    if (mode === 'browserStt' && !SR) { toast('이 브라우저는 음성 인식을 지원하지 않아요', 'warn'); return; }
    state.settings.inputMode = mode;
    saveState();
    renderTalk();
  },
  startSession: () => startSession(),
  retryOpening: () => requestOpening(),

  micTap: () => micTap(),
  cancelListen: () => cancelListening(),
  sendTyped: () => sendTyped(),
  retryTurn: () => retryTurn(),
  switchMode: el => switchInputMode(el.dataset.mode),
  skipSpeech: () => skipSpeech(),
  replayLast: () => { const t = lastAiText(); if (t) return replayText(t); toast('다시 들을 대사가 없어요', 'info'); },
  replayIdx: el => replayText(S?.log[Number(el.dataset.idx)]?.text),
  revealSub: el => { if (!state.settings.showSubtitles) el.classList.toggle('blurred-sub'); },
  toggleSubtitles: () => { state.settings.showSubtitles = !state.settings.showSubtitles; saveState(); applySubtitles(); },
  toggleHud: () => toggleHud(),
  endSession: () => endSessionManual(),
  resumeBg: () => resumeFromBackground(),

  openSos: () => openSos(),
  closeSos: () => closeSos(),
  askSos: () => askSos(),
  sosMic: () => sosMic(),
  speakText: el => {
    ensureAudioContext();
    unlockSpeechSynthesis();
    const text = el.dataset.text;
    if (S && S.status === 'ready' && !S.pauses.size) return replayText(text);
    if (S && S.status !== 'ready' && !S.pauses.has('sos')) { toast('AI 차례가 끝난 뒤 들어 주세요', 'info'); return; }
    return speak(text);
  },
  saveDex: el => saveDexFromButton(el),
  deleteDex: el => deleteDex(el.dataset.id),

  reportRetry: () => generateReport(talk.report?.draft || loadPendingReport()),
  reportLater: () => { talk.report = null; switchView('topics'); toast('🧾 리포트는 🎙️ 대화 탭에서 나중에 생성할 수 있어요', 'info'); },
  reportDiscard: () => discardReport(),
  generatePending: () => generateReport(loadPendingReport()),
  againTopic: el => { talk.report = null; return pickTopic(el.dataset.id); },

  copySaveCode: () => copySaveCode(),
  openImport: () => openImport(),
  validateImport: () => validateImport(),
  applyImport: el => applyImport(el.dataset.mode),
  resetAll: () => resetAll(),
  saveApiKey: () => saveApiKey(),
  toggleKeyVis: () => { const i = $('#apiKeyInput'); if (i) i.type = i.type === 'password' ? 'text' : 'password'; },
  fetchModels: () => fetchModelsAction(),
  applyPreset: el => applyPreset(el.dataset.preset),
  previewVoice: () => previewVoice()
};

function handleActionError(err) {
  if (isAbort(err)) return;
  console.error(err);
  toast(`오류: ${err?.message || err}`, 'error', 5000);
}
function runAction(el, e) {
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  // iOS 오디오 잠금 해제를 위해 반드시 이벤트 핸들러 안에서 동기적으로 호출한다
  try {
    const r = fn(el, e);
    if (r && typeof r.catch === 'function') r.catch(handleActionError);
  } catch (err) { handleActionError(err); }
}

function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    if (el.tagName === 'BUTTON' || el.getAttribute('role') === 'button') e.preventDefault();
    runAction(el, e);
  });

  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.key === 'Escape') {
      const top = modalStack[modalStack.length - 1];
      if (top && top.dismissible) closeModal(top.id);
      return;
    }
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (t.matches?.('[role="button"][data-action]')) { e.preventDefault(); runAction(t, e); return; }
    if (t.id === 'talkInput' && !e.shiftKey) { e.preventDefault(); sendTyped(); return; }
    if (t.id === 'customTopicInput') { e.preventDefault(); startCustomTopic(); return; }
    if (t.id === 'sosInput' && !e.shiftKey) { e.preventDefault(); askSos(); }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'talkInput' && S) { S.draftText = t.value; return; }
    const key = t.dataset?.input;
    if (key === 'dexSearch') { dexUi.q = t.value; renderDexList(); }
    else if (key === 'customTopic') ui.customDraft = t.value;
  });

  document.addEventListener('change', e => {
    const t = e.target;
    const kind = t.dataset?.change;
    if (!kind) return;
    if (kind === 'setting') {
      const key = t.dataset.key;
      if (!(key in state.settings)) return;
      state.settings[key] = t.type === 'checkbox' ? t.checked : (typeof state.settings[key] === 'number' ? Number(t.value) : t.value);
      saveState();
      onSettingChanged(key);
    } else if (kind === 'modelSelect') {
      const role = t.dataset.role;
      const input = $(`#modelInput-${role}`);
      if (input) input.value = t.value;
      setModel(role, t.value);
    } else if (kind === 'modelInput') {
      setModel(t.dataset.role, t.value);
    } else if (kind === 'fallbackChain') {
      const list = uniq(t.value.split(/[\s,]+/).map(normalizeModelId).filter(Boolean));
      if (!list.length) { toast('폴백 체인에 모델을 1개 이상 넣어 주세요', 'warn'); t.value = state.settings.models.fallbackChain.join('\n'); return; }
      state.settings.models.fallbackChain = list;
      saveState();
      const paid = list.filter(isPaidModel);
      toast(`🛟 폴백 체인 저장: ${list.join(' → ')}`, 'success');
      if (paid.length) toast(`💰 ${paid.join(', ')}: 무료 등급에서 사용 불가·과금될 수 있어요`, 'warn', 6000);
    } else if (kind === 'dexType') { dexUi.type = t.value; renderDexList(); }
    else if (kind === 'dexTopic') { dexUi.topic = t.value; renderDexList(); }
  });

  // <details>의 toggle 이벤트는 버블링되지 않아 캡처 단계에서 받는다
  document.addEventListener('toggle', e => {
    const n = Number(e.target?.dataset?.track);
    if (!n) return;
    if (e.target.open) ui.openTracks.add(n); else ui.openTracks.delete(n);
  }, true);

  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('pagehide', persistNow);
  window.addEventListener('online', () => toast('🌐 다시 온라인이에요', 'success'));
  window.addEventListener('offline', () => toast('📴 오프라인이에요. 진행 중인 기록은 보존돼요', 'warn', 5000));
  window.addEventListener('error', e => {
    const msg = e.message || '';
    if (!msg || /ResizeObserver|Script error/i.test(msg)) return;
    console.error(e.error || msg);
    toastOnce(`err:${msg}`, `오류: ${msg}`, 'error');
  });
  window.addEventListener('unhandledrejection', e => {
    if (isAbort(e.reason)) return;
    console.error(e.reason);
    toastOnce(`rej:${e.reason?.message}`, `오류: ${e.reason?.message || e.reason}`, 'error');
  });
}

function init() {
  loadState();
  loadModelCache();
  bindEvents();
  renderHeader();
  renderNav();
  switchView('topics');
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch {}
  }
  if (loadPendingReport()) setTimeout(() => toast('🧾 완료되지 않은 리포트가 있어요. 🎙️ 대화 탭에서 생성할 수 있어요', 'info', 6000), 400);
  if (!getApiKey()) setTimeout(() => toast('👋 ⚙️ 설정에서 Gemini API 키를 먼저 입력해 주세요', 'info', 6000), 700);
}

init();
</script>
</body>
</html>
