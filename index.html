  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);

  .glow-emerald { box-shadow: 0 0 0 1px rgba(16,185,129,.45), 0 0 26px rgba(16,185,129,.22); }
  .glow-gold { box-shadow: 0 0 0 1px rgba(250,204,21,.5), 0 0 26px rgba(250,204,21,.22); }
  .mic-live { animation: micPulse 1.3s ease-in-out infinite; }
  @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,.55); } 50% { box-shadow: 0 0 0 16px rgba(244,63,94,0); } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .blurred-sub { filter: blur(7px); user-select: none; -webkit-user-select: none; }
  .scroll-thin { scrollbar-width: thin; scrollbar-color: #334155 transparent; -webkit-overflow-scrolling: touch; }
  .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 9px; }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .particle { position: fixed; z-index: 90; width: 9px; height: 9px; border-radius: 9999px; pointer-events: none;
    background: radial-gradient(circle, #fef3c7 0%, #facc15 45%, #b45309 100%);
    box-shadow: 0 0 10px rgba(250,204,21,.8); animation: burst 1.25s cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes burst { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .score-ring { background: conic-gradient(#34d399 calc(var(--p) * 1%), #1e293b 0); }
  .level-bar { transition: width .08s linear; }
  .sheet-in { animation: sheetIn .25s ease-out both; }
  @keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  #cornerBadge { top: calc(var(--sat) + 60px); }
  @media (min-width: 768px) { #cornerBadge { top: auto; bottom: 12px; } }
  @media (max-width: 767px) { body.talk-live #cornerBadge { display: none; } }
</style>

<body class="bg-slate-950 text-slate-100 antialiased">
<div id="app" class="flex overflow-hidden grid-bg">
  <aside id="sidebar" class="hidden md:flex md:flex-col w-60 shrink-0 border-r border-slate-800 bg-slate-900/60 pt-safe">
    <div class="px-5 pt-5 pb-4">
      <div class="flex items-center gap-2 text-xl font-black tracking-tight">
        <span>⚔️</span><span class="text-emerald-300">Speak</span><span class="text-amber-300">Tactics</span>
      </div>

<div id="toastRoot" class="fixed z-[80] left-0 right-0 flex flex-col items-center gap-2 pointer-events-none px-3" style="top: calc(var(--sat) + 10px)"></div>
<div id="modalRoot"></div>

<script>
'use strict';
// ===== [SECTION: CONFIG] =====
const APP_NAME = 'Speak Tactics';
const STATE_VERSION = 1;
const LS_STATE = 'rpg_state';
const LS_SECRETS = 'rpg_secrets';
const LS_MODEL_CACHE = 'rpg_model_cache';
const LS_PENDING_REPORT = 'rpg_pending_report';
const API_BASE = 'https://generativelanguage.googleapis.com/v1beta';
const AI_STUDIO_URL = 'https://aistudio.google.com/apikey';
const COOLDOWN_MS = 48 * 3600 * 1000;
const TIMER_PRESETS = [3, 5, 10, 15, 0];
const MAX_SESSIONS = 50;
const SAVE_PREFIX = 'RPGSAVE1:';

const DEFAULT_MODELS = {
  chat: 'gemini-3.8-flash',
  analysis: 'gemini-3.8-flash',
  tts: 'gemini-3.8-flash-tts',
  fallbackChain: ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite']
};
// TTS 전용 폴백 (일반 폴백 체인은 텍스트 모델이라 TTS에 쓰지 않음)
const TTS_FALLBACKS = ['gemini-2.5-flash-preview-tts'];
// 모델 목록 조회 실패 시 드롭다운 기본값
const DEFAULT_MODEL_OPTIONS = [
  'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite',
  'gemini-2.5-pro', 'gemini-2.5-flash', 'gemini-2.5-flash-lite',
  'gemini-3.8-flash-tts', 'gemini-2.5-flash-preview-tts'
];
// 무료 등급에서 사용 불가하거나 과금될 수 있는 모델 패턴
const PAID_MODEL_PATTERNS = [/argon/i, /gemini-4/i, /3\.1-pro/i, /pro-preview/i, /ultra/i];
const HYBRID_ANALYSIS_FALLBACK = 'gemini-2.5-pro';

// 공식 문서의 prebuilt voice 목록
const VOICES = [
  ['Zephyr', 'Bright'], ['Puck', 'Upbeat'], ['Charon', 'Informative'], ['Kore', 'Firm'], ['Fenrir', 'Excitable'],
  ['Leda', 'Youthful'], ['Orus', 'Firm'], ['Aoede', 'Breezy'], ['Callirrhoe', 'Easy-going'], ['Autonoe', 'Bright'],
  ['Enceladus', 'Breathy'], ['Iapetus', 'Clear'], ['Umbriel', 'Easy-going'], ['Algieba', 'Smooth'], ['Despina', 'Smooth'],
  ['Erinome', 'Clear'], ['Algenib', 'Gravelly'], ['Rasalgethi', 'Informative'], ['Laomedeia', 'Upbeat'], ['Achernar', 'Soft'],
  ['Alnilam', 'Firm'], ['Schedar', 'Even'], ['Gacrux', 'Mature'], ['Pulcherrima', 'Forward'], ['Achird', 'Friendly'],
  ['Zubenelgenubi', 'Casual'], ['Vindemiatrix', 'Gentle'], ['Sadachbia', 'Lively'], ['Sadaltager', 'Knowledgeable'], ['Sulafat', 'Warm']
].map(([name, style]) => ({ name, style }));
const DEFAULT_VOICE = 'Puck';

const STAGES = {
  1: { label: 'Stage 1', icon: '🛡️', name: '스피킹 재활 & 순발력 복구', goal: '현재 AM 180점 유지·안정화',
       desc: '친절하고 명확한 미군 동료 톤. 3초 안에 입 밖으로 꺼내기, 기본 구동사와 시제 정확도.',
       persona: 'Mike, a friendly, clear-speaking US Army sergeant',
       style: 'Friendly, clear US Army coworker tone. Use simple, clear sentences at a moderate pace so the user can start answering within 3 seconds. Create natural chances to use basic phrasal verbs and accurate tenses (past, present perfect, future).' },
  2: { label: 'Stage 2', icon: '🍺', name: '카투사 한계 돌파: 슬랭 & 리얼 토크', goal: '목표 OPIc AL',
       desc: '배럭스·펍에서 미군끼리 빠르게 말하는 캐주얼 톤. 축약어, 실전 슬랭, 맞장구, 스토리텔링.',
       persona: 'Jay, a laid-back US soldier buddy from the barracks',
       style: "Fast, casual tone like US soldiers chatting in the barracks or at a pub. Use contractions (gonna, wanna, y'know), real everyday slang, natural backchannels (no way, for real?, that's wild) and pull full stories out of the user." },
  3: { label: 'Stage 3', icon: '⚖️', name: '논리적 변증', goal: '목표 토스 AM 190점',
       desc: '근거를 대고, "왜? 반대로 보면?" 같은 반문에 막힘없이 답하기.',
       persona: 'Sam, a sharp friend who loves a good debate',
       style: 'Logical, dialectical conversation. Ask for reasons and concrete examples, and challenge with "why?", "but what about...?" or "flip it around" so the user practices defending a view without stalling.' },
  4: { label: 'Stage 4', icon: '👑', name: '네이티브 마스터', goal: '목표 토스 AH 200점',
       desc: '원어민 100% 속도, 비유·유머·외교적 화법, 미세한 어색함까지 다룸.',
       persona: 'Alex, a witty native speaker who talks at full speed',
       style: 'Full native speed and phrasing, idioms, metaphors, light humor and diplomatic hedging. Treat the user as a near-native peer.' }
};

const TRACKS = {
  1: { emoji: '🏠', name: 'My Life, Routine & Personal Stories', nameKo: '내 일상 말하기', tag: '핵심 · 35%', core: true,
       concept: "A curious foreign friend or coworker asks concretely about the user's daily patterns, habits, tastes and recent experiences, and keeps asking follow-up questions." },
  2: { emoji: '💭', name: 'What Do You Think? Everyday Opinions', nameKo: '내 생각 말하기', tag: '핵심 · 35%', core: true,
       concept: '"What do you think?" / "What would you pick?" — the user states a personal opinion with clear, well-organized reasons.' },
  3: { emoji: '🇺🇸', name: 'Bro Vibes & Daily Situations', nameKo: '브로 토크 & 생활 상황', tag: '서브 · 15%', core: false,
       concept: 'Casual bro-to-bro talk and real-life situations. For situational topics (plan changes, complaints, clinic) naturally play the matching role (friend, staff, pharmacist, doctor).' },
  4: { emoji: '🏛️', name: 'Politics & Diplomacy', nameKo: '정치 & 외교', tag: '스페셜 · 15%', core: false,
       concept: "Light but thoughtful talk about politics and diplomacy. Stay strictly non-partisan, lay out the strongest arguments on each side, and draw out the user's own view and reasoning." }
};
const CUSTOM_TRACK = { emoji: '✍️', name: 'Free Talk', nameKo: '직접 입력', tag: '자유',
  concept: 'Free talk about something the user brought up themselves (it may be written in Korean — always talk in English). Chat about it like a friend catching up: what happened, the details, how it felt, what comes next.' };

const INPUT_MODES = {
  record: { icon: '🎙️', label: '녹음 전송', desc: '녹음 → Gemini가 직접 듣고 발음까지 평가 (아이폰 권장)' },
  browserStt: { icon: '⚡', label: '브라우저 음성 인식', desc: '브라우저가 받아쓴 텍스트만 전송 · 발음 평가 불가' },
  keyboard: { icon: '⌨️', label: '키보드', desc: '마이크가 안 될 때 타이핑으로 대화' }
};

const SILENCE = { threshold: 0.02, holdMs: 2000, maxRecordMs: 120000 };

const FALLBACK_CLOSINGS = {
  1: "Alright, that's time! Great talking with you — let's do this again soon.",
  2: "Ah man, we're outta time! Good stuff, bro — catch you later.",
  3: "And that's time. Good arguments today — let's pick this up again soon.",
  4: "Well, that's a wrap! Seriously enjoyed this one — until next time."
};

// 공용 유틸
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const uniq = arr => [...new Set(arr)];
const clampInt = (v, min, max, def) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
const uid = (p = 'id') => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
const pad2 = n => String(n).padStart(2, '0');
const fmtDate = ts => { const d = new Date(ts); return `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtClock = (ms, ceil = false) => { const s = Math.max(0, ceil ? Math.ceil(ms / 1000) : Math.floor(ms / 1000)); return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; };
function sleep(ms, signal) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(resolve, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); }, { once: true });
  });
}
const isAbort = e => e && (e.name === 'AbortError');
const isPaidModel = id => PAID_MODEL_PATTERNS.some(re => re.test(id || ''));
const normalizeModelId = id => String(id || '').trim().replace(/^models\//, '');

// ===== [SECTION: STATE] =====
let state = null;
let saveTimer = null;

function defaultSettings() {
  return {
    stage: 1,
    timerPreset: 5,
    excludeWaitTime: true,
    inputMode: 'record',
    autoStopOnSilence: true,
    showSubtitles: true,
    voiceName: DEFAULT_VOICE,
    models: { chat: DEFAULT_MODELS.chat, analysis: DEFAULT_MODELS.analysis, tts: DEFAULT_MODELS.tts, fallbackChain: [...DEFAULT_MODELS.fallbackChain] },
    useAnalysisModelForDeepTalk: false,
    onlyCoreTracksInRandom: false
  };
}

function defaultState() {
  return {
    version: STATE_VERSION,
    meta: { updatedAt: Date.now(), deviceId: uid('dev') },
    settings: defaultSettings(),
    profile: {
      exp: 0, level: 1, rankStage: 1,
      stats: { fluency: 60, vocab: 60, grammar: 60, logic: 60, nuance: 60 },
      pendingBoss: null, bossHistory: []
    },
    topicProgress: {},
    customTopics: [],
    dex: [],
    sessions: []
  };
}

function emptyProgress() {
  return { clearCount: 0, lastClearedAt: null, summaries: [], anglesCovered: [] };
}

function normalizeKeyExpr(k) {
  if (typeof k === 'string') { const [en, ko] = k.split(/\s*[—–|]\s*/); return { en: (en || '').trim(), ko: (ko || '').trim() }; }
  if (isObj(k)) return { en: String(k.en ?? k.expression ?? '').trim(), ko: String(k.ko ?? k.meaningKo ?? '').trim() };
  return { en: '', ko: '' };
}

function normalizeTopic(t, source = 'custom') {
  return {
    id: String(t.id),
    track: clampInt(t.track, 1, 4, 1),
    title: String(t.title || 'Untitled'),
    titleKo: String(t.titleKo || t.title || ''),
    subtitle: String(t.subtitle || ''),
    starterQuestions: (Array.isArray(t.starterQuestions) ? t.starterQuestions : []).map(String).filter(Boolean).slice(0, 3),
    keyExpressions: (Array.isArray(t.keyExpressions) ? t.keyExpressions : []).map(normalizeKeyExpr).filter(k => k.en).slice(0, 4),
    createdAt: Number(t.createdAt) || Date.now(),
    source: t.source === 'ai' ? 'ai' : source
  };
}

function migrateState(raw) {
  const d = defaultState();
  if (!isObj(raw)) return d;
  const s = { ...d, ...raw, version: STATE_VERSION };

  s.meta = { ...d.meta, ...(isObj(raw.meta) ? raw.meta : {}) };
  if (!s.meta.deviceId) s.meta.deviceId = d.meta.deviceId;

  const rs = isObj(raw.settings) ? raw.settings : {};
  const st = { ...d.settings, ...rs };
  st.models = { ...d.settings.models, ...(isObj(rs.models) ? rs.models : {}) };
  for (const r of ['chat', 'analysis', 'tts']) st.models[r] = normalizeModelId(st.models[r]) || DEFAULT_MODELS[r];
  st.models.fallbackChain = (Array.isArray(st.models.fallbackChain) ? st.models.fallbackChain : []).map(normalizeModelId).filter(Boolean);
  if (!st.models.fallbackChain.length) st.models.fallbackChain = [...DEFAULT_MODELS.fallbackChain];
  st.stage = clampInt(st.stage, 1, 4, 1);
  st.timerPreset = TIMER_PRESETS.includes(Number(st.timerPreset)) ? Number(st.timerPreset) : 5;
  if (!INPUT_MODES[st.inputMode]) st.inputMode = 'record';
  for (const k of ['excludeWaitTime', 'autoStopOnSilence', 'showSubtitles', 'useAnalysisModelForDeepTalk', 'onlyCoreTracksInRandom']) {
    if (typeof st[k] !== 'boolean') st[k] = d.settings[k];
  }
  if (!VOICES.some(v => v.name === st.voiceName)) st.voiceName = DEFAULT_VOICE;
  s.settings = st;

  const rp = isObj(raw.profile) ? raw.profile : {};
  const p = { ...d.profile, ...rp };
  p.stats = { ...d.profile.stats, ...(isObj(rp.stats) ? rp.stats : {}) };
  p.exp = Math.max(0, Math.round(Number(p.exp) || 0));
  p.level = Math.max(1, Math.round(Number(p.level) || 1));
  p.rankStage = clampInt(p.rankStage, 1, 4, 1);
  if (!Array.isArray(p.bossHistory)) p.bossHistory = [];
  if (p.pendingBoss === undefined) p.pendingBoss = null;
  s.profile = p;

  s.topicProgress = {};
  if (isObj(raw.topicProgress)) {
    for (const [k, v] of Object.entries(raw.topicProgress)) {
      if (!isObj(v)) continue;
      s.topicProgress[k] = {
        clearCount: Math.max(0, Math.round(Number(v.clearCount) || 0)),
        lastClearedAt: Number(v.lastClearedAt) || null,
        summaries: (Array.isArray(v.summaries) ? v.summaries : []).map(String).slice(-5),
        anglesCovered: (Array.isArray(v.anglesCovered) ? v.anglesCovered : []).map(String)
      };
    }
  }

  s.customTopics = (Array.isArray(raw.customTopics) ? raw.customTopics : [])
    .filter(t => isObj(t) && t.id && t.title).map(t => normalizeTopic(t, 'custom'));

  s.dex = (Array.isArray(raw.dex) ? raw.dex : []).filter(x => isObj(x) && x.id).map(x => ({
    id: String(x.id),
    type: ['hud', 'sos', 'report'].includes(x.type) ? x.type : 'hud',
    original: String(x.original ?? ''),
    native: String(x.native ?? ''),
    tipKo: String(x.tipKo ?? ''),
    topicId: x.topicId ?? null,
    createdAt: Number(x.createdAt) || Date.now(),
    box: Math.max(1, Math.round(Number(x.box) || 1)),
    lastReviewedAt: Number(x.lastReviewedAt) || null,
    reviewCount: Math.max(0, Math.round(Number(x.reviewCount) || 0))
  }));

  s.sessions = (Array.isArray(raw.sessions) ? raw.sessions : []).filter(x => isObj(x) && x.id)
    .sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0)).slice(0, MAX_SESSIONS);
  return s;
}

function loadState() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(LS_STATE) || 'null'); }
  catch (e) { console.warn('state parse failed', e); setTimeout(() => toast('저장 데이터를 읽지 못해 기본값으로 시작해요', 'warn'), 300); }
  state = migrateState(raw);
}

// 변경 후 500ms 디바운스 저장
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 500);
}
function persistNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!state) return;
  state.meta.updatedAt = Date.now();
  try { localStorage.setItem(LS_STATE, JSON.stringify(state)); }
  catch (e) { console.error(e); toastOnce('persist-fail', '브라우저 저장소에 저장하지 못했어요 (저장 공간 부족 또는 개인정보 보호 모드)', 'error', 60000); }
}

}
function setSecret(key, value) {
  const s = getSecrets();
  if (value) s[key] = value; else delete s[key];
  try { localStorage.setItem(LS_SECRETS, JSON.stringify(s)); } catch (e) { toast('API 키를 저장하지 못했어요', 'error'); }
}

// 내보내기용 사본: 비밀값 키를 명시적으로 제거한다 (세이브 코드·내보내기·클라우드 동기화 공통)
function exportState() {
  const copy = JSON.parse(JSON.stringify(state));
  for (const k of ['secrets', 'rpg_secrets', 'apiKey', 'geminiApiKey', 'firebaseToken', 'authToken']) delete copy[k];
  if (copy.settings) for (const k of ['apiKey', 'geminiApiKey', 'firebaseToken']) delete copy.settings[k];
  return copy;
}

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function base64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function makeSaveCode() {
  return SAVE_PREFIX + utf8ToBase64(JSON.stringify(exportState()));
}
function parseSaveCode(code) {
  let s = String(code || '').replace(/\s+/g, '');
  if (!s) throw new Error('세이브 코드를 붙여넣어 주세요');
  if (s.startsWith(SAVE_PREFIX)) s = s.slice(SAVE_PREFIX.length);
  let obj;
  try { obj = JSON.parse(base64ToUtf8(s)); } catch { throw new Error('세이브 코드 형식이 올바르지 않아요 (일부만 복사됐는지 확인)'); }
  if (!isObj(obj) || typeof obj.version !== 'number' || !isObj(obj.settings)) throw new Error('이 앱의 세이브 코드가 아니에요');
  if (obj.version > STATE_VERSION) throw new Error('더 최신 버전 앱에서 만든 세이브 코드예요');
  for (const k of ['secrets', 'rpg_secrets', 'apiKey', 'geminiApiKey']) delete obj[k];
  return migrateState(obj);
}

// 합치기: dex·customTopics = id 합집합, topicProgress = clearCount 큰 쪽, profile.exp = 큰 쪽
function mergeStates(local, incoming) {
  const out = JSON.parse(JSON.stringify(local));
  const dexMap = new Map(out.dex.map(d => [d.id, d]));
  for (const d of incoming.dex) {
    const cur = dexMap.get(d.id);
    if (!cur || (d.reviewCount || 0) > (cur.reviewCount || 0)) dexMap.set(d.id, d);
  }
  out.dex = [...dexMap.values()].sort((a, b) => b.createdAt - a.createdAt);

  const topicMap = new Map(out.customTopics.map(t => [t.id, t]));
  for (const t of incoming.customTopics) if (!topicMap.has(t.id)) topicMap.set(t.id, t);
  out.customTopics = [...topicMap.values()];

  for (const [id, inc] of Object.entries(incoming.topicProgress)) {
    const cur = out.topicProgress[id];
    if (!cur || inc.clearCount > cur.clearCount || (inc.clearCount === cur.clearCount && (inc.lastClearedAt || 0) > (cur.lastClearedAt || 0))) {
      out.topicProgress[id] = inc;
    }
  }

  if (incoming.profile.exp > out.profile.exp) out.profile = incoming.profile;

  const sesMap = new Map(out.sessions.map(x => [x.id, x]));
  for (const x of incoming.sessions) if (!sesMap.has(x.id)) sesMap.set(x.id, x);
  out.sessions = [...sesMap.values()].sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0)).slice(0, MAX_SESSIONS);
  return migrateState(out);
}

}

const runtime = { modelList: null, lastResponder: null, toastOnce: new Map() };

class GeminiError extends Error {
  constructor(message, opts = {}) {
    super(message);
    this.name = 'GeminiError';
    Object.assign(this, { status: 0, retryable: false, retryDelay: null, parseFail: false, thinkingIssue: false, model: null }, opts);
  }
}

function modelForRole(role) {
  const m = state.settings.models;
  if (role === 'analysis') return m.analysis || DEFAULT_MODELS.analysis;
  if (role === 'tts') return m.tts || DEFAULT_MODELS.tts;
  return m.chat || DEFAULT_MODELS.chat;
}
function chainForRole(role, override) {
  const first = normalizeModelId(override || modelForRole(role));
  if (role === 'tts') return uniq([first, ...TTS_FALLBACKS].filter(Boolean));
  return uniq([first, ...state.settings.models.fallbackChain.map(normalizeModelId)].filter(Boolean));
}

// 회화는 thinking 낮게, 분석은 높게. 모델 세대별로 설정 형식이 다르다.
function thinkingConfigFor(model, level) {
  if (!level || /tts/i.test(model)) return null;
  if (/gemini-(1\.|2\.0)/i.test(model)) return null;
  if (/gemini-2\.5/i.test(model)) {
    if (level === 'high') return { thinkingBudget: -1 };
    return { thinkingBudget: /pro/i.test(model) ? 128 : 0 };
  }
  return { thinkingLevel: level === 'high' ? 'high' : 'low' };
}

function parseRetryDelay(json) {
  const details = json?.error?.details;
  if (Array.isArray(details)) {
    const info = details.find(d => String(d['@type'] || '').includes('RetryInfo'));
    if (info?.retryDelay) { const n = parseFloat(info.retryDelay); if (Number.isFinite(n)) return n; }
  }
  const m = /retry in ([\d.]+)\s*s/i.exec(json?.error?.message || '');
  return m ? parseFloat(m[1]) : null;
}

async function requestModel(model, body, signal) {
  const key = getApiKey();
  if (!key) throw new GeminiError('Gemini API 키가 없어요. ⚙️ 설정에서 입력해 주세요.', { code: 'NO_KEY' });
  if (navigator.onLine === false) throw new GeminiError('인터넷 연결이 끊겨 있어요. 연결 후 다시 시도해 주세요.', { code: 'OFFLINE' });
  let res;
  try {
    res = await fetch(`${API_BASE}/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body),
      signal
    });
  } catch (e) {
    if (isAbort(e)) throw e;
    throw new GeminiError(`네트워크 오류 (${e.message || 'fetch failed'})`, { retryable: true, model });
  }
  let json = null;
  try { json = await res.json(); } catch {}
  if (!res.ok) {
    const msg = json?.error?.message || res.statusText || `HTTP ${res.status}`;
    const unsupported = /not (found|supported)|unsupported|does not support|is not available|no longer available/i.test(msg);
    throw new GeminiError(msg, {
      status: res.status,
      model,
      retryable: [404, 429, 500, 502, 503, 504].includes(res.status) || (res.status === 400 && unsupported),
      retryDelay: res.status === 429 ? parseRetryDelay(json) : null,
      thinkingIssue: res.status === 400 && /thinking/i.test(msg)
    });
  }
  return json || {};
}

function extractText(json) {
  const parts = json?.candidates?.[0]?.content?.parts || [];
  return parts.filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('').trim();
}
function parseJsonLoose(text) {
  try { return JSON.parse(text); } catch {}
  const cleaned = text.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(cleaned); } catch {}
  const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(cleaned.slice(a, b + 1));
  throw new Error('JSON parse failed');
}

function friendlyError(e) {
  if (!e) return new Error('알 수 없는 오류');
  if (e.code) return e;
  const msg = String(e.message || '');
  let out = msg;
  if (e.status === 400 && /api key not valid|API_KEY_INVALID/i.test(msg)) out = 'API 키가 올바르지 않아요. ⚙️ 설정에서 확인해 주세요.';
  else if (e.status === 401 || e.status === 403) out = `API 키 권한 오류 (${e.status}). 키 또는 결제/지역 설정을 확인해 주세요.`;
  else if (e.status === 429) out = `요청 한도 초과 (429)${e.retryDelay ? ` — 약 ${Math.ceil(e.retryDelay)}초 후 다시 시도해 주세요` : ' — 잠시 후 다시 시도해 주세요'}`;
  else if (e.status >= 500) out = `Gemini 서버 오류 (${e.status}) — 잠시 후 다시 시도해 주세요`;
  else if (e.status === 404) out = `모델을 찾을 수 없어요 (${e.model}). ⚙️ 설정에서 모델을 확인해 주세요.`;
  else if (e.parseFail) out = 'AI 응답 형식이 올바르지 않아요. 다시 시도해 주세요.';
  const err = new Error(out);
  err.status = e.status;
  return err;
}

function noteResponder(model, role, fallbackUsed) {
  if (role === 'tts') return;
  runtime.lastResponder = { model, role, fallbackUsed, at: Date.now() };
  renderCornerBadge();
}

/**
 * 공통 호출 함수.
 * - schema가 있으면 JSON 모드 + responseSchema, 파싱 실패 시 같은 모델로 1회 재요청
 * - 429·500·503·404·모델 미지원이면 지수 백오프(1초→2초) 후 폴백 체인의 다음 모델로
 */
async function callGemini({ role = 'chat', contents, systemInstruction, schema, thinking = null, generationConfig = {}, raw = false, signal, modelOverride } = {}) {
  const chain = chainForRole(role, modelOverride);
  let lastErr = null;
  for (let i = 0; i < chain.length; i++) {
    const model = chain[i];
    let useThinking = thinking;
    let parseRetried = false;
    for (let attempt = 0; attempt < 4; attempt++) {
      const body = { contents, generationConfig: { ...generationConfig } };
      if (systemInstruction) body.systemInstruction = { parts: [{ text: systemInstruction }] };
      if (schema) { body.generationConfig.responseMimeType = 'application/json'; body.generationConfig.responseSchema = schema; }
      const tc = thinkingConfigFor(model, useThinking);
      if (tc) body.generationConfig.thinkingConfig = tc;
      try {
        const json = await requestModel(model, body, signal);
        const responder = normalizeModelId(json.modelVersion) || model;
        if (raw) { noteResponder(responder, role, i > 0); return { json, model: responder }; }
        const text = extractText(json);
        if (!text) {
          const reason = json?.promptFeedback?.blockReason || json?.candidates?.[0]?.finishReason || 'EMPTY';
          throw new GeminiError(`빈 응답 (${reason})`, { parseFail: true, retryable: true, model });
        }
        if (!schema) { noteResponder(responder, role, i > 0); return { text, model: responder }; }
        let data;
        try { data = parseJsonLoose(text); } catch { throw new GeminiError('JSON 파싱 실패', { parseFail: true, retryable: true, model }); }
        noteResponder(responder, role, i > 0);
        return { data, model: responder };
      } catch (e) {
        if (isAbort(e)) throw e;
        lastErr = e;
        if (e.thinkingIssue && useThinking) { useThinking = null; continue; }
        if (e.parseFail && !parseRetried) { parseRetried = true; continue; }
        if (!e.retryable) throw friendlyError(e);
        break;
      }
    }
    if (i < chain.length - 1) {
      if (lastErr?.status === 429) {
        toast(`⏳ ${model} 요청 한도 초과${lastErr.retryDelay ? ` — ${Math.ceil(lastErr.retryDelay)}초 후 재사용 가능` : ''}. ${chain[i + 1]}(으)로 전환할게요`, 'warn', 5000);
      } else {
        toast(`⚠️ ${model} 응답 실패 → ${chain[i + 1]}(으)로 전환`, 'warn');
      }
      await sleep(Math.min(1000 * 2 ** i, 2000), signal);
    }
  }
  throw friendlyError(lastErr);
}

async function fetchModelList() {
  const key = getApiKey();
  if (!key) throw new Error('먼저 API 키를 저장해 주세요');
  const models = [];
  let pageToken = '';
  for (let page = 0; page < 5; page++) {
    const url = `${API_BASE}/models?pageSize=1000${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ''}`;
    let res;
    try { res = await fetch(url, { headers: { 'x-goog-api-key': key } }); }
    catch (e) { throw new Error('네트워크 오류로 모델 목록을 가져오지 못했어요'); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw friendlyError(new GeminiError(json?.error?.message || `HTTP ${res.status}`, { status: res.status }));
    for (const m of json.models || []) {
      if ((m.supportedGenerationMethods || []).includes('generateContent')) {
        models.push({ id: normalizeModelId(m.name), displayName: m.displayName || '' });
      }
    }
    if (!json.nextPageToken) break;
    pageToken = json.nextPageToken;
  }
  if (!models.length) throw new Error('generateContent를 지원하는 모델이 없어요');
  runtime.modelList = models;
  try { localStorage.setItem(LS_MODEL_CACHE, JSON.stringify({ fetchedAt: Date.now(), models })); } catch {}
  return models;
}
function loadModelCache() {
  try { const c = JSON.parse(localStorage.getItem(LS_MODEL_CACHE) || 'null'); if (c && Array.isArray(c.models)) runtime.modelList = c.models; } catch {}
}
function modelOptionsFor(role) {
  const ids = runtime.modelList ? runtime.modelList.map(m => m.id) : DEFAULT_MODEL_OPTIONS;
  const isTts = id => /tts/i.test(id);
  const nonChat = /embedding|imagen|image-generation|veo|aqa|native-audio|live|learnlm/i;
  let list = role === 'tts' ? ids.filter(isTts) : ids.filter(id => !isTts(id) && !nonChat.test(id));
  if (!list.length) list = DEFAULT_MODEL_OPTIONS.filter(id => (role === 'tts') === isTts(id));
  return uniq([modelForRole(role), ...list]);
}

async function geminiTTS(text, voiceName, signal) {
  const { json } = await callGemini({
    role: 'tts',
    contents: [{ role: 'user', parts: [{ text }] }],
    generationConfig: {
      responseModalities: ['AUDIO'],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } }
    },
    raw: true,
    signal
  });
  const part = (json?.candidates?.[0]?.content?.parts || []).find(p => p.inlineData?.data || p.inline_data?.data);
  const inline = part?.inlineData || part?.inline_data;
  if (!inline) throw new Error('TTS 응답에 오디오가 없어요');
  const mime = inline.mimeType || inline.mime_type || '';
  const rate = Number((/rate=(\d+)/i.exec(mime) || [])[1]) || 24000;
  return pcm16Base64ToBuffer(inline.data, rate);
}

// iOS: AudioContext는 반드시 사용자 탭 이벤트 안에서 만들고 resume 한다
function ensureAudioContext() {

    if (!audio.ctx) {

      audio.ctx = new AC();
    }
    if (audio.ctx.state !== 'running') audio.ctx.resume().catch(() => {});

async function getMicStream() {

async function startRecording(onAutoStop) {
  const ctx = ensureAudioContext();
  const stream = await getMicStream();
  const mime = pickRecorderMime();
  if (mime === null) throw new Error('이 브라우저는 녹음(MediaRecorder)을 지원하지 않아요. 다른 입력 방식을 선택해 주세요');

  rec.start(250);

  audio.speechDetected = false;
  audio.lastLoudAt = performance.now();
  startLevelMonitor(ctx, stream, onAutoStop);

function startLevelMonitor(ctx, stream, onAutoStop) {

    updateLevelMeter(Math.min(1, rms * 6), now - audio.recStartedAt);

function blobToBase64(blob) {

    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(r.error || new Error('파일 읽기 실패'));

}

    if (p && typeof p.then === 'function') p.then(resolve, reject);

function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  writeStr(36, 'data'); view.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);

// 녹음 결과를 16kHz mono WAV로 변환해 전송 (모든 브라우저 포맷을 Gemini가 확실히 읽도록). 변환 실패 시 원본 그대로.
async function prepareAudioForGemini(blob) {
  const ctx = ensureAudioContext();
  try {
    const decoded = await decodeAudio(ctx, await blob.arrayBuffer());
    if (decoded.duration < 0.4) return { tooShort: true };
    const rate = 16000;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const off = new OAC(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
    const src = off.createBufferSource();
    src.buffer = decoded;
    src.connect(off.destination);
    src.start(0);
    const rendered = await off.startRendering();
    const wav = encodeWav(rendered.getChannelData(0), rate);
    return { part: { mimeType: 'audio/wav', data: await blobToBase64(wav) }, duration: decoded.duration };
  } catch (e) {
    console.warn('WAV 변환 실패 → 원본 전송', e);
    const mime = (blob.type || 'audio/webm').split(';')[0];
    return { part: { mimeType: mime, data: await blobToBase64(blob) }, duration: null };
  }
}

// Gemini TTS 응답(Base64 16-bit PCM, little-endian, mono) → Float32 AudioBuffer
function pcm16Base64ToBuffer(b64, sampleRate = 24000) {
  const ctx = ensureAudioContext();
  if (!ctx) throw new Error('오디오 재생을 지원하지 않는 브라우저예요');
  const bin = atob(b64);
  const len = bin.length >> 1;
  const buffer = ctx.createBuffer(1, Math.max(1, len), sampleRate);
  const ch = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) {
    let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
    if (v >= 0x8000) v -= 0x10000;
    ch[i] = v / 32768;
  }
  return buffer;
}

function playBuffer(buffer) {
  return new Promise(resolve => {
    stopPlayback();
    const ctx = ensureAudioContext();
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    const done = () => { if (audio.currentSource === src) { audio.currentSource = null; audio.playResolve = null; } resolve(); };
    src.onended = done;
    audio.currentSource = src;
    audio.playResolve = done;

  });
}
function stopPlayback() {

    try { audio.currentSource.onended = null; audio.currentSource.stop(); } catch {}
    audio.currentSource = null;
  }
  audio.playResolve = null;

function pickBrowserVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices() || [];
  let pool = voices.filter(v => /^en[-_]US/i.test(v.lang));
  if (!pool.length) pool = voices.filter(v => /^en/i.test(v.lang));
  if (!pool.length) return null;
  const score = v => {
    const n = v.name || '';
    let s = 0;
    if (/premium/i.test(n)) s += 5;
    if (/enhanced/i.test(n)) s += 4;
    if (/natural|neural/i.test(n)) s += 3;
    if (/google/i.test(n)) s += 2;
    if (/samantha|alex|ava|evan|zoe|nathan/i.test(n)) s += 1;
    if (/compact|novelty|bad news|bells|bubbles|whisper|zarvox|trinoids|cellos|organ|boing|jester|superstar|wobble/i.test(n)) s -= 10;
    if (v.localService) s += 0.5;
    return s;
  };
  return pool.slice().sort((a, b) => score(b) - score(a))[0];
}

function speakBrowser(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { resolve(); return; }
    try { speechSynthesis.cancel(); } catch {}
    const u = new SpeechSynthesisUtterance(text);
    const v = pickBrowserVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    const stage = state.settings.stage;
    u.rate = stage === 1 ? 0.92 : stage >= 4 ? 1.08 : 1;
    let finished = false;
    const fin = () => { if (finished) return; finished = true; clearTimeout(guard); if (audio.playResolve === fin) audio.playResolve = null; resolve(); };
    const guard = setTimeout(fin, Math.max(5000, text.length * 110));
    u.onend = fin;
    u.onerror = fin;
    audio.playResolve = fin;
    speechSynthesis.speak(u);
  });
}

/** reply 음성 출력: Gemini TTS → 실패 시 speechSynthesis 폴백. 반환값 'gemini' | 'browser' */
async function speak(text, { voice, signal, onStart, quietFallback = false } = {}) {
  if (!text) return 'none';
  const voiceName = voice || state.settings.voiceName;
  const key = `${voiceName}|${text}`;
  try {
    let buffer = audio.ttsCache.get(key);
    if (!buffer) {
      buffer = await geminiTTS(text, voiceName, signal);
      audio.ttsCache.set(key, buffer);
      if (audio.ttsCache.size > 40) audio.ttsCache.delete(audio.ttsCache.keys().next().value);
    }
    if (signal?.aborted) return 'none';
    onStart && onStart('gemini');
    await playBuffer(buffer);
    return 'gemini';
  } catch (e) {
    if (isAbort(e) || signal?.aborted) return 'none';
    console.warn('TTS fallback', e);
    if (!quietFallback) toastOnce('tts-fallback', `🔊 Gemini 음성 실패 → 브라우저 음성으로 대체 (${e.message})`, 'warn', 60000);
    onStart && onStart('browser');
    await speakBrowser(text);
    return 'browser';
  }
}

function sttErrorMsg(code) {

function startBrowserStt({ lang = 'en-US', continuous = false, onInterim } = {}) {
  return new Promise((resolve, reject) => {

    const rec = new SR();

const CONVERSATION_PROMPT_TEMPLATE = `You are {persona}, a native English speaker chatting with a Korean friend who is practicing speaking.
Topic: {title} — {subtitle}. Track concept: {trackConcept}.
Stage {stage} style: {stageStyle}.

VOICE CHANNEL RULES
- Never correct, explain, or mention the user's grammar, word choice, or pronunciation in "reply". Corrections go ONLY in the "hud" field.
- Talk like a curious friend, not a teacher or examiner. React naturally to what they said (show you actually listened), then ask exactly ONE follow-up question.
- Dig into specifics: when, where, who, why, how it felt, what happened next, what they would do differently.
- Keep "reply" short so the user talks more: max 35 words in Stage 1–2, max 55 words in Stage 3–4. Target talk ratio: user 70%, you 30%.
- Stage 3: push back politely with a counterpoint or "what if" every 2–3 turns.
- Stage 4: native speed phrasing, idioms, light humor, diplomatic hedging.
- Track 4: never take a partisan side. Present both sides' strongest arguments and ask for the user's reasoning.
- If the user answers very briefly, ask a narrower, easier question instead of a broader one.
- Naturally create chances for the user to use these expressions (never list them): {keyExpressions}.

This topic has been cleared {clearCount} times.
Previous session summaries: {summaries}
Angles already covered: {anglesCovered}
If clearCount > 0: do NOT reuse the basic starter questions or covered angles. Open from a fresh angle: a specific past episode, an unexpected dilemma, the opposite viewpoint, or a future plan.

Respond ONLY with JSON matching the schema.`;

      thinking: S.chatRole === 'analysis' ? 'high' : 'low',
      signal: S.abort.signal
    });
    if (!S || S.id !== sid) return;
    const reply = String(data?.reply || '').trim() || "Hey! Good to see you. So, what's been going on with you lately?";
    S.openingAngle = String(data?.angleTag || '').trim() || null;
    S.history.push({ role: 'user', text: '(Session start)' }, { role: 'model', text: reply });
    appendAiBubble(reply);
    await aiSpeak(reply);
    if (!S || S.id !== sid) return;
    if (S.status === 'processing' || S.status === 'speaking') { S.status = 'ready'; renderControls(); }
    checkTimeUpWhenIdle();
  } catch (e) {
    if (isAbort(e) || !S || S.id !== sid) return;
    toast(`첫 질문을 받지 못했어요: ${e.message}`, 'error', 6000);
    S.status = 'openingFailed';
    renderControls();
  }
}

async function aiSpeak(text) {
  if (!S) return;
  const sid = S.id;
  S.status = 'processing';
  renderControls();
  S.ttsAbort = new AbortController();
  await speak(text, {
    signal: S.ttsAbort.signal,
    onStart: m => { if (S && S.id === sid && S.status === 'processing') { S.status = 'speaking'; S.ttsMode = m; renderControls(); } }
  });
}
function skipSpeech() {
  if (!S) return;
  S.ttsAbort?.abort();
  stopPlayback();
}
async function replayText(text) {
  ensureAudioContext();
  if (!text) return;
  if (!S) { speak(text); return; }
  if (S.status !== 'ready') { toast('지금은 다시 듣기를 할 수 없어요', 'warn'); return; }
  const sid = S.id;
  await aiSpeak(text);
  if (S && S.id === sid && (S.status === 'processing' || S.status === 'speaking')) { S.status = 'ready'; renderControls(); }
  checkTimeUpWhenIdle();
}

function normalizeTurn(d, localTranscript, inputType) {
  const sig = isObj(d?.signals) ? d.signals : {};
  const hud = isObj(d?.hud) ? d.hud : {};
  const transcript = String(localTranscript ?? d?.transcript ?? '').trim();
  const pronRaw = d?.pronunciationNoteKo == null ? '' : String(d.pronunciationNoteKo).trim();
  return {
    transcript,
    reply: String(d?.reply || '').trim() || 'Got it — tell me a bit more about that?',
    hud: {
      original: String(hud.original || transcript).trim(),
      upgrade: String(hud.upgrade || '').trim(),
      tipKo: String(hud.tipKo || '').trim()
    },
    pron: inputType === 'audio' && pronRaw && !/^(null|none|없음)$/i.test(pronRaw) ? pronRaw : null,
    signals: {
      fluency: clampInt(sig.fluency, 0, 100, 60), vocab: clampInt(sig.vocab, 0, 100, 60),
      grammar: clampInt(sig.grammar, 0, 100, 60), logic: clampInt(sig.logic, 0, 100, 60),
      nuance: inputType === 'audio' ? clampInt(sig.nuance, 0, 100, 60) : null
    },
    angleTag: String(d?.angleTag || '').trim().slice(0, 60),
    inputType,
    at: Date.now()
  };
}

async function processUserTurn(input) {
  if (!S) return;
  const sid = S.id;
  const timeUpAtSend = S.timeUp;
  S.status = 'processing';
  S.lastFailedInput = null;
  renderControls();
  try {
    let parts, localTranscript = null, inputType;
    if (input.kind === 'audio') {
      const prep = input.prepared || await prepareAudioForGemini(input.blob);
      if (!S || S.id !== sid) return;
      if (prep.tooShort) {
        toast('녹음이 너무 짧아요. 조금 더 길게 말해 주세요', 'warn');
        S.status = 'ready'; renderControls(); checkTimeUpWhenIdle();
        return;
      }
      input.prepared = prep;
      inputType = 'audio';
      parts = [{ text: buildTurnNote('audio', timeUpAtSend) }, { inlineData: prep.part }];
    } else {
      localTranscript = input.text.trim();
      inputType = input.source;
      parts = [{ text: buildTurnNote(input.source, timeUpAtSend) }, { text: localTranscript }];
    }
    S.abort = new AbortController();
    const { data } = await callGemini({
      role: S.chatRole,
      contents: [...historyToContents(S.history), { role: 'user', parts }],
      systemInstruction: S.systemInstruction,
      schema: TURN_SCHEMA,
      thinking: S.chatRole === 'analysis' ? 'high' : 'low',
      signal: S.abort.signal
    });
    if (!S || S.id !== sid) return;
    const turn = normalizeTurn(data, localTranscript, inputType);
    if (!turn.transcript) {
      toast('목소리를 알아듣지 못했어요. 다시 말해 주세요 🎙️', 'warn');
      S.status = 'ready'; renderControls(); checkTimeUpWhenIdle();
      return;
    }
    S.turns.push(turn);
    if (inputType === 'audio') S.usedAudio = true;
    if (inputType === 'keyboard') S.draftText = '';
    S.history.push({ role: 'user', text: turn.transcript }, { role: 'model', text: turn.reply });
    appendUserBubble(turn.transcript, inputType);
    addHudCard(turn, S.turns.length - 1);
    appendAiBubble(turn.reply);
    await aiSpeak(turn.reply);
    if (!S || S.id !== sid) return;
    if (timeUpAtSend) { finishSession(); return; }
    if (S.status === 'processing' || S.status === 'speaking') { S.status = 'ready'; renderControls(); }
    checkTimeUpWhenIdle();
  } catch (e) {
    if (isAbort(e) || !S || S.id !== sid) return;
    toast(`응답 실패: ${e.message}`, 'error', 6000);
    S.lastFailedInput = input;
    S.status = 'ready';
    renderControls();
  }
}

async function micTap() {
  if (!S) return;
  ensureAudioContext();
  if (S.status === 'listening') { stopListening(); return; }
  if (S.status === 'speaking') { skipSpeech(); } // 끼어들기: AI 음성 중단 후 바로 녹음
  else if (S.status !== 'ready') return;
  if (S.pauses.size) { toast('일시정지 상태예요. 먼저 재개해 주세요', 'warn'); return; }
  const mode = state.settings.inputMode;
  if (mode === 'record') startListeningRecord();
  else if (mode === 'browserStt') startListeningStt();
}

async function startListeningRecord() {
  const sid = S.id;
  S.status = 'listening';
  S.sttActive = false;
  renderControls();
  try {
    await startRecording(() => { if (S && S.id === sid && S.status === 'listening') stopListening(); });
  } catch (e) {
    cancelRecording();
    if (!S || S.id !== sid) return;
    toast(micErrorMsg(e), 'error', 6000);
    S.status = 'ready';
    if (isPermissionError(e) || /MediaRecorder/.test(e.message || '')) switchInputMode('keyboard', true);
    renderControls();
  }
}

async function startListeningStt() {
  const sid = S.id;
  S.status = 'listening';
  S.sttActive = true;
  S.sttCancelled = false;
  renderControls();
  try {
    const text = await startBrowserStt({
      lang: 'en-US',
      continuous: !state.settings.autoStopOnSilence,
      onInterim: t => { const el = $('#sttInterim'); if (el) el.textContent = t || '듣는 중…'; }
    });
    if (!S || S.id !== sid) return;
    S.sttActive = false;
    if (S.sttCancelled) { S.sttCancelled = false; if (S.status === 'listening') S.status = 'ready'; renderControls(); checkTimeUpWhenIdle(); return; }
    if (!text) { toast('인식된 말이 없어요. 다시 시도해 주세요', 'warn'); S.status = 'ready'; renderControls(); checkTimeUpWhenIdle(); return; }
    processUserTurn({ kind: 'text', text, source: 'stt' });
  } catch (e) {
    if (!S || S.id !== sid) return;
    S.sttActive = false;
    toast(e.message || '음성 인식 오류', 'error', 6000);
    S.status = 'ready';
    renderControls();
  }
}

async function stopListening() {
  if (!S || S.status !== 'listening') return;
  if (S.sttActive) { stopBrowserStt(); return; } // onend → 결과 처리
  const sid = S.id;
  S.status = 'processing';
  renderControls();
  const blob = await stopRecording();
  if (!S || S.id !== sid) return;
  if (!blob) { toast('녹음된 소리가 없어요. 다시 시도해 주세요', 'warn'); S.status = 'ready'; renderControls(); checkTimeUpWhenIdle(); return; }
  processUserTurn({ kind: 'audio', blob });
}

function cancelListening() {
  if (!S || S.status !== 'listening') return;
  if (S.sttActive) { S.sttCancelled = true; abortBrowserStt(); }
  else cancelRecording();
  S.status = 'ready';
  renderControls();
  checkTimeUpWhenIdle();
}

function sendTyped() {
  if (!S) return;
  const el = $('#talkInput');
  const text = (el ? el.value : S.draftText || '').trim();
  if (!text) { toast('보낼 내용을 입력해 주세요', 'warn'); return; }
  if (S.status === 'speaking') skipSpeech();
  else if (S.status !== 'ready') return;
  S.draftText = text;
  processUserTurn({ kind: 'text', text, source: 'keyboard' });
}
function retryTurn() {
  if (!S || !S.lastFailedInput || S.status !== 'ready') return;
  processUserTurn(S.lastFailedInput);
}

function switchInputMode(mode, silent = false) {
  if (!INPUT_MODES[mode]) return;
  if (mode === 'browserStt' && !SR) { toast('이 브라우저는 음성 인식을 지원하지 않아요', 'warn'); return; }
  if (S && S.status === 'listening') { toast('녹음/인식 중에는 바꿀 수 없어요', 'warn'); return; }
  state.settings.inputMode = mode;
  saveState();
  if (!silent) toast(`${INPUT_MODES[mode].icon} ${INPUT_MODES[mode].label} 모드`, 'info', 1800);
  if (mode === 'record' && S) { ensureAudioContext(); getMicStream().catch(e => { toast(`${micErrorMsg(e)} → 키보드 모드로 전환`, 'error'); switchInputMode('keyboard', true); }); }
  if (S) renderControls();
}

function isTypingDraft() {
  return state.settings.inputMode === 'keyboard' && !!(S?.draftText || '').trim();
}
function checkTimeUpWhenIdle() {
  if (S && S.timeUp && !S.closing && S.status === 'ready' && !S.pauses.size && !isTypingDraft()) doClosing();
}

async function doClosing() {
  if (!S || S.closing) return;
  const sid = S.id;
  S.closing = true;
  S.status = 'closing';
  renderControls();
  let reply = '';
  try {
    S.abort = new AbortController();
    const { data } = await callGemini({
      role: S.chatRole,
      contents: [...historyToContents(S.history), { role: 'user', parts: [{ text: "(Time's up. Say a short, natural, warm goodbye that fits our conversation — 1-2 sentences, no question.)" }] }],
      systemInstruction: S.systemInstruction,
      schema: CLOSING_SCHEMA,
      thinking: 'low',
      signal: S.abort.signal
    });
    reply = String(data?.reply || '').trim();
  } catch (e) {
    if (isAbort(e)) return;
  }
  if (!S || S.id !== sid) return;
  if (!reply) reply = FALLBACK_CLOSINGS[S.stage];
  S.history.push({ role: 'model', text: reply });
  appendAiBubble(reply);
  await aiSpeak(reply);
  if (!S || S.id !== sid) return;
  finishSession();
}

async function endSessionManual() {
  if (!S) return;
  S.pauses.add('confirm');
  updateTimerUI();
  let ok;
  if (!S.turns.length) {
    ok = await showConfirm({ title: '대화 종료', body: '아직 주고받은 대화가 없어 리포트를 만들 수 없어요.\n그냥 나갈까요?', okText: '나가기', danger: true });
    if (!S) return;
    S.pauses.delete('confirm');
    if (ok) abortSession();
    else updateTimerUI();
    return;
  }
  ok = await showConfirm({ title: '대화 종료', body: `지금 종료하고 리포트를 받을까요? (${S.turns.length}턴 진행)`, okText: '📊 리포트 받기' });
  if (!S) return;
  S.pauses.delete('confirm');
  if (ok) finishSession();
  else { S.timer.last = performance.now(); updateTimerUI(); checkTimeUpWhenIdle(); }
}

function teardownSessionIO() {
  if (!S) return;
  S.abort?.abort();
  S.ttsAbort?.abort();
  cancelRecording();
  if (S.sttActive) { S.sttCancelled = true; abortBrowserStt(); }
  stopPlayback();
  stopTimer();
  closeModal('sos');
}
function abortSession() {
  teardownSessionIO();
  S = null;
  releaseMic();
  renderNav();
  renderTalk();
}

function buildDraft(s) {
  return {
    id: s.id,
    topic: s.topic,
    stage: s.stage,
    isRandom: s.isRandom,
    onCooldown: s.onCooldown,
    startedAt: s.startedAt,
    minutes: Math.max(0.1, Math.round(s.timer.elapsedMs / 6000) / 10),
    usedAudio: s.usedAudio,
    openingAngle: s.openingAngle,
    history: s.history.filter(h => h.text !== '(Session start)'),
    turns: s.turns
  };
}

function finishSession() {
  if (!S) return;
  teardownSessionIO();
  if (!S.turns.length) {
    toast('주고받은 대화가 없어 리포트 없이 종료했어요', 'info');
    S = null; releaseMic(); renderNav(); renderTalk();
    return;
  }
  const draft = buildDraft(S);
  savePendingReport(draft); // 리포트 실패·새로고침에도 세션 데이터 보존
  S = null;
  releaseMic();
  renderNav();
  generateReport(draft);
}

// ===== [SECTION: HUD] =====
const payloads = new Map();
let payloadSeq = 0;
function regPayload(p) { const k = `p${++payloadSeq}`; payloads.set(k, p); return k; }

function dexSaveBtn(payload, label = '📌 도감에 저장') {
  const saved = isInDex(payload.native, payload.original);
  const pid = regPayload(payload);
  return saved
    ? `<button data-action="saveDex" data-pid="${pid}" data-saved="1" class="tap shrink-0 rounded-lg px-3 text-xs font-semibold border border-emerald-500/40 text-emerald-300 bg-emerald-500/10">✅ 저장됨</button>`
    : `<button data-action="saveDex" data-pid="${pid}" class="tap shrink-0 rounded-lg px-3 text-xs font-semibold border border-amber-400/40 text-amber-200 hover:bg-amber-400/10">${esc(label)}</button>`;
}

function hudCardHtml(turn, idx, animate) {
  const h = turn.hud;
  const natural = /👍/.test(h.tipKo);
  return `
  <div class="${animate ? 'fade-in' : ''} rounded-xl border ${natural ? 'border-emerald-500/30' : 'border-slate-700/80'} bg-slate-900/80 p-3 text-sm" data-hud="${idx}">
    <div class="flex items-start gap-2 text-slate-400"><span class="shrink-0">🗣️</span><span class="break-words">${esc(h.original || turn.transcript)}</span></div>
    ${h.upgrade ? `<div class="flex items-start gap-2 mt-1.5 text-emerald-300 font-medium"><span class="shrink-0">✨</span><span class="break-words">${esc(h.upgrade)}</span></div>` : ''}
    ${h.tipKo ? `<div class="flex items-start gap-2 mt-1.5 text-amber-100/90"><span class="shrink-0">💡</span><span class="break-words">${esc(h.tipKo)}</span></div>` : ''}
    ${turn.pron ? `<div class="flex items-start gap-2 mt-1.5 text-sky-300/90"><span class="shrink-0">🔊</span><span class="break-words">${esc(turn.pron)}</span></div>` : ''}
    <div class="flex items-center justify-between gap-2 mt-2">
      <span class="text-[11px] text-slate-500">#${idx + 1} · ${esc(INPUT_MODES[turn.inputType === 'stt' ? 'browserStt' : turn.inputType === 'audio' ? 'record' : 'keyboard'].icon)}</span>
      ${h.upgrade ? dexSaveBtn({ type: 'hud', original: h.original || turn.transcript, native: h.upgrade, tipKo: h.tipKo, topicId: S?.topic.id || null }) : ''}
    </div>
  </div>`;
}

function renderHudList() {
  const list = $('#hudList');
  if (!list || !S) return;
  list.innerHTML = S.turns.length
    ? S.turns.map((t, i) => hudCardHtml(t, i, false)).reverse().join('')
    : `<div id="hudEmpty" class="text-xs text-slate-500 py-3 text-center">말하면 여기에 교정 카드가 소리 없이 쌓여요 · 대화는 끊기지 않아요</div>`;
  updateHudChrome();
}
function addHudCard(turn, idx) {
  const list = $('#hudList');
  if (!list || !S) return;
  $('#hudEmpty')?.remove();
  list.insertAdjacentHTML('afterbegin', hudCardHtml(turn, idx, true));
  list.scrollTop = 0;
  if (!S.hudOpen) S.hudUnseen++;
  updateHudChrome();
}
function toggleHud() {
  if (!S) return;
  S.hudOpen = !S.hudOpen;
  if (S.hudOpen) S.hudUnseen = 0;
  updateHudChrome();
}
function updateHudChrome() {
  if (!S) return;
  const list = $('#hudList'), badge = $('#hudBadge'), chev = $('#hudChevron');
  if (list) list.classList.toggle('hidden', !S.hudOpen);
  if (chev) chev.textContent = S.hudOpen ? '접기 ▾' : '펼치기 ▴';
  if (badge) {
    badge.textContent = S.hudUnseen ? `+${S.hudUnseen} 새 카드` : `${S.turns.length}`;
    badge.className = S.hudUnseen
      ? 'ml-2 rounded-full bg-amber-400 text-slate-950 text-[11px] font-bold px-2 py-0.5'
      : 'ml-2 rounded-full bg-slate-800 text-slate-300 text-[11px] px-2 py-0.5';
  }
}

// ===== [SECTION: TIMER_SOS] =====
let timerInterval = null;
function startTimer() {
  stopTimer();
  if (!S) return;
  S.timer.last = performance.now();
  timerInterval = setInterval(tickTimer, 250);
  updateTimerUI();
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}
// 사용자가 대화하는 시간만 센다 (excludeWaitTime이면 AI 생성·TTS 로딩·재생 중 정지)
function timerCounting() {
  if (!S || S.pauses.size || document.hidden) return false;
  if (S.status === 'openingFailed') return false;
  if (state.settings.excludeWaitTime) return S.status === 'ready' || S.status === 'listening';
  return true;
}
function tickTimer() {
  if (!S) { stopTimer(); return; }
  const now = performance.now();
  const dt = now - S.timer.last;
  S.timer.last = now;
  if (timerCounting()) S.timer.elapsedMs += Math.min(dt, 1000);
  if (S.timer.limitMs && !S.timeUp && S.timer.elapsedMs >= S.timer.limitMs) {
    S.timer.elapsedMs = S.timer.limitMs;
    S.timeUp = true;
    handleTimeUp();
  }
  updateTimerUI();
}
function handleTimeUp() {
  if (!S) return;
  if (S.status === 'ready' && !isTypingDraft()) {
    toast('⏰ 시간 종료! AI가 대화를 마무리해요', 'info');
    doClosing();
  } else if (S.status === 'listening' || isTypingDraft()) {
    toast('⏰ 시간 종료! 지금 하던 말까지만 마무리해서 보내 주세요', 'warn', 5000);
  } else {
    toast('⏰ 시간 종료! 이번 응답 후 마무리할게요', 'info');
  }
}
function updateTimerUI() {
  if (!S) return;
  const tEl = $('#timerText'), sEl = $('#timerState'), bar = $('#timerBar');
  if (!tEl) return;
  const lim = S.timer.limitMs;
  const left = lim - S.timer.elapsedMs;
  tEl.textContent = lim ? fmtClock(left, true) : fmtClock(S.timer.elapsedMs);
  tEl.classList.toggle('text-rose-300', !!lim && left <= 30000);
  tEl.classList.toggle('text-emerald-300', !(lim && left <= 30000));
  if (bar) bar.style.width = lim ? `${Math.min(100, (S.timer.elapsedMs / lim) * 100)}%` : '100%';
  if (bar) bar.classList.toggle('opacity-30', !lim);
  let label;
  if (S.timeUp) label = '⏰ 시간 종료';
  else if (S.pauses.has('sos')) label = '⏸ SOS 일시정지';
  else if (S.pauses.size) label = '⏸ 일시정지';
  else if (timerCounting()) label = lim ? '▶ 내 대화 시간' : '∞ 무제한 · 경과';
  else label = '⏸ AI 대기 (시간 제외)';
  if (sEl) sEl.textContent = label;
}

function onVisibilityChange() {
  if (document.hidden) {
    persistNow();
    if (!S) return;
    S.pauses.add('background');
    if (S.status === 'listening') {
      if (S.sttActive) { S.sttCancelled = true; abortBrowserStt(); } else cancelRecording();
      S.status = 'ready';
    }
    skipSpeech();
    renderControls();
    updatePauseOverlay();
  } else if (S && S.pauses.has('background')) {
    updatePauseOverlay();
    updateTimerUI();
  }
}
function resumeFromBackground() {
  ensureAudioContext();
  if (!S) return;
  S.pauses.delete('background');
  S.timer.last = performance.now();
  updatePauseOverlay();
  updateTimerUI();
  renderControls();
  checkTimeUpWhenIdle();
}
function updatePauseOverlay() {
  const el = $('#pauseOverlay');
  if (!el || !S) return;
  el.classList.toggle('hidden', !S.pauses.has('background'));
  el.classList.toggle('flex', S.pauses.has('background'));
}

const SOS_SYSTEM = `You are an expert English coach for Korean adult learners (target: TOEIC Speaking AH / OPIc AL).
The learner is in the middle of a spoken English conversation and wants to say something they only know how to say in Korean.
Give 2-3 natural expressions a native speaker would actually say in that context, ordered from casual to formal when possible.
For each: "expression" (English, ready to say out loud, fits the conversation), "register" (casual | neutral | formal), "nuanceKo" (한국어로 뉘앙스 차이와 언제 쓰는지 1~2문장), "example" (a short natural example sentence).
Respond ONLY with JSON matching the schema.`;
const SOS_SCHEMA = {
  type: 'OBJECT',
  properties: {
    expressions: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: {
          expression: { type: 'STRING' },
          register: { type: 'STRING', enum: ['casual', 'neutral', 'formal'] },
          nuanceKo: { type: 'STRING' },
          example: { type: 'STRING' }
        },
        required: ['expression', 'register', 'nuanceKo', 'example']
      }
    }
  },
  required: ['expressions']
};

async function askSos() {

// ===== [SECTION: REPORT] =====
const REPORT_SYSTEM = `You are a senior English speaking assessor who knows the TOEIC Speaking (levels NL~AH, 0-200) and OPIc (NL~AL) rubrics very well, and a warm, honest coach for Korean adult learners.
Analyze the session data and respond ONLY with JSON matching the schema.
Write every field ending in "Ko" in natural Korean. Quote the user's own sentences verbatim where asked. Grades are estimates, not official results.`;

function reportSchema(isCustom) {
  const STR = { type: 'STRING' }, INT = { type: 'INTEGER' };
  const properties = {
    estimatedGrade: { type: 'OBJECT', properties: { toeicSpeaking: STR, opic: STR, noteKo: STR }, required: ['toeicSpeaking', 'opic', 'noteKo'] },
    overallScore: INT,
    top3: { type: 'ARRAY', items: { type: 'OBJECT', properties: { mine: STR, native: STR, whyKo: STR }, required: ['mine', 'native', 'whyKo'] } },
    keyExpressions: { type: 'ARRAY', items: { type: 'OBJECT', properties: { expression: STR, meaningKo: STR, example: STR }, required: ['expression', 'meaningKo', 'example'] } },
    statScores: {
      type: 'OBJECT',
      properties: { fluency: INT, vocab: INT, grammar: INT, logic: INT, nuance: { type: 'INTEGER', nullable: true } },
      required: ['fluency', 'vocab', 'grammar', 'logic', 'nuance']
    },
    strengthsKo: STR,
    nextFocusKo: STR,
    sessionSummary: STR,
    anglesCovered: { type: 'ARRAY', items: STR }
  };
  const required = Object.keys(properties);
  if (isCustom) {
    properties.trackForCustomTopic = { type: 'INTEGER', description: '1-4' };
    properties.customTopicCard = {
      type: 'OBJECT',
      properties: {
        title: STR, titleKo: STR, subtitle: STR,
        starterQuestions: { type: 'ARRAY', items: STR },
        keyExpressions: { type: 'ARRAY', items: { type: 'OBJECT', properties: { en: STR, ko: STR }, required: ['en', 'ko'] } }
      },
      required: ['title', 'titleKo', 'subtitle', 'starterQuestions', 'keyExpressions']
    };
    required.push('trackForCustomTopic', 'customTopicCard');
  }
  return { type: 'OBJECT', properties, required };
}

function buildReportPrompt(draft) {
  const t = draft.topic;
  const track = TRACKS[t.track] || CUSTOM_TRACK;
  const stg = STAGES[draft.stage];
  const audioTurns = draft.turns.filter(x => x.inputType === 'audio').length;
  const transcript = draft.history.map(h => `${h.role === 'model' ? 'AI' : 'USER'}: ${h.text}`).join('\n');
  const turns = draft.turns.map((x, i) => ({
    n: i + 1, inputType: x.inputType, user: x.transcript, hud: x.hud,
    pronunciationNoteKo: x.pron, signals: x.signals, angle: x.angleTag
  }));
  return [
    'SESSION INFO',
    `- Stage ${draft.stage}: ${stg.name} (${stg.goal}). Style: ${stg.style}`,
    `- Topic: ${t.title} — ${t.subtitle} (Track: ${track.name})`,
    `- User talk time: ${draft.minutes} min, ${draft.turns.length} user turns (${audioTurns} audio, ${draft.turns.length - audioTurns} text)`,
    draft.usedAudio
      ? '- Audio input was used: evaluate nuance including pronunciation/intonation (see per-turn notes).'
      : '- TEXT-ONLY session (no audio at all): set statScores.nuance to null and do not evaluate pronunciation.',
    '',
    'FULL TRANSCRIPT',
    transcript,
    '',
    'PER-TURN DATA (JSON)',
    JSON.stringify(turns),
    '',
    'TASK',
    '- estimatedGrade: TOEIC Speaking level with score band (e.g. "AM (180~190)") and OPIc grade (e.g. "IH", "AL"). noteKo: 추정치이며 실제 시험과 다를 수 있다는 짧은 안내.',
    '- overallScore 0-100, where 80 = a solid performance for this stage.',
    '- top3: the user\'s 3 most improvable real sentences ("mine" quoted verbatim from USER lines), the most natural native version, and whyKo.',
    '- keyExpressions: exactly 3 expressions worth adopting for this topic next time, with meaningKo and an example tied to what the user talked about.',
    '- statScores 0-100 each. strengthsKo and nextFocusKo: 1-2 sentences each.',
    '- sessionSummary: 2-3 English sentences on what was discussed (used to pick fresh angles next time).',
    '- anglesCovered: 2-6 short English tags of the conversation angles covered.',
    t.isTemp
      ? `- This was a USER-DEFINED topic: "${t.userInput}". Choose trackForCustomTopic (1 = my life/routine/personal stories, 2 = everyday opinions, 3 = casual bro talk & daily situations, 4 = politics & diplomacy) and write customTopicCard: English title, Korean titleKo, Korean one-line subtitle, 3 English starterQuestions for future sessions, 4 keyExpressions {en, ko}.`
      : ''
  ].filter(x => x !== null).join('\n');
}

function normalizeReport(d, draft) {
  const str = v => String(v ?? '').trim();
  const arr = v => (Array.isArray(v) ? v : []);
  const g = isObj(d?.estimatedGrade) ? d.estimatedGrade : {};
  const ss = isObj(d?.statScores) ? d.statScores : {};
  const avg = k => {
    const v = draft.turns.map(t => t.signals?.[k]).filter(x => typeof x === 'number');
    return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : 60;
  };
  const statScores = {};
  for (const k of SIGNAL_KEYS) {
    const v = clampInt(ss[k], 0, 100, NaN);
    statScores[k] = Number.isFinite(v) ? v : avg(k);
  }
  if (!draft.usedAudio) statScores.nuance = null; // 텍스트 전용 세션은 nuance 평가 안 함
  const vals = Object.values(statScores).filter(v => v != null);
  return {
    estimatedGrade: {
      toeicSpeaking: str(g.toeicSpeaking) || '—',
      opic: str(g.opic) || '—',
      noteKo: str(g.noteKo) || 'AI 추정치이며 실제 시험 결과와 다를 수 있어요.'
    },
    overallScore: clampInt(d?.overallScore, 0, 100, Math.round(vals.reduce((a, b) => a + b, 0) / Math.max(1, vals.length))),
    top3: arr(d?.top3).filter(x => x && x.native).slice(0, 3).map(x => ({ mine: str(x.mine), native: str(x.native), whyKo: str(x.whyKo) })),
    keyExpressions: arr(d?.keyExpressions).filter(x => x && x.expression).slice(0, 3).map(x => ({ expression: str(x.expression), meaningKo: str(x.meaningKo), example: str(x.example) })),
    statScores,
    strengthsKo: str(d?.strengthsKo),
    nextFocusKo: str(d?.nextFocusKo),
    sessionSummary: str(d?.sessionSummary),
    anglesCovered: arr(d?.anglesCovered).map(str).filter(Boolean).slice(0, 8),
    trackForCustomTopic: d?.trackForCustomTopic != null ? clampInt(d.trackForCustomTopic, 1, 4, 1) : null,
    customTopicCard: isObj(d?.customTopicCard) ? d.customTopicCard : null
  };
}

// exp = round(대화분수 × 10 × (overallScore / 80) × 랜덤보너스(1.3|1) × 쿨타임감소(0.5|1))
function calcExp(minutes, score, isRandom, onCooldown) {
  return Math.max(0, Math.round(minutes * 10 * (score / 80) * (isRandom ? 1.3 : 1) * (onCooldown ? 0.5 : 1)));
}

function buildCustomTopic(draft, report) {
  const c = report.customTopicCard || {};
  const input = draft.topic.userInput || draft.topic.title;
  return normalizeTopic({
    id: uid('custom'),
    track: report.trackForCustomTopic || 1,
    title: c.title || input.slice(0, 60),
    titleKo: c.titleKo || input.slice(0, 40),
    subtitle: c.subtitle || input,
    starterQuestions: c.starterQuestions,
    keyExpressions: c.keyExpressions,
    createdAt: Date.now(),
    source: 'custom'
  }, 'custom');
}

function applyReport(draft, report) {
  const existing = state.sessions.find(s => s.id === draft.id);
  if (existing) return { exp: existing.expGained, topicId: existing.topicId, newTopic: null, duplicate: true };
  let topicId = draft.topic.id;
  let newTopic = null;
  if (draft.topic.isTemp) {
    newTopic = buildCustomTopic(draft, report);
    state.customTopics.push(newTopic);
    topicId = newTopic.id;
    state.dex.forEach(x => { if (x.topicId === draft.topic.id) x.topicId = topicId; });
  }
  const exp = calcExp(draft.minutes, report.overallScore, draft.isRandom, draft.onCooldown);
  const tp = state.topicProgress[topicId] || (state.topicProgress[topicId] = emptyProgress());
  tp.clearCount += 1;
  tp.lastClearedAt = Date.now();
  if (report.sessionSummary) tp.summaries = [...tp.summaries, report.sessionSummary].slice(-5);
  tp.anglesCovered = uniq([...tp.anglesCovered, ...report.anglesCovered, draft.openingAngle, ...draft.turns.map(t => t.angleTag)].filter(Boolean)).slice(-40);
  state.profile.exp += exp;
  state.sessions.unshift({
    id: draft.id,
    topicId,
    topicTitle: newTopic ? newTopic.title : draft.topic.title,
    stage: draft.stage,
    startedAt: draft.startedAt,
    minutes: draft.minutes,
    score: report.overallScore,
    expGained: exp,
    reportSummary: {
      toeicSpeaking: report.estimatedGrade.toeicSpeaking,
      opic: report.estimatedGrade.opic,
      statScores: report.statScores,
      strengthsKo: report.strengthsKo,
      nextFocusKo: report.nextFocusKo,
      turns: draft.turns.length,
      usedAudio: draft.usedAudio,
      isRandom: draft.isRandom,
      onCooldown: draft.onCooldown
    }
  });
  state.sessions = state.sessions.slice(0, MAX_SESSIONS);
  saveState();
  return { exp, topicId, newTopic, duplicate: false };
}

async function generateReport(draft) {
  if (!draft) return;
  talk.pending = null;
  talk.report = { status: 'loading', draft };
  switchView('talk');
  renderTalk();
  try {
    const { data, model } = await callGemini({
      role: 'analysis',
      contents: [{ role: 'user', parts: [{ text: buildReportPrompt(draft) }] }],
      systemInstruction: REPORT_SYSTEM,
      schema: reportSchema(!!draft.topic.isTemp),
      thinking: 'high'
    });
    const report = normalizeReport(data, draft);
    const result = applyReport(draft, report);
    clearPendingReport();
    talk.report = { status: 'done', draft, report, model, ...result };
    renderHeader();
    renderNav();
    if (currentView === 'talk') { renderTalk(); celebrateExp(result.exp); }
    else toast(`📊 리포트 완료! +${result.exp} EXP`, 'success');
  } catch (e) {
    talk.report = { status: 'error', draft, error: e.message };
    if (currentView === 'talk') renderTalk();
    toast(`리포트 생성 실패: ${e.message} (세션 데이터는 보존돼요)`, 'error', 7000);
  }
}

async function discardReport() {
  const ok = await showConfirm({ title: '리포트 버리기', body: '이 세션의 리포트와 EXP를 받지 않고 기록을 버릴까요?', okText: '버리기', danger: true });
  if (!ok) return;
  clearPendingReport();
  talk.report = null;
  renderTalk();
}

function celebrateExp(exp) {
  const el = $('#expCount');
  if (!el) return;
  const start = performance.now(), dur = 1300;
  const step = now => {
    const p = Math.min(1, (now - start) / dur);
    el.textContent = Math.round(exp * (1 - Math.pow(1 - p, 3))).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  const box = $('#expBox');
  if (!box) return;
  const r = box.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 140;
    p.style.left = `${cx}px`;
    p.style.top = `${cy}px`;
    p.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
    p.style.setProperty('--dy', `${Math.sin(ang) * dist - 40}px`);
    p.style.animationDelay = `${Math.random() * 0.25}s`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1700);
  }
}

const dexUi = { q: '', type: 'all', topic: 'all' };
const DEX_TYPE_LABEL = { hud: '⚡ HUD', sos: '⏸️ SOS', report: '📊 리포트' };

function isInDex(native, original) {
  const n = String(native || '').trim(), o = String(original || '').trim();
  return state.dex.some(d => d.native === n && d.original === o);
}
function addToDex({ type, original, native, tipKo, topicId }) {
  native = String(native || '').trim();
  original = String(original || '').trim();
  if (!native) return null;
  const exists = state.dex.find(d => d.native === native && d.original === original);
  if (exists) return exists.id;
  const item = {
    id: uid('dex'), type: DEX_TYPE_LABEL[type] ? type : 'hud',
    original, native, tipKo: String(tipKo || '').trim(), topicId: topicId || null,
    createdAt: Date.now(), box: 1, lastReviewedAt: null, reviewCount: 0
  };
  state.dex.unshift(item);
  saveState();
  renderNav();
  return item.id;
}
function saveDexFromButton(el) {
  if (el.dataset.saved) return;

}
async function deleteDex(id) {

      </select>

function renderDexList() {
  const box = $('#dexList');
  if (!box) return;
  const q = dexUi.q.trim().toLowerCase();
  const items = state.dex
    .filter(d => dexUi.type === 'all' || d.type === dexUi.type)
    .filter(d => dexUi.topic === 'all' || d.topicId === dexUi.topic)
    .filter(d => !q || `${d.original} ${d.native} ${d.tipKo}`.toLowerCase().includes(q))
    .sort((a, b) => b.createdAt - a.createdAt);
  if (!items.length) {
    box.innerHTML = `<div class="rounded-2xl border border-dashed border-slate-700 p-8 text-center text-slate-400 text-sm">${state.dex.length ? '조건에 맞는 표현이 없어요' : '아직 저장한 표현이 없어요.<br>대화 중 HUD 카드·SOS·리포트에서 📌 버튼을 눌러 모아 보세요.'}</div>`;

function toast(msg, type = 'info', ms = 3500) {
  const root = $('#toastRoot');
  if (!root) return;
  const colors = {
    info: 'border-slate-600 bg-slate-800/95 text-slate-100',
    success: 'border-emerald-500/50 bg-emerald-950/95 text-emerald-100',
    warn: 'border-amber-400/50 bg-amber-950/95 text-amber-100',
    error: 'border-rose-500/50 bg-rose-950/95 text-rose-100'
  };
  const el = document.createElement('div');
  el.className = `toast-in pointer-events-auto max-w-md w-full rounded-xl border px-4 py-2.5 text-sm shadow-xl backdrop-blur ${colors[type] || colors.info}`;
  el.textContent = msg;
  el.addEventListener('click', () => el.remove());
  root.appendChild(el);
  while (root.children.length > 4) root.firstChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms);
}
function toastOnce(key, msg, type = 'info', windowMs = 30000) {
  const last = runtime.toastOnce.get(key) || 0;
  if (Date.now() - last < windowMs) return;
  runtime.toastOnce.set(key, Date.now());
  toast(msg, type, 5000);
}

const modalStack = [];
function openModal(html, { id = uid('m'), dismissible = true, size = 'md', onClose } = {}) {
  closeModal(id);
  const wrap = document.createElement('div');
  wrap.dataset.modalId = id;
  wrap.className = 'fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-slate-950/70 backdrop-blur-sm sm:p-4';
  wrap.innerHTML = `<div class="sheet-in w-full ${size === 'lg' ? 'sm:max-w-2xl' : 'sm:max-w-md'} max-h-[92vh] overflow-y-auto scroll-thin bg-slate-900 border border-slate-700 rounded-t-3xl sm:rounded-3xl shadow-2xl" style="padding-bottom: var(--sab)">${html}</div>`;
  if (dismissible) wrap.addEventListener('click', e => { if (e.target === wrap) closeModal(id); });
  $('#modalRoot').appendChild(wrap);
  modalStack.push({ id, onClose, el: wrap, dismissible });
  refreshIcons();
  return id;
}
function closeModal(id) {
  const i = id ? modalStack.findIndex(m => m.id === id) : modalStack.length - 1;
  if (i < 0) return;
  const [m] = modalStack.splice(i, 1);
  m.el.remove();
  m.onClose && m.onClose();
}
function closeTopModal() {
  const top = modalStack[modalStack.length - 1];
  if (!top) return;
  if (top.id === 'sos') closeSos(); else closeModal(top.id);
}
function showConfirm({ title, body, okText = '확인', cancelText = '취소', danger = false }) {
  return new Promise(resolve => {
    const id = uid('cf');
    let done = false;
    const finish = v => { if (done) return; done = true; closeModal(id); resolve(v); };
    openModal(`
      <div class="p-5">
        <h3 class="text-lg font-bold">${esc(title)}</h3>
        <p class="text-sm text-slate-300 mt-2 whitespace-pre-line">${esc(body)}</p>
        <div class="grid grid-cols-2 gap-2 mt-5">
          <button data-cf="0" class="tap rounded-xl border border-slate-700 bg-slate-800">${esc(cancelText)}</button>
          <button data-cf="1" class="tap rounded-xl font-bold ${danger ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-slate-950'}">${esc(okText)}</button>
        </div>
      </div>`, { id, onClose: () => { if (!done) { done = true; resolve(false); } } });
    const entry = modalStack.find(m => m.id === id);
    entry.el.querySelectorAll('[data-cf]').forEach(b => b.addEventListener('click', () => finish(b.dataset.cf === '1')));
  });
}

async function pickTopic(id) {
  if (S) { toast('진행 중인 대화가 있어요. 먼저 종료해 주세요', 'warn'); switchView('talk'); return; }
  const topic = getTopic(id);
  if (!topic) { toast('토픽을 찾을 수 없어요', 'error'); return; }
  const left = cooldownLeftMs(id);
  let onCooldown = false;
  if (left > 0) {
    const ok = await showConfirm({
      title: '⏳ 쿨타임 중인 토픽',
      body: `이 토픽은 ${fmtCooldown(left)} 후에 쿨타임이 끝나요.\n지금 진행하면 경험치가 50%만 지급돼요. 계속할까요?`,
      okText: '경험치 50%로 진행'
    });
    if (!ok) return;
    onCooldown = true;
  }
  openSetup(topic, { isRandom: false, onCooldown });
}
function smartRandom() {
  if (S) { toast('진행 중인 대화가 있어요. 먼저 종료해 주세요', 'warn'); switchView('talk'); return; }
  const onlyCore = state.settings.onlyCoreTracksInRandom;
  const all = allTopics();
  const available = all.filter(t => cooldownLeftMs(t.id) === 0);
  const core = available.filter(t => t.track <= 2), sub = available.filter(t => t.track >= 3);
  let pool;
  if (onlyCore) pool = core;
  else pool = Math.random() < 0.7 ? (core.length ? core : sub) : (sub.length ? sub : core);
  if (!pool.length) {
    const cands = (onlyCore ? all.filter(t => t.track <= 2) : all).slice().sort((a, b) => cooldownLeftMs(a.id) - cooldownLeftMs(b.id));
    const soon = cands[0];
    toast(soon ? `뽑을 수 있는 토픽이 없어요. 가장 먼저 열리는 토픽: "${soon.title}" (⏳ ${fmtCooldown(cooldownLeftMs(soon.id))})` : '토픽이 없어요', 'warn', 7000);
    return;
  }
  const topic = pool[Math.floor(Math.random() * pool.length)];
  toast(`🎲 ${topic.title} 당첨! (+30% EXP)`, 'success');
  openSetup(topic, { isRandom: true, onCooldown: false });
}
function startCustomTopic() {
  if (S) { toast('진행 중인 대화가 있어요. 먼저 종료해 주세요', 'warn'); switchView('talk'); return; }

    starterQuestions: [], keyExpressions: [], source: 'temp'
  });
}

const personaName = stage => STAGES[stage].persona.split(',')[0];
function aiBubbleHtml(text, idx, animate) {

function userBubbleHtml(text, inputType, animate) {

  return `
  <div class="flex justify-end ${animate ? 'fade-in' : ''}">
    <div class="max-w-[85%] rounded-2xl rounded-tr-sm bg-emerald-500/15 border border-emerald-500/30 px-3.5 py-2.5">
