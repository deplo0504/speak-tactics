    startedAt: Date.now(),
    history: [], turns: [], log: [],
    usedAudio: false,
    status: 'opening',
    timer: { limitMs: state.settings.timerPreset ? state.settings.timerPreset * 60000 : 0, elapsedMs: 0, last: performance.now() },
    pauses: new Set(),
    timeUp: false, closing: false,
    hudOpen: true, hudUnseen: 0,
    chatRole: sessionRoleFor(topic, stage),
    systemInstruction: buildSystemInstruction(topic, stage, tp),
    draftText: '', lastFailedInput: null, ttsMode: null, openingAngle: null,
    startClickAt: clickAt, dataPending: null
  };
  talk.pending = null;
  talk.report = null;
  renderNav();
  renderTalk();
  startTimer();
  await requestOpening();
}

/**
 * AI 대사 1줄을 화면에 띄우고 바로 읽기 시작하는 헬퍼. 스트리밍에서 reply가 완성되는 즉시 show()가 불린다.
 * 같은 줄은 한 번만 표시된다. 읽기가 끝나면 (시간 종료 처리 중이 아니면) 곧바로 사용자 차례로 넘긴다.
 */
function makeLineStarter(sid, metric, onShown) {
  const line = { reply: null, speakP: null };
  line.show = reply => {
    if (!S || S.id !== sid || line.reply != null || !reply) return;
    line.reply = reply;
    onShown && onShown(reply);
    line.logIdx = appendAiBubble(reply);
    line.speakP = aiSpeak(reply, metric).then(() => {
      if (metric) { metric.speakEnded = true; maybeFinalizeMetric(metric); }
      if (S && S.id === sid && !S.timeUp && !S.closing && (S.status === 'speaking' || S.status === 'processing')) {
        S.status = 'ready';
        renderControls();
        maybeAutoListen();
      }
    });
  };
  return line;
}

async function requestOpening() {
  if (!S) return;
  const sid = S.id;
  S.status = 'opening';
  renderControls();
  const m = newMetric('opening', null);
  if (S.startClickAt != null) { m.t0 = S.startClickAt; S.startClickAt = null; }
  const line = makeLineStarter(sid, m, reply => S.history.push({ role: 'user', text: '(Session start)' }, { role: 'model', text: reply }));
  try {
    let data = null;
    const pf = takePrefetch(prefetchKey(S.topic, S.stage));
    if (pf) {
      try {
        const r = await pf.promise;
        if (!S || S.id !== sid) return;
        data = r.data;
        const t = performance.now();
        Object.assign(m, { prefetched: true, requested: pf.meta.requested, responder: r.model, attempts: pf.meta.attempts || [], trace: pf.meta.trace || [], hedged: pf.meta.hedged, tReqStart: m.t0, tReply: t, tFull: t });
        noteResponder(r.model, S.chatRole, (pf.meta.attempts || []).length > 0);
      } catch (e) {
        if (!S || S.id !== sid) return;
        m.prefetchFailed = true;
      }
    }
    if (!data) {
      S.abort = new AbortController();
      const r = await callGemini({
        role: S.chatRole,
        contents: [{ role: 'user', parts: [{ text: OPENING_KICKOFF }] }],
        systemInstruction: S.systemInstruction,
        schema: OPENING_SCHEMA,
        thinking: chatThinking(),
        signal: S.abort.signal,
        meta: m,
        fast: true,
        stream: { onReply: line.show }
      });
      if (!S || S.id !== sid) return;
      data = r.data;
    }
    S.openingAngle = String(data?.angleTag || '').trim() || null;
    line.show(String(data?.reply || '').trim() || "Hey! Good to see you. So, what's been going on with you lately?");
    maybeFinalizeMetric(m);
    await line.speakP;
    if (!S || S.id !== sid) return;
    if (S.status === 'processing' || S.status === 'speaking' || S.status === 'opening') { S.status = 'ready'; renderControls(); }
    checkTimeUpWhenIdle();
    maybeAutoListen();
  } catch (e) {
    if (isAbort(e) || !S || S.id !== sid) return;
    m.error = e.message;
    finalizeMetric(m);
    toast(`첫 질문을 받지 못했어요: ${e.message}`, 'error', 6000);
    S.status = 'openingFailed';
    renderControls();
  }
}

async function aiSpeak(text, metric = null) {
  if (!S) return;
  const sid = S.id;
  S.status = 'processing';
  renderControls();
  while (S && S.id === sid && isHardPaused()) await sleep(200);
  if (!S || S.id !== sid) return;
  S.ttsAbort = new AbortController();
  await speak(text, {
    signal: S.ttsAbort.signal,
    metric,
    onStart: m => {
      if (S && S.id === sid && S.status === 'processing') { S.status = 'speaking'; S.ttsMode = m; renderControls(); }
      if (metric) setTimeout(() => maybeFinalizeMetric(metric), 0);
    }
  });
}
function skipSpeech() {
  if (!S) return;
  S.ttsAbort?.abort();
  stopPlayback();
}
async function replayText(text) {
  ensureAudioContext();
  if (!text) return;
  if (!S) { speak(text); return; }
  if (S.status !== 'ready') { toast('지금은 다시 듣기를 할 수 없어요', 'warn'); return; }
  const sid = S.id;
  await aiSpeak(text);
  if (S && S.id === sid && (S.status === 'processing' || S.status === 'speaking')) { S.status = 'ready'; renderControls(); }
  checkTimeUpWhenIdle();
  maybeAutoListen();
}

// ---- 듣기(전사)와 대답을 분리 ----
// 녹음은 대화 기록 없이 전사 전용 호출로 먼저 받아쓴다. 대화 맥락이 없으니 "그럴듯한 말"로 지어낼 여지가 없다.
const TRANSCRIBE_SYSTEM = `You are a precise speech-to-text transcriber. You hear one short recording of a Korean adult practicing spoken English.
RULES
- Write EXACTLY the words that were spoken, in order. Keep grammar mistakes, wrong words, repetitions, false starts and fillers (um, uh, like) exactly as spoken.
- Never correct, complete, paraphrase, summarize or improve anything. Never add words that were not clearly spoken.
- You have NO conversation context. Do not guess what the speaker probably meant.
- If a word or part is unclear, write [inaudible] for that part instead of guessing.
- If the speaker says Korean words, write them in Korean as spoken.
- If there is no speech (silence or noise only), set hasSpeech to false and transcript to "".
- pronunciationNoteKo: one short line in Korean about the most noticeable pronunciation or intonation issue, or null if nothing stands out.
- pronunciationScore: 0-100 for pronunciation and intonation clarity (0 if no speech).
Respond ONLY with JSON matching the schema.`;
const TRANSCRIBE_SCHEMA = {
  type: 'OBJECT',
  properties: {
    transcript: { type: 'STRING', description: 'Verbatim words spoken. [inaudible] for unclear parts. "" if no speech.' },
    hasSpeech: { type: 'BOOLEAN' },
    pronunciationNoteKo: { type: 'STRING', nullable: true },
    pronunciationScore: { type: 'INTEGER' }
  },
  required: ['transcript', 'hasSpeech', 'pronunciationScore'],
  propertyOrdering: ['transcript', 'hasSpeech', 'pronunciationNoteKo', 'pronunciationScore']
};

// 반환: { transcript, pron, pronScore }. 전사 시간·업로드·시도 내역은 턴 계측(m)에 합친다.
async function transcribeAudio(prep, m) {
  const tm = { trackUpload: true, attempts: [], trace: [] };
  S.abort = new AbortController();
  try {
    const { data } = await callGemini({
      role: 'transcribe',
      contents: [{ role: 'user', parts: [{ text: 'Transcribe this recording verbatim.' }, { inlineData: prep.part }] }],
      systemInstruction: TRANSCRIBE_SYSTEM,
      schema: TRANSCRIBE_SCHEMA,
      thinking: 'minimal',
      generationConfig: { temperature: 0 },
      signal: S.abort.signal,
      meta: tm,
      fast: true,
      timeScale: Math.max(1, (prep.duration || 10) / 15) // 긴 녹음은 시간 제한을 늘린다
    });
    let transcript = String(data?.transcript || '').replace(/\s+/g, ' ').trim();
    if (data?.hasSpeech === false || /^(\[inaudible\]\s*)+$/i.test(transcript)) transcript = '';
    const pronRaw = data?.pronunciationNoteKo == null ? '' : String(data.pronunciationNoteKo).trim();
    return {
      transcript,
      pron: pronRaw && !/^(null|none|없음)$/i.test(pronRaw) ? pronRaw : null,
      pronScore: clampInt(data?.pronunciationScore, 0, 100, 60)
    };
  } finally {
    m.tUploaded = tm.tUploaded ?? null;
    m.tTranscribed = performance.now();
    m.transcribeModel = tm.responder || null;
    m.transcribeTrace = tm.trace;
    m.attempts.push(...tm.attempts.map(a => ({ ...a, stage: '전사' })));
  }
}

function normalizeTurn(d, localTranscript, inputType, heard = null) {
  const sig = isObj(d?.signals) ? d.signals : {};
  const hud = isObj(d?.hud) ? d.hud : {};
  const transcript = String(localTranscript ?? d?.transcript ?? '').trim();
  return {
    transcript,
    reply: String(d?.reply || '').trim() || 'Got it — tell me a bit more about that?',
    hud: {
      original: String(hud.original || transcript).trim(),
      upgrade: String(hud.upgrade || '').trim(),
      tipKo: String(hud.tipKo || '').trim()
    },
    pron: heard ? heard.pron : null, // 발음 메모는 대화 맥락 없이 녹음만 들은 전사 호출에서 받는다
    signals: {
      fluency: clampInt(sig.fluency, 0, 100, 60), vocab: clampInt(sig.vocab, 0, 100, 60),
      grammar: clampInt(sig.grammar, 0, 100, 60), logic: clampInt(sig.logic, 0, 100, 60),
      nuance: inputType === 'audio' ? clampInt(heard?.pronScore ?? sig.nuance, 0, 100, 60) : null
    },
    angleTag: String(d?.angleTag || '').trim().slice(0, 60),
    inputType,
    at: Date.now()
  };
}

async function processUserTurn(input) {
  if (!S) return;
  const sid = S.id;
  const timeUpAtSend = S.timeUp;
  const prevData = S.dataPending;
  let releaseData = () => {};
  S.dataPending = new Promise(r => { releaseData = r; });
  const inputType = input.kind === 'audio' ? 'audio' : input.source;
  const m = newMetric('turn', inputType);
  if (input.t0 != null) m.t0 = input.t0;
  S.status = 'processing';
  S.lastFailedInput = null;
  if (inputType === 'keyboard') { S.draftText = ''; const ti = $('#talkInput'); if (ti) ti.value = ''; }
  renderControls();
  const userIdx = appendUserBubble(inputType === 'audio' ? '🎙️ 듣는 중…' : input.text.trim(), inputType, inputType === 'audio');
  if (input.kind === 'audio' && input.blob) {
    input.audioUrl = input.audioUrl || URL.createObjectURL(input.blob);
    S.log[userIdx].audioUrl = input.audioUrl;
    refreshUserBubble(userIdx);
  }
  const line = makeLineStarter(sid, m);
  try {
    if (prevData) await prevData; // 끼어들기 했다면 이전 턴의 기록·HUD가 확정된 뒤 보낸다
    if (!S || S.id !== sid) return;
    let localTranscript, heard = null, noteKind = input.source;
    if (input.kind === 'audio') {
      const prep = input.prepared || await prepareAudioForGemini(input.blob);
      if (!S || S.id !== sid) return;
      if (prep.tooShort) {
        removeLogEntry(userIdx);
        m.error = '녹음이 너무 짧음';
        finalizeMetric(m);
        toast('녹음이 너무 짧아요. 조금 더 길게 말해 주세요', 'warn');
        S.status = 'ready'; renderControls(); checkTimeUpWhenIdle(); maybeAutoListen();
        return;
      }
      input.prepared = prep;
      // 1) 듣기: 전사 전용 호출 (재시도 때는 이미 받은 전사를 재사용)
      heard = input.heard || await transcribeAudio(prep, m);
      if (!S || S.id !== sid) return;
      input.heard = heard;
      if (!heard.transcript) {
        S.log[userIdx].text = '(알아듣지 못함)';
        S.log[userIdx].pending = false;
        refreshUserBubble(userIdx);
        m.error = '말소리를 알아듣지 못함';
        m.tFull = performance.now();
        finalizeMetric(m);
        toast('목소리를 알아듣지 못했어요. 🔁 내 녹음으로 확인하고 다시 말해 주세요', 'warn', 5000);
        S.status = 'ready'; renderControls(); checkTimeUpWhenIdle(); maybeAutoListen();
        return;
      }
      updateUserBubble(userIdx, heard.transcript); // AI가 대답하기 전에 무엇으로 들었는지 먼저 보여 준다
      if (/\[inaudible\]/i.test(heard.transcript)) toastOnce('inaudible', '일부가 잘 안 들렸어요. 틀리면 말풍선의 ✏️ 고치기를 누르세요', 'info', 60000);
      localTranscript = heard.transcript;
      noteKind = 'voiceText';
    } else {
      localTranscript = input.text.trim();
    }
    // 2) 대답: 텍스트만 보낸다 (스트리밍으로 대사 먼저)
    const parts = [{ text: buildTurnNote(noteKind, timeUpAtSend) }, { text: localTranscript }];
    S.abort = new AbortController();
    m.tReqStart = null;
    const { data, partial } = await callGemini({
      role: S.chatRole,
      contents: [...historyToContents(S.history), { role: 'user', parts }],
      systemInstruction: S.systemInstruction,
      schema: TURN_SCHEMA,
      thinking: chatThinking(),
      signal: S.abort.signal,
      meta: m,
      fast: true,
      stream: { onReply: line.show }
    });
    if (!S || S.id !== sid) return;
    const turn = normalizeTurn(data, localTranscript, inputType, heard);
    if (line.reply != null) turn.reply = line.reply;
    turn.hudMissing = !!partial;
    const prevLast = lastTurnLogIdx();
    turn.userLogIdx = userIdx;
    turn.historyIdx = S.history.length;
    S.turns.push(turn);
    if (inputType === 'audio') S.usedAudio = true;
    S.history.push({ role: 'user', text: turn.transcript }, { role: 'model', text: turn.reply });
    addHudCard(turn, S.turns.length - 1); // HUD·signals는 대사 뒤에 조용히 도착
    releaseData();
    line.show(turn.reply); // 스트리밍이 아니었으면 여기서 표시·재생
    turn.aiLogIdx = line.logIdx;
    if (prevLast >= 0) refreshUserBubble(prevLast, false);
    refreshUserBubble(userIdx, true);
    maybeFinalizeMetric(m);
    await line.speakP;
    if (!S || S.id !== sid) return;
    if (timeUpAtSend) { finishSession(); return; }
    if (S.status === 'processing' || S.status === 'speaking') { S.status = 'ready'; renderControls(); }
    checkTimeUpWhenIdle();
    maybeAutoListen();
  } catch (e) {
    if (isAbort(e) || !S || S.id !== sid) return;
    removeLogEntry(userIdx);
    m.error = e.message;
    finalizeMetric(m);
    toast(`응답 실패: ${e.message}`, 'error', 6000);
    if (inputType === 'keyboard') S.draftText = input.text;
    S.lastFailedInput = input;
    S.status = 'ready';
    renderControls();
  } finally {
    releaseData();
  }
}

// ---- 마지막 턴 고치기 / 다시 말하기 / 내 녹음 듣기 ----
function canEditTurn(idx) {
  if (!S) return false;
  if (S.closing || S.timeUp) { toast('시간이 끝나 고칠 수 없어요', 'warn'); return false; }
  if (!['ready', 'speaking'].includes(S.status)) { toast('AI 응답이 끝난 뒤 고칠 수 있어요', 'info'); return false; }
  if (lastTurnLogIdx() !== idx) { toast('마지막 답변만 고칠 수 있어요', 'info'); return false; }
  return true;
}
// 마지막 턴(내 말 + AI 대답 + HUD)을 대화에서 지운다
function rewindLastTurn() {
  const turn = S.turns[S.turns.length - 1];
  if (!turn) return null;
  skipSpeech();
  S.turns.pop();
  S.history.splice(turn.historyIdx);
  removeLogEntry(turn.userLogIdx);
  if (turn.aiLogIdx != null && turn.aiLogIdx >= 0) removeLogEntry(turn.aiLogIdx);
  S.usedAudio = S.turns.some(t => t.inputType === 'audio');
  renderHudList();
  refreshEditActions();
  if (S.status === 'speaking' || S.status === 'processing') S.status = 'ready';
  renderControls();
  return turn;
}
function editTurn(idx) {
  if (!canEditTurn(idx)) return;
  skipSpeech();
  S.pauses.add('edit');
  updateTimerUI();
  const text = S.log[idx]?.text || '';
  openModal(`
    <div class="p-5 space-y-3">
      <h3 class="text-lg font-bold">✏️ 내 답변 고치기</h3>
      <p class="text-sm text-slate-400">잘못 들은 부분을 실제로 한 말로 고쳐 주세요. 이 턴의 AI 대답과 교정 카드는 지우고, 고친 문장으로 다시 대답을 받아요. (타이머 정지 중)</p>
      <textarea id="editTranscript" rows="4" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-400 outline-none px-3 py-2" autocapitalize="sentences">${esc(text)}</textarea>
      <div class="grid grid-cols-2 gap-2">
        <button data-action="closeTopModal" class="tap rounded-xl border border-slate-700">취소</button>
        <button data-action="submitEdit" data-idx="${idx}" class="tap rounded-xl bg-emerald-500 text-slate-950 font-bold">이대로 다시 보내기</button>
      </div>
    </div>`, { id: 'edit', onClose: () => { if (S) { S.pauses.delete('edit'); S.timer.last = performance.now(); updateTimerUI(); maybeAutoListen(); } } });
  setTimeout(() => $('#editTranscript')?.focus(), 50);
}
function submitEdit(idx) {
  const text = ($('#editTranscript')?.value || '').trim();
  if (!text) { toast('고친 문장을 입력해 주세요', 'warn'); return; }
  closeModal('edit');
  if (!canEditTurn(idx)) return;
  rewindLastTurn();
  processUserTurn({ kind: 'text', text, source: 'edited', t0: performance.now() });
}
function redoTurn(idx) {
  if (!canEditTurn(idx)) return;
  rewindLastTurn();
  toast('🎙️ 이번 답변을 지웠어요. 다시 말해 주세요', 'info', 2500);
  micTap();
}
function replayMine(idx) {
  const url = S?.log[idx]?.audioUrl;
  if (!url) return;
  if (S.status === 'listening') { toast('녹음 중에는 들을 수 없어요', 'warn'); return; }
  if (S.status === 'speaking') skipSpeech();
  try { audio.mineEl?.pause(); } catch {}
  audio.mineEl = new Audio(url);
  audio.mineEl.play().catch(e => toast(`녹음을 재생하지 못했어요: ${e.message}`, 'error'));
}

// ---- 핸즈프리: AI 말이 끝나 내 차례가 되면 자동으로 녹음 시작 ----
// 실패한 턴 직후·일시정지·시간 종료·창이 열려 있을 때는 시작하지 않는다
function maybeAutoListen() {
  if (!S || !state.settings.handsFree || !['record', 'browserStt'].includes(state.settings.inputMode)) return;
  const sid = S.id;
  clearTimeout(S.autoListenT);
  S.autoListenT = setTimeout(() => {
    if (!S || S.id !== sid || S.status !== 'ready' || S.pauses.size || S.timeUp || S.closing || S.lastFailedInput || modalStack.length || document.hidden) return;
    micTap();
  }, 350);
}

// ---- 일시정지 / 재개 ----
const isHardPaused = () => !!S && (S.pauses.has('manual') || S.pauses.has('background'));
function pauseSession() {
  if (!S || S.pauses.has('manual')) return;
  const last = S.log[S.log.length - 1];
  // AI가 말하던(또는 음성을 불러오던) 중이면 재개할 때 그 대사를 다시 들려준다
  S.replayOnResume = ['speaking', 'processing'].includes(S.status) && last?.role === 'ai' && !last.removed;
  if (S.status === 'listening') {
    if (S.sttActive) { S.sttCancelled = true; abortBrowserStt(); } else cancelRecording();
    S.status = 'ready';
    toast('녹음 중이던 말은 지웠어요. 재개한 뒤 다시 말해 주세요', 'info', 4000);
  }
  clearTimeout(S.autoListenT);
  S.pauses.add('manual');
  skipSpeech();
  renderControls();
  updatePauseOverlay();
  updateTimerUI();
}
function resumeSession() {
  ensureAudioContext();
  if (!S) return;
  S.pauses.delete('manual');
  S.pauses.delete('background');
  S.timer.last = performance.now();
  updatePauseOverlay();
  updateTimerUI();
  renderControls();
  if (S.replayOnResume && S.status === 'ready') { S.replayOnResume = false; replayText(lastAiText()); return; }
  S.replayOnResume = false;
  checkTimeUpWhenIdle();
  maybeAutoListen();
}
function togglePause() {
  if (!S) return;
  if (isHardPaused()) resumeSession(); else pauseSession();
}

// Space: 녹음 중이면 내 턴 끝내기 · 내 차례면 녹음 시작 · AI가 말하는 중이면 건너뛰기 · 일시정지면 재개
function spaceAction() {
  if (!S) return;
  if (isHardPaused()) { resumeSession(); return; }
  if (S.status === 'listening') { stopListening(); return; }
  if (S.status === 'speaking') { skipSpeech(); return; }
  if (S.status === 'ready' && state.settings.inputMode !== 'keyboard') micTap();
}

async function micTap() {
  if (!S) return;
  ensureAudioContext();
  if (S.status === 'listening') { stopListening(); return; }
  if (S.status === 'speaking') { skipSpeech(); } // 끼어들기: AI 음성 중단 후 바로 녹음
  else if (S.status !== 'ready') return;
  if (S.pauses.size) { toast('일시정지 상태예요. 먼저 재개해 주세요', 'warn'); return; }
  const mode = state.settings.inputMode;
  if (mode === 'record') startListeningRecord();
  else if (mode === 'browserStt') startListeningStt();
}

async function startListeningRecord() {
  const sid = S.id;
  S.status = 'listening';
  S.sttActive = false;
  renderControls();
  try {
    await startRecording(reason => {
      if (!S || S.id !== sid || S.status !== 'listening') return;
      if (reason === 'idle') stopListeningIdle(); else stopListening();
    });
  } catch (e) {
    cancelRecording();
    if (!S || S.id !== sid) return;
    toast(micErrorMsg(e), 'error', 6000);
    S.status = 'ready';
    if (isPermissionError(e) || /MediaRecorder/.test(e.message || '')) switchInputMode('keyboard', true);
    renderControls();
  }
}

async function startListeningStt() {
  const sid = S.id;
  S.status = 'listening';
  S.sttActive = true;
  S.sttCancelled = false;
  renderControls();
  const startedAt = performance.now();
  let lastHeardAt = 0;
  const watch = setInterval(() => {
    if (!S || S.id !== sid || S.status !== 'listening' || !S.sttActive) { clearInterval(watch); return; }
    const now = performance.now();
    if (state.settings.autoStopOnSilence && lastHeardAt && now - lastHeardAt > SILENCE.holdMs) { clearInterval(watch); stopBrowserStt(); }
    else if (!lastHeardAt && now - startedAt > SILENCE.idleMs) { clearInterval(watch); stopListeningIdle(); }
  }, 250);
  try {
    const text = await startBrowserStt({
      lang: 'en-US',
      continuous: true,
      onInterim: t => { lastHeardAt = performance.now(); const el = $('#sttInterim'); if (el) el.textContent = t || '듣는 중…'; }
    });
    clearInterval(watch);
    if (!S || S.id !== sid) return;
    S.sttActive = false;
    if (S.sttCancelled) { S.sttCancelled = false; if (S.status === 'listening') S.status = 'ready'; renderControls(); checkTimeUpWhenIdle(); return; }
    if (!text) { toast('인식된 말이 없어요. 다시 시도해 주세요', 'warn'); S.status = 'ready'; renderControls(); checkTimeUpWhenIdle(); return; }
    processUserTurn({ kind: 'text', text, source: 'stt', t0: performance.now() });
  } catch (e) {
    clearInterval(watch);
    if (!S || S.id !== sid) return;
    S.sttActive = false;
    toast(e.message || '음성 인식 오류', 'error', 6000);
    S.status = 'ready';
    renderControls();
  }
}

async function stopListening() {
  if (!S || S.status !== 'listening') return;
  if (S.sttActive) { stopBrowserStt(); return; } // onend → 결과 처리
  const sid = S.id;
  const t0 = performance.now();
  S.status = 'processing';
  renderControls();
  const blob = await stopRecording();
  if (!S || S.id !== sid) return;
  if (!blob) { toast('녹음된 소리가 없어요. 다시 시도해 주세요', 'warn'); S.status = 'ready'; renderControls(); checkTimeUpWhenIdle(); return; }
  processUserTurn({ kind: 'audio', blob, t0 });
}

function stopListeningIdle() {
  if (!S || S.status !== 'listening') return;
  if (S.sttActive) { S.sttCancelled = true; abortBrowserStt(); } else cancelRecording();
  S.status = 'ready';
  renderControls();
  toast(`🤫 ${SILENCE.idleMs / 1000}초 동안 말소리가 없어 녹음을 멈췄어요. 🎙️ 또는 Space로 다시 시작하세요`, 'info', 6000);
  checkTimeUpWhenIdle();
}

function cancelListening() {
  if (!S || S.status !== 'listening') return;
  if (S.sttActive) { S.sttCancelled = true; abortBrowserStt(); }
  else cancelRecording();
  S.status = 'ready';
  renderControls();
  checkTimeUpWhenIdle();
}

function sendTyped() {
  if (!S) return;
  const el = $('#talkInput');
  const text = (el ? el.value : S.draftText || '').trim();
  if (!text) { toast('보낼 내용을 입력해 주세요', 'warn'); return; }
  if (S.status === 'speaking') skipSpeech();
  else if (S.status !== 'ready') return;
  S.draftText = text;
  processUserTurn({ kind: 'text', text, source: 'keyboard', t0: performance.now() });
}
function retryTurn() {
  if (!S || !S.lastFailedInput || S.status !== 'ready') return;
  processUserTurn({ ...S.lastFailedInput, t0: performance.now() });
}

function switchInputMode(mode, silent = false) {
  if (!INPUT_MODES[mode]) return;
  if (mode === 'browserStt' && !SR) { toast('이 브라우저는 음성 인식을 지원하지 않아요', 'warn'); return; }
  if (S && S.status === 'listening') { toast('녹음/인식 중에는 바꿀 수 없어요', 'warn'); return; }
  state.settings.inputMode = mode;
  saveState();
  if (!silent) toast(`${INPUT_MODES[mode].icon} ${INPUT_MODES[mode].label} 모드`, 'info', 1800);
  if (mode === 'record' && S) { ensureAudioContext(); getMicStream().catch(e => { toast(`${micErrorMsg(e)} → 키보드 모드로 전환`, 'error'); switchInputMode('keyboard', true); }); }
  if (S) renderControls();
}

function isTypingDraft() {
  return state.settings.inputMode === 'keyboard' && !!(S?.draftText || '').trim();
}
function checkTimeUpWhenIdle() {
  if (S && S.timeUp && !S.closing && S.status === 'ready' && !S.pauses.size && !isTypingDraft()) doClosing();
}

async function doClosing() {
  if (!S || S.closing) return;
  const sid = S.id;
  S.closing = true;
  S.status = 'closing';
  renderControls();
  if (S.dataPending) { await S.dataPending; if (!S || S.id !== sid) return; }
  const m = newMetric('closing', null);
  const line = makeLineStarter(sid, m, reply => S.history.push({ role: 'model', text: reply }));
  try {
    S.abort = new AbortController();
    const { data } = await callGemini({
      role: S.chatRole,
      contents: [...historyToContents(S.history), { role: 'user', parts: [{ text: "(Time's up. Say a short, natural, warm goodbye that fits our conversation — 1-2 sentences, no question.)" }] }],
      systemInstruction: S.systemInstruction,
      schema: CLOSING_SCHEMA,
      thinking: chatThinking(),
      signal: S.abort.signal,
      meta: m,
      fast: true,
      stream: { onReply: line.show }
    });
    if (!S || S.id !== sid) return;
    line.show(String(data?.reply || '').trim() || FALLBACK_CLOSINGS[S.stage]);
  } catch (e) {
    if (isAbort(e) || !S || S.id !== sid) return;
    m.error = e.message;
    m.tFull = performance.now();
    line.show(FALLBACK_CLOSINGS[S.stage]);
  }
  maybeFinalizeMetric(m);
  await line.speakP;
  if (!S || S.id !== sid) return;
  finishSession();
}

async function endSessionManual() {
  if (!S) return;
  S.pauses.add('confirm');
  updateTimerUI();
  let ok;
  if (!S.turns.length) {
    ok = await showConfirm({ title: '대화 종료', body: '아직 주고받은 대화가 없어 리포트를 만들 수 없어요.\n그냥 나갈까요?', okText: '나가기', danger: true });
    if (!S) return;
    S.pauses.delete('confirm');
    if (ok) abortSession();
    else updateTimerUI();
    return;
  }
  ok = await showConfirm({ title: '대화 종료', body: `지금 종료하고 리포트를 받을까요? (${S.turns.length}턴 진행)`, okText: '📊 리포트 받기' });
  if (!S) return;
  S.pauses.delete('confirm');
  if (ok) finishSession();
  else { S.timer.last = performance.now(); updateTimerUI(); checkTimeUpWhenIdle(); }
}

function teardownSessionIO() {
  if (!S) return;
  try { audio.mineEl?.pause(); } catch {}
  audio.mineEl = null;
  S.log.forEach(e => { if (e.audioUrl) URL.revokeObjectURL(e.audioUrl); });
  closeModal('edit');
  S.abort?.abort();
  S.ttsAbort?.abort();
  cancelRecording();
  if (S.sttActive) { S.sttCancelled = true; abortBrowserStt(); }
  stopPlayback();
  stopTimer();
  closeModal('sos');
}
function abortSession() {
  teardownSessionIO();
  S = null;
  releaseMic();
  renderNav();
  renderTalk();
}

function buildDraft(s) {
  return {
    id: s.id,
    topic: s.topic,
    stage: s.stage,
    isRandom: s.isRandom,
    onCooldown: s.onCooldown,
    startedAt: s.startedAt,
    minutes: Math.max(0.1, Math.round(s.timer.elapsedMs / 6000) / 10),
    usedAudio: s.usedAudio,
    openingAngle: s.openingAngle,
    history: s.history.filter(h => h.text !== '(Session start)'),
    turns: s.turns
  };
}

function finishSession() {
  if (!S) return;
  teardownSessionIO();
  if (!S.turns.length) {
    toast('주고받은 대화가 없어 리포트 없이 종료했어요', 'info');

// ===== [SECTION: HUD] =====

// ---- 턴별 응답 시간 계측 (디버그 배지 + console.table) ----
// t0: 입력 끝(전송/녹음 정지) · tUploaded: 오디오 업로드 완료 · tReply: 대사 문자열 완성 · tFull: 응답 전체(HUD) 완료
// tTtsStart~tTtsReady: TTS 생성 · tPlay: 재생 명령 시점 (소리가 꺼져 있어도 동일)
let metricSeq = 0;
const METRIC_KIND = { opening: '첫 질문', turn: '턴', closing: '마무리' };
const METRIC_INPUT = { audio: '🎙️ 녹음', stt: '⚡ 인식', keyboard: '⌨️ 키보드', edited: '✏️ 고침' };

function newMetric(kind, inputType) {
  return { id: ++metricSeq, kind, inputType, t0: performance.now(), attempts: [] };
}
function maybeFinalizeMetric(m) {
  if (m && !m.done && m.tFull != null && (m.tPlay != null || m.speakEnded)) finalizeMetric(m);
}
function finalizeMetric(m) {
  if (!m || m.done) return;
  m.done = true;
  runtime.metrics.push(m);
  if (runtime.metrics.length > 50) runtime.metrics.shift();
  console.table(runtime.metrics.slice(-10).map(metricRow));
  renderDebugUI();
}
function metricParts(m) {
  // 대사·HUD는 회화 요청 시작 기준 (녹음 턴은 전사가 끝난 뒤 회화 요청이 나간다)
  const base = m.prefetched ? m.t0 : (m.tReqStart ?? m.t0);
  const d = (a, b) => (a != null && b != null ? Math.max(0, a - b) : null);
  return {
    upload: m.inputType === 'audio' ? d(m.tUploaded, m.t0) : null,
    transcribe: m.inputType === 'audio' ? d(m.tTranscribed, m.t0) : null,
    gemini: d(m.tReply, base),
    hud: d(m.tFull, base),
    tts: d(m.tTtsReady, m.tTtsStart),
    total: d(m.tPlay, m.t0)

}
const msCell = v => (v == null ? '-' : Math.round(v));
const secText = v => (v == null ? '-' : `${(v / 1000).toFixed(1)}s`);
// 스트림만 끊기고 같은 모델 일반 요청으로 복구된 건 '방식' 열에 표시하고, 여기엔 모델/HTTP 실패만 남긴다
const modelFailures = m => (m.attempts || []).filter(a => a.status !== 'stream');
const shortModel = id => String(id || '').replace(/^gemini-/, '');
// 시도 내역: "3.8-flash 503 0.6s → 3.6-flash ok 2.1s"
function metricTrace(m) {
  const fmt = list => list.map(t => `${shortModel(t.model)} ${t.status} ${(t.ms / 1000).toFixed(1)}s`).join(' → ');
  const parts = [];
  if (m.transcribeTrace?.length) parts.push(`[전사] ${fmt(m.transcribeTrace)}`);
  if (m.trace?.length) parts.push(`${m.transcribeTrace?.length ? '[대답] ' : ''}${fmt(m.trace)}`);
  return parts.join(' · ') || '-';
}
function metricFallbackText(m) {
  const fails = modelFailures(m);
  if (!fails.length) return m.responder && m.requested && m.responder !== m.requested ? `${m.requested} → ${m.responder} (헤징)` : '-';
  return `${m.requested} → ${m.responder || '실패'} (${fails.map(a => `${a.stage ? `${a.stage} ` : ''}${a.model}:${a.status}`).join(', ')})`;
}
function metricMethod(m) {
  const hedge = m.hedged ? '+헤징' : '';
  if (m.prefetched) return `미리 준비${hedge}`;
  if (m.streamed) return `${m.partial ? '스트림(부분)' : '스트림'}${hedge}`;
  if (m.streamFallback) return `일반(스트림 실패:${m.streamFallback})${hedge}`;
  return `일반${hedge}`;
}
function metricRow(m) {
  const p = metricParts(m);
  return {
    '#': m.id,
    '종류': METRIC_KIND[m.kind] || m.kind,
    '입력': METRIC_INPUT[m.inputType] || '-',
    '업로드(ms)': msCell(p.upload),
    '전사(ms)': msCell(p.transcribe),
    '전사 모델': m.transcribeModel || '-',
    'Gemini 대사(ms)': msCell(p.gemini),
    'HUD 완료(ms)': msCell(p.hud),
    'TTS 생성(ms)': msCell(p.tts),
    '재생 시작·총(ms)': msCell(p.total),
    '응답 모델': m.responder || '-',
    '방식': metricMethod(m),
    'TTS': m.ttsMode ? `${m.ttsMode}${m.ttsModel ? ` ${m.ttsModel}` : ''}` : '-',
    '폴백': metricFallbackText(m),
    '시도 내역': metricTrace(m),
    '실패 메시지': (m.attempts || []).map(a => `${shortModel(a.model)}:${a.reason}`).join(' | ') || '-',
    'TTS 폴백': m.ttsFallback || '-',
    '오류': m.error || '-'
  };
}
// 실패 사유 요약: "3.8-flash 400 Thinking level MINIMAL is not supp…" (error.message 앞부분)
function failureReasonText(m, max = 48) {
  const f = modelFailures(m)[0];
  if (!f) return '';
  const reason = f.reason.length > max ? `${f.reason.slice(0, max)}…` : f.reason;
  return `${shortModel(f.model)} ${f.status}${reason ? ` ${reason}` : ''}`;
}
function debugBadgeText(m) {
  if (!m) return '⏱ 측정 대기 · 탭하면 표';
  const p = metricParts(m);
  const tts = m.ttsMode === 'browser' ? '브라우저' : secText(p.tts);
  const fail = failureReasonText(m);
  return `${p.transcribe != null ? `전사 ${secText(p.transcribe)} · ` : ''}응답 ${secText(p.gemini)} · TTS ${tts} · 총 ${secText(p.total)} · ${m.responder || '-'}${fail ? ` · ⚠ ${fail}` : ''}${m.prefetched ? ' · 미리준비' : ''}${m.error ? ' · ❌' : ''}`;
}
function renderDebugUI() {
  const wrap = $('#debugWrap');
  if (!wrap) return;
  const on = !!state.settings.showDebugTiming;
  wrap.classList.toggle('hidden', !on);

  const cols = ['#', '종류', '입력', '업로드', '전사', '대사', 'HUD', 'TTS', '총', '모델', '방식', '시도 내역', '실패 사유'];
  panel.innerHTML = `
    <table class="border-collapse whitespace-nowrap">

      <tbody>${rows.map(m => {
        const p = metricParts(m);
        const cells = [m.id, METRIC_KIND[m.kind] || m.kind, METRIC_INPUT[m.inputType] || '-', msCell(p.upload), msCell(p.transcribe), msCell(p.gemini), msCell(p.hud),
          m.ttsMode === 'browser' ? '브라우저' : msCell(p.tts), msCell(p.total), m.responder || '-', metricMethod(m), metricTrace(m),
          modelFailures(m).map(a => `${shortModel(a.model)} ${a.status}: ${a.reason.slice(0, 80)}`).join(' | ') || '-'];
        return `<tr class="${m.error ? 'text-rose-300' : 'text-slate-200'}">${cells.map(c => `<td class="px-1.5 py-1 border-b border-slate-800">${esc(c)}</td>`).join('')}</tr>`;
      }).join('')}</tbody>
    </table>
    <div class="text-slate-500 px-1.5 pt-1">단위 ms · 전사·총 = 입력 끝 기준 · 대사·HUD = 회화 요청 시작 기준 · 실패 메시지 등 전체 기록은 console.table</div>
    ${downModelsText() ? `<div class="text-amber-300/90 px-1.5 pt-1">⏭ 잠시 뒤로 미룬 모델: ${esc(downModelsText())}</div>` : ''}

}

let timerInterval = null;
function startTimer() {

  if (!S) return;

  timerInterval = setInterval(tickTimer, 250);
  updateTimerUI();
}
function stopTimer() {
  clearInterval(timerInterval);

}
// 사용자가 대화하는 시간만 센다 (excludeWaitTime이면 AI 생성·TTS 로딩·재생 중 정지)
function timerCounting() {
  if (!S || S.pauses.size || document.hidden) return false;
  if (S.status === 'openingFailed') return false;
  if (state.settings.excludeWaitTime) return S.status === 'ready' || S.status === 'listening';
  return true;
}
function tickTimer() {

  const now = performance.now();
  const dt = now - S.timer.last;
  S.timer.last = now;
  if (timerCounting()) S.timer.elapsedMs += Math.min(dt, 1000);
  if (S.timer.limitMs && !S.timeUp && S.timer.elapsedMs >= S.timer.limitMs) {
    S.timer.elapsedMs = S.timer.limitMs;
    S.timeUp = true;

  }

}
function handleTimeUp() {

    doClosing();
  } else if (S.status === 'listening' || isTypingDraft()) {
    toast('⏰ 시간 종료! 지금 하던 말까지만 마무리해서 보내 주세요', 'warn', 5000);
  } else {
    toast('⏰ 시간 종료! 이번 응답 후 마무리할게요', 'info');
  }
}
function updateTimerUI() {
  if (!S) return;
  const tEl = $('#timerText'), sEl = $('#timerState'), bar = $('#timerBar');
  if (!tEl) return;
  const lim = S.timer.limitMs;
  const left = lim - S.timer.elapsedMs;
  tEl.textContent = lim ? fmtClock(left, true) : fmtClock(S.timer.elapsedMs);
  tEl.classList.toggle('text-rose-300', !!lim && left <= 30000);
  tEl.classList.toggle('text-emerald-300', !(lim && left <= 30000));
  if (bar) bar.style.width = lim ? `${Math.min(100, (S.timer.elapsedMs / lim) * 100)}%` : '100%';
  if (bar) bar.classList.toggle('opacity-30', !lim);
  let label;
  if (S.timeUp) label = '⏰ 시간 종료';

  else label = '⏸ AI 대기 (시간 제외)';
  if (sEl) sEl.textContent = label;
}

function onVisibilityChange() {

const SOS_SYSTEM = `You are an expert English coach for Korean adult learners (target: TOEIC Speaking AH / OPIc AL).
The learner is in the middle of a spoken English conversation and wants to say something they only know how to say in Korean.
Give 2-3 natural expressions a native speaker would actually say in that context, ordered from casual to formal when possible.
For each: "expression" (English, ready to say out loud, fits the conversation), "register" (casual | neutral | formal), "nuanceKo" (한국어로 뉘앙스 차이와 언제 쓰는지 1~2문장), "example" (a short natural example sentence).
Respond ONLY with JSON matching the schema.`;
const SOS_SCHEMA = {
  type: 'OBJECT',
  properties: {
    expressions: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: {
          expression: { type: 'STRING' },
          register: { type: 'STRING', enum: ['casual', 'neutral', 'formal'] },
          nuanceKo: { type: 'STRING' },
          example: { type: 'STRING' }
        },
        required: ['expression', 'register', 'nuanceKo', 'example']
      }
    }
  },
  required: ['expressions']
};
const REGISTER_LABEL = { casual: ['캐주얼', 'bg-sky-500/15 text-sky-300 border-sky-500/30'], neutral: ['중립', 'bg-slate-500/15 text-slate-300 border-slate-500/30'], formal: ['격식', 'bg-violet-500/15 text-violet-300 border-violet-500/30'] };
const sos = { loading: false, listening: false, results: null };

      systemInstruction: SOS_SYSTEM,

    });
    const items = (Array.isArray(data?.expressions) ? data.expressions : []).filter(x => x && x.expression).slice(0, 3);

// ===== [SECTION: REPORT] =====
const REPORT_SYSTEM = `You are a senior English speaking assessor who knows the TOEIC Speaking (levels NL~AH, 0-200) and OPIc (NL~AL) rubrics very well, and a warm, honest coach for Korean adult learners.
Analyze the session data and respond ONLY with JSON matching the schema.
Write every field ending in "Ko" in natural Korean. Quote the user's own sentences verbatim where asked. Grades are estimates, not official results.`;

function reportSchema(isCustom) {
  const STR = { type: 'STRING' }, INT = { type: 'INTEGER' };
  const properties = {
    estimatedGrade: { type: 'OBJECT', properties: { toeicSpeaking: STR, opic: STR, noteKo: STR }, required: ['toeicSpeaking', 'opic', 'noteKo'] },
    overallScore: INT,
    top3: { type: 'ARRAY', items: { type: 'OBJECT', properties: { mine: STR, native: STR, whyKo: STR }, required: ['mine', 'native', 'whyKo'] } },
    keyExpressions: { type: 'ARRAY', items: { type: 'OBJECT', properties: { expression: STR, meaningKo: STR, example: STR }, required: ['expression', 'meaningKo', 'example'] } },
    statScores: {
      type: 'OBJECT',
      properties: { fluency: INT, vocab: INT, grammar: INT, logic: INT, nuance: { type: 'INTEGER', nullable: true } },
      required: ['fluency', 'vocab', 'grammar', 'logic', 'nuance']
    },
    strengthsKo: STR,
    nextFocusKo: STR,
    sessionSummary: STR,
    anglesCovered: { type: 'ARRAY', items: STR }
  };
  const required = Object.keys(properties);
  if (isCustom) {
    properties.trackForCustomTopic = { type: 'INTEGER', description: '1-4' };
    properties.customTopicCard = {
      type: 'OBJECT',
      properties: {
        title: STR, titleKo: STR, subtitle: STR,
        starterQuestions: { type: 'ARRAY', items: STR },
        keyExpressions: { type: 'ARRAY', items: { type: 'OBJECT', properties: { en: STR, ko: STR }, required: ['en', 'ko'] } }
      },
      required: ['title', 'titleKo', 'subtitle', 'starterQuestions', 'keyExpressions']
    };
    required.push('trackForCustomTopic', 'customTopicCard');
  }
  return { type: 'OBJECT', properties, required };
}

function buildReportPrompt(draft) {
  const t = draft.topic;
  const track = TRACKS[t.track] || CUSTOM_TRACK;
  const stg = STAGES[draft.stage];
  const audioTurns = draft.turns.filter(x => x.inputType === 'audio').length;
  const transcript = draft.history.map(h => `${h.role === 'model' ? 'AI' : 'USER'}: ${h.text}`).join('\n');
  const turns = draft.turns.map((x, i) => ({
    n: i + 1, inputType: x.inputType, user: x.transcript, hud: x.hud,
    pronunciationNoteKo: x.pron, signals: x.signals, angle: x.angleTag
  }));
  return [
    'SESSION INFO',
    `- Stage ${draft.stage}: ${stg.name} (${stg.goal}). Style: ${stg.style}`,
    `- Topic: ${t.title} — ${t.subtitle} (Track: ${track.name})`,
    `- User talk time: ${draft.minutes} min, ${draft.turns.length} user turns (${audioTurns} audio, ${draft.turns.length - audioTurns} text)`,
    draft.usedAudio
      ? '- Audio input was used: evaluate nuance including pronunciation/intonation (see per-turn notes).'
      : '- TEXT-ONLY session (no audio at all): set statScores.nuance to null and do not evaluate pronunciation.',
    '',
    'FULL TRANSCRIPT',
    transcript,
    '',
    'PER-TURN DATA (JSON)',
    JSON.stringify(turns),
    '',
    'TASK',
    '- estimatedGrade: TOEIC Speaking level with score band (e.g. "AM (180~190)") and OPIc grade (e.g. "IH", "AL"). noteKo: 추정치이며 실제 시험과 다를 수 있다는 짧은 안내.',
    '- overallScore 0-100, where 80 = a solid performance for this stage.',
    '- top3: the user\'s 3 most improvable real sentences ("mine" quoted verbatim from USER lines), the most natural native version, and whyKo.',
    '- keyExpressions: exactly 3 expressions worth adopting for this topic next time, with meaningKo and an example tied to what the user talked about.',
    '- statScores 0-100 each. strengthsKo and nextFocusKo: 1-2 sentences each.',
    '- sessionSummary: 2-3 English sentences on what was discussed (used to pick fresh angles next time).',
    '- anglesCovered: 2-6 short English tags of the conversation angles covered.',
    t.isTemp
      ? `- This was a USER-DEFINED topic: "${t.userInput}". Choose trackForCustomTopic (1 = my life/routine/personal stories, 2 = everyday opinions, 3 = casual bro talk & daily situations, 4 = politics & diplomacy) and write customTopicCard: English title, Korean titleKo, Korean one-line subtitle, 3 English starterQuestions for future sessions, 4 keyExpressions {en, ko}.`
      : ''
  ].filter(x => x !== null).join('\n');
}

function normalizeReport(d, draft) {
  const str = v => String(v ?? '').trim();
  const arr = v => (Array.isArray(v) ? v : []);
  const g = isObj(d?.estimatedGrade) ? d.estimatedGrade : {};
  const ss = isObj(d?.statScores) ? d.statScores : {};
  const avg = k => {
    const v = draft.turns.map(t => t.signals?.[k]).filter(x => typeof x === 'number');
    return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : 60;
  };
  const statScores = {};
  for (const k of SIGNAL_KEYS) {
    const v = clampInt(ss[k], 0, 100, NaN);
    statScores[k] = Number.isFinite(v) ? v : avg(k);
  }
  if (!draft.usedAudio) statScores.nuance = null; // 텍스트 전용 세션은 nuance 평가 안 함
  const vals = Object.values(statScores).filter(v => v != null);
  return {
    estimatedGrade: {
      toeicSpeaking: str(g.toeicSpeaking) || '—',
      opic: str(g.opic) || '—',
      noteKo: str(g.noteKo) || 'AI 추정치이며 실제 시험 결과와 다를 수 있어요.'
    },
    overallScore: clampInt(d?.overallScore, 0, 100, Math.round(vals.reduce((a, b) => a + b, 0) / Math.max(1, vals.length))),
    top3: arr(d?.top3).filter(x => x && x.native).slice(0, 3).map(x => ({ mine: str(x.mine), native: str(x.native), whyKo: str(x.whyKo) })),
    keyExpressions: arr(d?.keyExpressions).filter(x => x && x.expression).slice(0, 3).map(x => ({ expression: str(x.expression), meaningKo: str(x.meaningKo), example: str(x.example) })),
    statScores,
    strengthsKo: str(d?.strengthsKo),
    nextFocusKo: str(d?.nextFocusKo),
    sessionSummary: str(d?.sessionSummary),
    anglesCovered: arr(d?.anglesCovered).map(str).filter(Boolean).slice(0, 8),
    trackForCustomTopic: d?.trackForCustomTopic != null ? clampInt(d.trackForCustomTopic, 1, 4, 1) : null,
    customTopicCard: isObj(d?.customTopicCard) ? d.customTopicCard : null
  };
}

// exp = round(대화분수 × 10 × (overallScore / 80) × 랜덤보너스(1.3|1) × 쿨타임감소(0.5|1))
function calcExp(minutes, score, isRandom, onCooldown) {
  return Math.max(0, Math.round(minutes * 10 * (score / 80) * (isRandom ? 1.3 : 1) * (onCooldown ? 0.5 : 1)));
}

function buildCustomTopic(draft, report) {
  const c = report.customTopicCard || {};
  const input = draft.topic.userInput || draft.topic.title;
  return normalizeTopic({
    id: uid('custom'),
    track: report.trackForCustomTopic || 1,
    title: c.title || input.slice(0, 60),
    titleKo: c.titleKo || input.slice(0, 40),
    subtitle: c.subtitle || input,
    starterQuestions: c.starterQuestions,
    keyExpressions: c.keyExpressions,
    createdAt: Date.now(),
    source: 'custom'
  }, 'custom');
}

function applyReport(draft, report) {
  const existing = state.sessions.find(s => s.id === draft.id);
  if (existing) return { exp: existing.expGained, topicId: existing.topicId, newTopic: null, duplicate: true };
  let topicId = draft.topic.id;
  let newTopic = null;
  if (draft.topic.isTemp) {
    newTopic = buildCustomTopic(draft, report);
    state.customTopics.push(newTopic);
    topicId = newTopic.id;
    state.dex.forEach(x => { if (x.topicId === draft.topic.id) x.topicId = topicId; });
  }
  const exp = calcExp(draft.minutes, report.overallScore, draft.isRandom, draft.onCooldown);
  const tp = state.topicProgress[topicId] || (state.topicProgress[topicId] = emptyProgress());
  tp.clearCount += 1;
  tp.lastClearedAt = Date.now();
  if (report.sessionSummary) tp.summaries = [...tp.summaries, report.sessionSummary].slice(-5);
  tp.anglesCovered = uniq([...tp.anglesCovered, ...report.anglesCovered, draft.openingAngle, ...draft.turns.map(t => t.angleTag)].filter(Boolean)).slice(-40);
  state.profile.exp += exp;
  state.sessions.unshift({
    id: draft.id,
    topicId,
    topicTitle: newTopic ? newTopic.title : draft.topic.title,
    stage: draft.stage,
    startedAt: draft.startedAt,
    minutes: draft.minutes,
    score: report.overallScore,
    expGained: exp,
    reportSummary: {
      toeicSpeaking: report.estimatedGrade.toeicSpeaking,
      opic: report.estimatedGrade.opic,
      statScores: report.statScores,
      strengthsKo: report.strengthsKo,
      nextFocusKo: report.nextFocusKo,
      turns: draft.turns.length,
      usedAudio: draft.usedAudio,
      isRandom: draft.isRandom,
      onCooldown: draft.onCooldown
    }
  });
  state.sessions = state.sessions.slice(0, MAX_SESSIONS);
  saveState();
  return { exp, topicId, newTopic, duplicate: false };
}

async function generateReport(draft) {
  if (!draft) return;
  talk.pending = null;
  talk.report = { status: 'loading', draft };
  switchView('talk');
  renderTalk();
  try {
    const { data, model } = await callGemini({
      role: 'analysis',
      contents: [{ role: 'user', parts: [{ text: buildReportPrompt(draft) }] }],
      systemInstruction: REPORT_SYSTEM,
      schema: reportSchema(!!draft.topic.isTemp),
      thinking: 'high',
      rounds: 3
    });
    const report = normalizeReport(data, draft);
    const result = applyReport(draft, report);
    clearPendingReport();
    talk.report = { status: 'done', draft, report, model, ...result };
    renderHeader();
    renderNav();
    if (currentView === 'talk') { renderTalk(); celebrateExp(result.exp); }
    else toast(`📊 리포트 완료! +${result.exp} EXP`, 'success');
  } catch (e) {
    talk.report = { status: 'error', draft, error: e.message };
    if (currentView === 'talk') renderTalk();
    toast(`리포트 생성 실패: ${e.message} (세션 데이터는 보존돼요)`, 'error', 7000);
  }
}

async function discardReport() {
  const ok = await showConfirm({ title: '리포트 버리기', body: '이 세션의 리포트와 EXP를 받지 않고 기록을 버릴까요?', okText: '버리기', danger: true });
  if (!ok) return;
  clearPendingReport();
  talk.report = null;
  renderTalk();
}

function celebrateExp(exp) {
  const el = $('#expCount');
  if (!el) return;
  const start = performance.now(), dur = 1300;
  const step = now => {
    const p = Math.min(1, (now - start) / dur);
    el.textContent = Math.round(exp * (1 - Math.pow(1 - p, 3))).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  const box = $('#expBox');
  if (!box) return;
  const r = box.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 140;
    p.style.left = `${cx}px`;
    p.style.top = `${cy}px`;
    p.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
    p.style.setProperty('--dy', `${Math.sin(ang) * dist - 40}px`);
    p.style.animationDelay = `${Math.random() * 0.25}s`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1700);
  }
}

const dexUi = { q: '', type: 'all', topic: 'all' };
const DEX_TYPE_LABEL = { hud: '⚡ HUD', sos: '⏸️ SOS', report: '📊 리포트' };

function isInDex(native, original) {
  const n = String(native || '').trim(), o = String(original || '').trim();
  return state.dex.some(d => d.native === n && d.original === o);
}
function addToDex({ type, original, native, tipKo, topicId }) {
  native = String(native || '').trim();
  original = String(original || '').trim();
  if (!native) return null;
  const exists = state.dex.find(d => d.native === native && d.original === original);
  if (exists) return exists.id;
  const item = {
    id: uid('dex'), type: DEX_TYPE_LABEL[type] ? type : 'hud',
    original, native, tipKo: String(tipKo || '').trim(), topicId: topicId || null,
    createdAt: Date.now(), box: 1, lastReviewedAt: null, reviewCount: 0
  };
  state.dex.unshift(item);
  saveState();
  renderNav();
  return item.id;
}
function saveDexFromButton(el) {
  if (el.dataset.saved) return;
  const p = payloads.get(el.dataset.pid);
  if (!p) return;
  if (addToDex(p)) {
    el.dataset.saved = '1';
    el.textContent = '✅ 저장됨';
    el.className = 'tap shrink-0 rounded-lg px-3 text-xs font-semibold border border-emerald-500/40 text-emerald-300 bg-emerald-500/10';
    toast('📌 도감에 저장했어요', 'success', 1600);
  }
}
async function deleteDex(id) {
  const item = state.dex.find(d => d.id === id);
  if (!item) return;
  const ok = await showConfirm({ title: '도감에서 삭제', body: `"${item.native}"\n이 표현을 삭제할까요?`, okText: '삭제', danger: true });
  if (!ok) return;
  state.dex = state.dex.filter(d => d.id !== id);
  saveState();
  renderNav();
  renderDex();
}

function toast(msg, type = 'info', ms = 3500) {
  const root = $('#toastRoot');
  if (!root) return;
  const colors = {
    info: 'border-slate-600 bg-slate-800/95 text-slate-100',
    success: 'border-emerald-500/50 bg-emerald-950/95 text-emerald-100',
    warn: 'border-amber-400/50 bg-amber-950/95 text-amber-100',
    error: 'border-rose-500/50 bg-rose-950/95 text-rose-100'
  };
  const el = document.createElement('div');
  el.className = `toast-in pointer-events-auto max-w-md w-full rounded-xl border px-4 py-2.5 text-sm shadow-xl backdrop-blur ${colors[type] || colors.info}`;
  el.textContent = msg;
  el.addEventListener('click', () => el.remove());
  root.appendChild(el);
  while (root.children.length > 4) root.firstChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms);
}
function toastOnce(key, msg, type = 'info', windowMs = 30000) {
  const last = runtime.toastOnce.get(key) || 0;
  if (Date.now() - last < windowMs) return;
  runtime.toastOnce.set(key, Date.now());
  toast(msg, type, 5000);
}

const modalStack = [];
function openModal(html, { id = uid('m'), dismissible = true, size = 'md', onClose } = {}) {
  closeModal(id);
  const wrap = document.createElement('div');
  wrap.dataset.modalId = id;
  wrap.className = 'fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-slate-950/70 backdrop-blur-sm sm:p-4';
  wrap.innerHTML = `<div class="sheet-in w-full ${size === 'lg' ? 'sm:max-w-2xl' : 'sm:max-w-md'} max-h-[92vh] overflow-y-auto scroll-thin bg-slate-900 border border-slate-700 rounded-t-3xl sm:rounded-3xl shadow-2xl" style="padding-bottom: var(--sab)">${html}</div>`;
  if (dismissible) wrap.addEventListener('click', e => { if (e.target === wrap) closeModal(id); });
  $('#modalRoot').appendChild(wrap);
  modalStack.push({ id, onClose, el: wrap, dismissible });
  refreshIcons();
  return id;
}
function closeModal(id) {
  const i = id ? modalStack.findIndex(m => m.id === id) : modalStack.length - 1;
  if (i < 0) return;
  const [m] = modalStack.splice(i, 1);
  m.el.remove();
  m.onClose && m.onClose();
}
function closeTopModal() {
  const top = modalStack[modalStack.length - 1];
  if (!top) return;
  if (top.id === 'sos') closeSos(); else closeModal(top.id);
}
function showConfirm({ title, body, okText = '확인', cancelText = '취소', danger = false }) {
  return new Promise(resolve => {
    const id = uid('cf');
    let done = false;
    const finish = v => { if (done) return; done = true; closeModal(id); resolve(v); };
    openModal(`
      <div class="p-5">
        <h3 class="text-lg font-bold">${esc(title)}</h3>
        <p class="text-sm text-slate-300 mt-2 whitespace-pre-line">${esc(body)}</p>
        <div class="grid grid-cols-2 gap-2 mt-5">
          <button data-cf="0" class="tap rounded-xl border border-slate-700 bg-slate-800">${esc(cancelText)}</button>
          <button data-cf="1" class="tap rounded-xl font-bold ${danger ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-slate-950'}">${esc(okText)}</button>
        </div>
      </div>`, { id, onClose: () => { if (!done) { done = true; resolve(false); } } });
    const entry = modalStack.find(m => m.id === id);
    entry.el.querySelectorAll('[data-cf]').forEach(b => b.addEventListener('click', () => finish(b.dataset.cf === '1')));
  });
}

async function pickTopic(id) {
  if (S) { toast('진행 중인 대화가 있어요. 먼저 종료해 주세요', 'warn'); switchView('talk'); return; }
  const topic = getTopic(id);
  if (!topic) { toast('토픽을 찾을 수 없어요', 'error'); return; }
  const left = cooldownLeftMs(id);
  let onCooldown = false;
  if (left > 0) {
    const ok = await showConfirm({
      title: '⏳ 쿨타임 중인 토픽',
      body: `이 토픽은 ${fmtCooldown(left)} 후에 쿨타임이 끝나요.\n지금 진행하면 경험치가 50%만 지급돼요. 계속할까요?`,
      okText: '경험치 50%로 진행'
    });
    if (!ok) return;
    onCooldown = true;
  }
  openSetup(topic, { isRandom: false, onCooldown });
}
function smartRandom() {
  if (S) { toast('진행 중인 대화가 있어요. 먼저 종료해 주세요', 'warn'); switchView('talk'); return; }
  const onlyCore = state.settings.onlyCoreTracksInRandom;
  const all = allTopics();
  const available = all.filter(t => cooldownLeftMs(t.id) === 0);
  const core = available.filter(t => t.track <= 2), sub = available.filter(t => t.track >= 3);
  let pool;
  if (onlyCore) pool = core;
  else pool = Math.random() < 0.7 ? (core.length ? core : sub) : (sub.length ? sub : core);
  if (!pool.length) {
    const cands = (onlyCore ? all.filter(t => t.track <= 2) : all).slice().sort((a, b) => cooldownLeftMs(a.id) - cooldownLeftMs(b.id));
    const soon = cands[0];
    toast(soon ? `뽑을 수 있는 토픽이 없어요. 가장 먼저 열리는 토픽: "${soon.title}" (⏳ ${fmtCooldown(cooldownLeftMs(soon.id))})` : '토픽이 없어요', 'warn', 7000);
    return;
  }
  const topic = pool[Math.floor(Math.random() * pool.length)];
  toast(`🎲 ${topic.title} 당첨! (+30% EXP)`, 'success');
  openSetup(topic, { isRandom: true, onCooldown: false });
}
function startCustomTopic() {
  if (S) { toast('진행 중인 대화가 있어요. 먼저 종료해 주세요', 'warn'); switchView('talk'); return; }
  const text = ($('#customTopicInput')?.value || ui.customDraft || '').trim();
  if (!text) { toast('대화하고 싶은 주제를 입력해 주세요', 'warn'); $('#customTopicInput')?.focus(); return; }
  ui.customDraft = '';
  openSetup({
    id: uid('temp'), track: 0, isTemp: true, userInput: text,
    title: text, titleKo: '', subtitle: '직접 입력한 주제 · 대화 후 리포트에서 트랙이 정해져요',
    starterQuestions: [], keyExpressions: [], source: 'temp'
  });
}
async function deleteCustomTopic(id) {
  const t = state.customTopics.find(x => x.id === id);
  if (!t) return;
  const ok = await showConfirm({ title: '내 토픽 삭제', body: `"${t.title}" 카드를 삭제할까요?\n(이 토픽으로 저장한 도감 표현은 유지돼요)`, okText: '삭제', danger: true });
  if (!ok) return;
  state.customTopics = state.customTopics.filter(x => x.id !== id);
  delete state.topicProgress[id];
  saveState();
  renderTopics();
}

const lastTurnLogIdx = () => (S?.turns.length ? S.turns[S.turns.length - 1].userLogIdx : -1);
function renderChatLog() {
  const box = $('#chatLog');
  if (!box || !S) return;
  const editIdx = lastTurnLogIdx();
  box.innerHTML = S.log.map((m, i) => (m.removed ? '' : m.role === 'ai' ? aiBubbleHtml(m.text, i, false) : userBubbleHtml(m, i, false, i === editIdx))).join('');
  box.scrollTop = box.scrollHeight;
}
// 반환: log 인덱스
function appendAiBubble(text) {
  if (!S) return -1;
  S.log.push({ role: 'ai', text });
  const idx = S.log.length - 1;
  const box = $('#chatLog');
  if (box) {
    box.insertAdjacentHTML('beforeend', aiBubbleHtml(text, idx, true));
    box.scrollTop = box.scrollHeight;
  }
  return idx;
}
// 사용자 말풍선은 전송 즉시 띄운다 (녹음은 "듣는 중…" 자리표시 → 전사 도착 시 갱신). 반환: log 인덱스
function appendUserBubble(text, inputType, pending = false) {
  if (!S) return -1;
  S.log.push({ role: 'user', text, inputType, pending });
  const idx = S.log.length - 1;
  const box = $('#chatLog');
  if (box) {
    box.insertAdjacentHTML('beforeend', userBubbleHtml(S.log[idx], idx, true));
    box.scrollTop = box.scrollHeight;
  }
  return idx;
}
function refreshUserBubble(idx, showEdit = false) {
  const entry = S?.log[idx];
  const el = $(`#chatLog [data-log="${idx}"]`);
  if (!entry || entry.removed || !el) return;
  el.outerHTML = userBubbleHtml(entry, idx, false, showEdit);
}
function updateUserBubble(idx, text) {
  const entry = S?.log[idx];
  if (!entry) return;
  entry.text = text;
  entry.pending = false;
  refreshUserBubble(idx, false);
}
// 마지막 턴의 말풍선에만 [고치기]·[다시 말하기]를 보여 준다
function refreshEditActions() {
  if (!S) return;
  const editIdx = lastTurnLogIdx();
  S.log.forEach((m, i) => { if (m.role === 'user' && !m.removed) refreshUserBubble(i, i === editIdx); });
}
function removeLogEntry(idx) {
  const entry = S?.log[idx];
  if (!entry) return;
  entry.removed = true;
  $(`#chatLog [data-log="${idx}"]`)?.remove();
}
function applySubtitles() {
  const hidden = !state.settings.showSubtitles;
  $$('.ai-sub').forEach(el => el.classList.toggle('blurred-sub', hidden));
  $$('.sub-hint').forEach(el => el.classList.toggle('hidden', !hidden));
  const b = $('#subToggle');
  if (b) b.textContent = hidden ? '🙈 자막 OFF' : '💬 자막 ON';
}
function lastAiText() {
  return [...(S?.log || [])].reverse().find(m => m.role === 'ai' && !m.removed)?.text || '';
}

function updateLevelMeter(level, elapsedMs) {

function pickProModel() {
  const ids = (runtime.modelList || []).map(m => m.id)
    .filter(id => /pro/i.test(id) && !/tts|vision|image|embedding/i.test(id) && !isPaidModel(id));
  const ver = id => parseFloat((/gemini-(\d+(?:\.\d+)?)/.exec(id) || [])[1] || 0);
  ids.sort((a, b) => ver(b) - ver(a) || (/(preview|exp)/.test(a) ? 1 : 0) - (/(preview|exp)/.test(b) ? 1 : 0));
  return ids[0] || HYBRID_ANALYSIS_FALLBACK;
}

  renderHeader();
  if (key === 'handsFree' && S) { renderControls(); if (state.settings.handsFree) maybeAutoListen(); }
  if (key === 'showSubtitles') applySubtitles();
  if (key === 'autoStopOnSilence' && S) renderControls();
  if (key === 'excludeWaitTime' && S) updateTimerUI();
  if (key === 'showDebugTiming') renderDebugUI();
  if (!S && talk.pending && currentView === 'talk') renderTalk();
}

// ===== [SECTION: INIT] =====
const ACTIONS = {
  nav: el => switchView(el.dataset.view),
  goTopics: () => { talk.report = null; switchView('topics'); },
  goDex: () => { talk.report = null; switchView('dex'); },
  goStageTopics: () => switchView('topics'),
  openSettings: () => openSettings(),
  closeTopModal: () => closeTopModal(),

  setStage: el => {
    state.settings.stage = clampInt(el.dataset.stage, 1, 4, 1);
    saveState();
    renderHeader();
    renderTopics();
  },
  startCustomTopic: () => startCustomTopic(),
  smartRandom: () => smartRandom(),
  pickTopic: el => pickTopic(el.dataset.id),
  deleteCustomTopic: (el, e) => { e.stopPropagation(); return deleteCustomTopic(el.dataset.id); },

  cancelSetup: () => { talk.pending = null; discardPrefetch(); switchView('topics'); },
  setTimer: el => { state.settings.timerPreset = Number(el.dataset.min); saveState(); renderTalk(); },
  setInputMode: el => {
    const mode = el.dataset.mode;
    if (mode === 'browserStt' && !SR) { toast('이 브라우저는 음성 인식을 지원하지 않아요', 'warn'); return; }
    state.settings.inputMode = mode;
    saveState();
    renderTalk();
  },
  startSession: () => startSession(),
  retryOpening: () => requestOpening(),

  micTap: () => micTap(),
  cancelListen: () => cancelListening(),
  sendTyped: () => sendTyped(),
  retryTurn: () => retryTurn(),
  switchMode: el => switchInputMode(el.dataset.mode),
  skipSpeech: () => skipSpeech(),
  replayLast: () => { const t = lastAiText(); if (t) return replayText(t); toast('다시 들을 대사가 없어요', 'info'); },
  replayIdx: el => replayText(S?.log[Number(el.dataset.idx)]?.text),
  revealSub: el => { if (!state.settings.showSubtitles) el.classList.toggle('blurred-sub'); },
  toggleSubtitles: () => { state.settings.showSubtitles = !state.settings.showSubtitles; saveState(); applySubtitles(); },
  toggleHud: () => toggleHud(),
  toggleDebugPanel: () => toggleDebugPanel(),
  togglePause: () => togglePause(),
  openUsage: () => openUsage(),
  resetUsageCounts: () => resetUsageCounts(),
  replayMine: el => replayMine(Number(el.dataset.idx)),
  editTurn: el => editTurn(Number(el.dataset.idx)),
  submitEdit: el => submitEdit(Number(el.dataset.idx)),
  redoTurn: el => redoTurn(Number(el.dataset.idx)),
  setTtsPref: el => setTtsPref(el.dataset.pref),
  endSession: () => endSessionManual(),
  resumeBg: () => resumeFromBackground(),

  openSos: () => openSos(),
  closeSos: () => closeSos(),
  askSos: () => askSos(),
  sosMic: () => sosMic(),
  speakText: el => {
    ensureAudioContext();
    unlockSpeechSynthesis();
    const text = el.dataset.text;
    if (S && S.status === 'ready' && !S.pauses.size) return replayText(text);
    if (S && S.status !== 'ready' && !S.pauses.has('sos')) { toast('AI 차례가 끝난 뒤 들어 주세요', 'info'); return; }
    return speak(text);
  },
  saveDex: el => saveDexFromButton(el),
  deleteDex: el => deleteDex(el.dataset.id),

  reportRetry: () => generateReport(talk.report?.draft || loadPendingReport()),
  reportLater: () => { talk.report = null; switchView('topics'); toast('🧾 리포트는 🎙️ 대화 탭에서 나중에 생성할 수 있어요', 'info'); },
  reportDiscard: () => discardReport(),
  generatePending: () => generateReport(loadPendingReport()),
  againTopic: el => { talk.report = null; return pickTopic(el.dataset.id); },

  copySaveCode: () => copySaveCode(),
  openImport: () => openImport(),
  validateImport: () => validateImport(),
  applyImport: el => applyImport(el.dataset.mode),
  resetAll: () => resetAll(),
  saveApiKey: () => saveApiKey(),
  toggleKeyVis: () => { const i = $('#apiKeyInput'); if (i) i.type = i.type === 'password' ? 'text' : 'password'; },
  fetchModels: () => fetchModelsAction(),
  applyPreset: el => applyPreset(el.dataset.preset),
  previewVoice: () => previewVoice()
};

function handleActionError(err) {
  if (isAbort(err)) return;
  console.error(err);
  toast(`오류: ${err?.message || err}`, 'error', 5000);
}
function runAction(el, e) {
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  // iOS 오디오 잠금 해제를 위해 반드시 이벤트 핸들러 안에서 동기적으로 호출한다
  try {
    const r = fn(el, e);
    if (r && typeof r.catch === 'function') r.catch(handleActionError);
  } catch (err) { handleActionError(err); }
}

function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    if (el.tagName === 'BUTTON' || el.getAttribute('role') === 'button') e.preventDefault();
    runAction(el, e);
  });

  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.key === 'Escape') {
      const top = modalStack[modalStack.length - 1];
      if (top && top.dismissible) closeModal(top.id);
      return;
    }
    // Space: 대화 화면에서 내 턴 시작/끝 (입력칸·창이 열려 있을 때는 제외)
    if ((e.code === 'Space' || e.key === ' ') && S && currentView === 'talk' && !modalStack.length && !e.isComposing) {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable) return;
      e.preventDefault();
      if (t.tagName === 'BUTTON') t.blur();
      if (!e.repeat) spaceAction();
      return;
    }
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (t.matches?.('[role="button"][data-action]')) { e.preventDefault(); runAction(t, e); return; }
    if (t.id === 'talkInput' && !e.shiftKey) { e.preventDefault(); sendTyped(); return; }
    if (t.id === 'customTopicInput') { e.preventDefault(); startCustomTopic(); return; }
    if (t.id === 'sosInput' && !e.shiftKey) { e.preventDefault(); askSos(); }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'talkInput' && S) { S.draftText = t.value; return; }
    const key = t.dataset?.input;
    if (key === 'dexSearch') { dexUi.q = t.value; renderDexList(); }
    else if (key === 'customTopic') ui.customDraft = t.value;
  });

  document.addEventListener('change', e => {
    const t = e.target;
    const kind = t.dataset?.change;
    if (!kind) return;
    if (kind === 'setting') {
      const key = t.dataset.key;
      if (!(key in state.settings)) return;
      state.settings[key] = t.type === 'checkbox' ? t.checked : (typeof state.settings[key] === 'number' ? Number(t.value) : t.value);
      saveState();
      onSettingChanged(key);
    } else if (kind === 'modelSelect') {
      const role = t.dataset.role;
      const input = $(`#modelInput-${role}`);
      if (input) input.value = t.value;
      setModel(role, t.value);
    } else if (kind === 'modelInput') {
      setModel(t.dataset.role, t.value);
    } else if (kind === 'fallbackChain') {
      const list = uniq(t.value.split(/[\s,]+/).map(normalizeModelId).filter(Boolean));
      if (!list.length) { toast('폴백 체인에 모델을 1개 이상 넣어 주세요', 'warn'); t.value = state.settings.models.fallbackChain.join('\n'); return; }
      state.settings.models.fallbackChain = list;
      saveState();
      const paid = list.filter(isPaidModel);
      toast(`🛟 폴백 체인 저장: ${list.join(' → ')}`, 'success');
      if (paid.length) toast(`💰 ${paid.join(', ')}: 무료 등급에서 사용 불가·과금될 수 있어요`, 'warn', 6000);
    } else if (kind === 'usageLimit') {
      const model = t.dataset.model;
      const n = Math.round(Number(t.value));
      if (t.value === '' || !(n > 0)) delete usageLimits[model]; else usageLimits[model] = { limit: n, learned: false };
      saveUsageLimits();
      renderUsageBar();
      rerenderUsageModal();
    } else if (kind === 'dexType') { dexUi.type = t.value; renderDexList(); }
    else if (kind === 'dexTopic') { dexUi.topic = t.value; renderDexList(); }
  });

  // <details>의 toggle 이벤트는 버블링되지 않아 캡처 단계에서 받는다
  document.addEventListener('toggle', e => {
    const n = Number(e.target?.dataset?.track);
    if (!n) return;
    if (e.target.open) ui.openTracks.add(n); else ui.openTracks.delete(n);
  }, true);

  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('pagehide', persistNow);
  window.addEventListener('online', () => toast('🌐 다시 온라인이에요', 'success'));
  window.addEventListener('offline', () => toast('📴 오프라인이에요. 진행 중인 기록은 보존돼요', 'warn', 5000));
  window.addEventListener('error', e => {
    const msg = e.message || '';
    if (!msg || /ResizeObserver|Script error/i.test(msg)) return;
    console.error(e.error || msg);
    toastOnce(`err:${msg}`, `오류: ${msg}`, 'error');
  });
  window.addEventListener('unhandledrejection', e => {
    if (isAbort(e.reason)) return;
    console.error(e.reason);
    toastOnce(`rej:${e.reason?.message}`, `오류: ${e.reason?.message || e.reason}`, 'error');
  });
}

function init() {
  loadState();
  loadModelCache();
  loadModelCaps();
  loadUsage();
  bindEvents();
  renderHeader();
  renderNav();
  switchView('topics');
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch {}
  }
  if (loadPendingReport()) setTimeout(() => toast('🧾 완료되지 않은 리포트가 있어요. 🎙️ 대화 탭에서 생성할 수 있어요', 'info', 6000), 400);
  if (!getApiKey()) setTimeout(() => toast('👋 ⚙️ 설정에서 Gemini API 키를 먼저 입력해 주세요', 'info', 6000), 700);
}

init();
</script>
