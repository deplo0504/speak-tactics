<script>
'use strict';
// ===== [SECTION: CONFIG] =====
const APP_NAME = 'Speak Tactics';
const STATE_VERSION = 1;
const LS_STATE = 'rpg_state';
const LS_SECRETS = 'rpg_secrets';
const LS_MODEL_CACHE = 'rpg_model_cache';
const LS_PENDING_REPORT = 'rpg_pending_report';
const API_BASE = 'https://generativelanguage.googleapis.com/v1beta';
const AI_STUDIO_URL = 'https://aistudio.google.com/apikey';
const COOLDOWN_MS = 48 * 3600 * 1000;
const TIMER_PRESETS = [3, 5, 10, 15, 0];
const MAX_SESSIONS = 50;
const SAVE_PREFIX = 'RPGSAVE1:';

const DEFAULT_MODELS = {
  chat: 'gemini-3.6-flash',
  analysis: 'gemini-3.8-flash',          // 리포트·토픽 생성·보스 평가
  tts: 'gemini-3.8-flash-lite-tts',      // 속도 우선(저지연) TTS
  ttsQuality: 'gemini-3.8-flash-tts',    // 품질 우선 TTS
  transcribe: 'gemini-3.5-flash-lite',   // 녹음 받아쓰기 전용 (대화 맥락 없이 듣기만)
  // 실제 체인 = [역할의 기본 모델, ...이 목록] 중복 제거 → 회화 3.6→3.8→lite, 분석 3.8→3.6→lite
  fallbackChain: ['gemini-3.6-flash', 'gemini-3.8-flash', 'gemini-3.5-flash-lite']
};
// 예전 기본값 그대로인 저장 체인은 새 기본 체인으로 옮긴다 (직접 고친 체인은 유지)
const LEGACY_FALLBACK_CHAINS = [
  ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite'],
  ['gemini-3.6-flash', 'gemini-3.5-flash-lite']
];
const LEGACY_TTS_DEFAULT = 'gemini-3.8-flash-tts';
// TTS 전용 폴백 (일반 폴백 체인은 텍스트 모델이라 TTS에 쓰지 않음)
const TTS_FALLBACKS = ['gemini-2.5-flash-preview-tts'];
const TTS_PREFS = {
  quality: { label: '🎧 품질 우선', desc: '품질 TTS 모델' },
  speed: { label: '⚡ 속도 우선', desc: '저지연 TTS 모델 (기본)' },
  browser: { label: '📢 브라우저 기본 음성', desc: '즉시 재생 · API 호출 없음' }
};
// 모델 목록 조회 실패 시 드롭다운 기본값
const DEFAULT_MODEL_OPTIONS = [
  'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite',
  'gemini-2.5-pro', 'gemini-2.5-flash', 'gemini-2.5-flash-lite',
  'gemini-3.8-flash-lite-tts', 'gemini-3.8-flash-tts', 'gemini-2.5-flash-preview-tts'
];
// 무료 등급에서 사용 불가하거나 과금될 수 있는 모델 패턴
const PAID_MODEL_PATTERNS = [/argon/i, /gemini-4/i, /3\.1-pro/i, /pro-preview/i, /ultra/i];
const HYBRID_ANALYSIS_FALLBACK = 'gemini-2.5-pro';

// 공식 문서의 prebuilt voice 목록
const VOICES = [
  ['Zephyr', 'Bright'], ['Puck', 'Upbeat'], ['Charon', 'Informative'], ['Kore', 'Firm'], ['Fenrir', 'Excitable'],
  ['Leda', 'Youthful'], ['Orus', 'Firm'], ['Aoede', 'Breezy'], ['Callirrhoe', 'Easy-going'], ['Autonoe', 'Bright'],
  ['Enceladus', 'Breathy'], ['Iapetus', 'Clear'], ['Umbriel', 'Easy-going'], ['Algieba', 'Smooth'], ['Despina', 'Smooth'],
  ['Erinome', 'Clear'], ['Algenib', 'Gravelly'], ['Rasalgethi', 'Informative'], ['Laomedeia', 'Upbeat'], ['Achernar', 'Soft'],
  ['Alnilam', 'Firm'], ['Schedar', 'Even'], ['Gacrux', 'Mature'], ['Pulcherrima', 'Forward'], ['Achird', 'Friendly'],
  ['Zubenelgenubi', 'Casual'], ['Vindemiatrix', 'Gentle'], ['Sadachbia', 'Lively'], ['Sadaltager', 'Knowledgeable'], ['Sulafat', 'Warm']
].map(([name, style]) => ({ name, style }));
const DEFAULT_VOICE = 'Puck';

const STAGES = {
  1: { label: 'Stage 1', icon: '🛡️', name: '스피킹 재활 & 순발력 복구', goal: '현재 AM 180점 유지·안정화',
       desc: '친절하고 명확한 미군 동료 톤. 3초 안에 입 밖으로 꺼내기, 기본 구동사와 시제 정확도.',
       persona: 'Mike, a friendly, clear-speaking US Army sergeant',
       style: 'Friendly, clear US Army coworker tone. Use simple, clear sentences at a moderate pace so the user can start answering within 3 seconds. Create natural chances to use basic phrasal verbs and accurate tenses (past, present perfect, future).' },
  2: { label: 'Stage 2', icon: '🍺', name: '카투사 한계 돌파: 슬랭 & 리얼 토크', goal: '목표 OPIc AL',
       desc: '배럭스·펍에서 미군끼리 빠르게 말하는 캐주얼 톤. 축약어, 실전 슬랭, 맞장구, 스토리텔링.',
       persona: 'Jay, a laid-back US soldier buddy from the barracks',
       style: "Fast, casual tone like US soldiers chatting in the barracks or at a pub. Use contractions (gonna, wanna, y'know), real everyday slang, natural backchannels (no way, for real?, that's wild) and pull full stories out of the user." },
  3: { label: 'Stage 3', icon: '⚖️', name: '논리적 변증', goal: '목표 토스 AM 190점',
       desc: '근거를 대고, "왜? 반대로 보면?" 같은 반문에 막힘없이 답하기.',
       persona: 'Sam, a sharp friend who loves a good debate',
       style: 'Logical, dialectical conversation. Ask for reasons and concrete examples, and challenge with "why?", "but what about...?" or "flip it around" so the user practices defending a view without stalling.' },
  4: { label: 'Stage 4', icon: '👑', name: '네이티브 마스터', goal: '목표 토스 AH 200점',
       desc: '원어민 100% 속도, 비유·유머·외교적 화법, 미세한 어색함까지 다룸.',
       persona: 'Alex, a witty native speaker who talks at full speed',
       style: 'Full native speed and phrasing, idioms, metaphors, light humor and diplomatic hedging. Treat the user as a near-native peer.' }
};

const TRACKS = {
  1: { emoji: '🏠', name: 'My Life, Routine & Personal Stories', nameKo: '내 일상 말하기', tag: '핵심 · 35%', core: true,
       concept: "A curious foreign friend or coworker asks concretely about the user's daily patterns, habits, tastes and recent experiences, and keeps asking follow-up questions." },
  2: { emoji: '💭', name: 'What Do You Think? Everyday Opinions', nameKo: '내 생각 말하기', tag: '핵심 · 35%', core: true,
       concept: '"What do you think?" / "What would you pick?" — the user states a personal opinion with clear, well-organized reasons.' },
  3: { emoji: '🇺🇸', name: 'Bro Vibes & Daily Situations', nameKo: '브로 토크 & 생활 상황', tag: '서브 · 15%', core: false,
       concept: 'Casual bro-to-bro talk and real-life situations. For situational topics (plan changes, complaints, clinic) naturally play the matching role (friend, staff, pharmacist, doctor).' },
  4: { emoji: '🏛️', name: 'Politics & Diplomacy', nameKo: '정치 & 외교', tag: '스페셜 · 15%', core: false,
       concept: "Light but thoughtful talk about politics and diplomacy. Stay strictly non-partisan, lay out the strongest arguments on each side, and draw out the user's own view and reasoning." }
};
const CUSTOM_TRACK = { emoji: '✍️', name: 'Free Talk', nameKo: '직접 입력', tag: '자유',
  concept: 'Free talk about something the user brought up themselves (it may be written in Korean — always talk in English). Chat about it like a friend catching up: what happened, the details, how it felt, what comes next.' };

const INPUT_MODES = {
  record: { icon: '🎙️', label: '녹음 전송', desc: '녹음 → 대화 맥락 없이 받아쓰기(전사) → 대답 · 발음 평가 포함 (아이폰 권장)' },
  browserStt: { icon: '⚡', label: '브라우저 음성 인식', desc: '브라우저가 받아쓴 텍스트만 전송 · 발음 평가 불가' },
  keyboard: { icon: '⌨️', label: '키보드', desc: '마이크가 안 될 때 타이핑으로 대화' }
};

// holdMs: 말한 뒤 이만큼 조용하면 턴 종료 · idleMs: 녹음을 켰는데 이만큼 아무 말이 없으면 보내지 않고 멈춤
const SILENCE = { threshold: 0.02, holdMs: 5000, idleMs: 30000, maxRecordMs: 120000 };

const FALLBACK_CLOSINGS = {
  1: "Alright, that's time! Great talking with you — let's do this again soon.",
  2: "Ah man, we're outta time! Good stuff, bro — catch you later.",
  3: "And that's time. Good arguments today — let's pick this up again soon.",
  4: "Well, that's a wrap! Seriously enjoyed this one — until next time."
};

// 공용 유틸
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const uniq = arr => [...new Set(arr)];
const clampInt = (v, min, max, def) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
const uid = (p = 'id') => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
const pad2 = n => String(n).padStart(2, '0');
const fmtDate = ts => { const d = new Date(ts); return `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtClock = (ms, ceil = false) => { const s = Math.max(0, ceil ? Math.ceil(ms / 1000) : Math.floor(ms / 1000)); return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; };
function sleep(ms, signal) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(resolve, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); }, { once: true });
  });
}
const isAbort = e => e && (e.name === 'AbortError');
const isPaidModel = id => PAID_MODEL_PATTERNS.some(re => re.test(id || ''));
const normalizeModelId = id => String(id || '').trim().replace(/^models\//, '');

// ===== [SECTION: STATE] =====
let state = null;
let saveTimer = null;

function defaultSettings() {
  return {
    stage: 1,
    timerPreset: 5,
    excludeWaitTime: true,
    inputMode: 'record',
    autoStopOnSilence: true,
    showSubtitles: true,
    voiceName: DEFAULT_VOICE,
    ttsPreference: 'speed',               // 'quality' | 'speed' | 'browser'
    models: { chat: DEFAULT_MODELS.chat, analysis: DEFAULT_MODELS.analysis, tts: DEFAULT_MODELS.tts, ttsQuality: DEFAULT_MODELS.ttsQuality, transcribe: DEFAULT_MODELS.transcribe, fallbackChain: [...DEFAULT_MODELS.fallbackChain] },
    useAnalysisModelForDeepTalk: false,
    onlyCoreTracksInRandom: false,
    showDebugTiming: true,
    handsFree: true                       // AI 말이 끝나면 자동으로 내 녹음 시작
  };
}

function defaultState() {
  return {
    version: STATE_VERSION,
    meta: { updatedAt: Date.now(), deviceId: uid('dev') },
    settings: defaultSettings(),
    profile: {
      exp: 0, level: 1, rankStage: 1,
      stats: { fluency: 60, vocab: 60, grammar: 60, logic: 60, nuance: 60 },
      pendingBoss: null, bossHistory: []
    },
    topicProgress: {},
    customTopics: [],
    dex: [],
    sessions: []
  };
}

function emptyProgress() {
  return { clearCount: 0, lastClearedAt: null, summaries: [], anglesCovered: [] };
}

function normalizeKeyExpr(k) {
  if (typeof k === 'string') { const [en, ko] = k.split(/\s*[—–|]\s*/); return { en: (en || '').trim(), ko: (ko || '').trim() }; }
  if (isObj(k)) return { en: String(k.en ?? k.expression ?? '').trim(), ko: String(k.ko ?? k.meaningKo ?? '').trim() };
  return { en: '', ko: '' };
}

function normalizeTopic(t, source = 'custom') {
  return {
    id: String(t.id),
    track: clampInt(t.track, 1, 4, 1),
    title: String(t.title || 'Untitled'),
    titleKo: String(t.titleKo || t.title || ''),
    subtitle: String(t.subtitle || ''),
    starterQuestions: (Array.isArray(t.starterQuestions) ? t.starterQuestions : []).map(String).filter(Boolean).slice(0, 3),
    keyExpressions: (Array.isArray(t.keyExpressions) ? t.keyExpressions : []).map(normalizeKeyExpr).filter(k => k.en).slice(0, 4),
    createdAt: Number(t.createdAt) || Date.now(),
    source: t.source === 'ai' ? 'ai' : source
  };
}

function migrateState(raw) {
  const d = defaultState();
  if (!isObj(raw)) return d;
  const s = { ...d, ...raw, version: STATE_VERSION };

  s.meta = { ...d.meta, ...(isObj(raw.meta) ? raw.meta : {}) };
  if (!s.meta.deviceId) s.meta.deviceId = d.meta.deviceId;

  const rs = isObj(raw.settings) ? raw.settings : {};
  const st = { ...d.settings, ...rs };
  st.models = { ...d.settings.models, ...(isObj(rs.models) ? rs.models : {}) };
  // 이전 기본 TTS 모델을 쓰던 저장 데이터는 새 저지연 기본값으로 옮기고, 기존 모델은 품질 우선용으로 남긴다
  if (isObj(rs.models) && !rs.models.ttsQuality && normalizeModelId(rs.models.tts) === LEGACY_TTS_DEFAULT) {
    st.models.tts = DEFAULT_MODELS.tts;
    st.models.ttsQuality = LEGACY_TTS_DEFAULT;
  }
  for (const r of ['chat', 'analysis', 'tts', 'ttsQuality', 'transcribe']) st.models[r] = normalizeModelId(st.models[r]) || DEFAULT_MODELS[r];
  if (!TTS_PREFS[st.ttsPreference]) st.ttsPreference = 'speed';
  st.models.fallbackChain = (Array.isArray(st.models.fallbackChain) ? st.models.fallbackChain : []).map(normalizeModelId).filter(Boolean);
  const chainKey = st.models.fallbackChain.join('|');
  if (!st.models.fallbackChain.length || LEGACY_FALLBACK_CHAINS.some(c => c.join('|') === chainKey)) st.models.fallbackChain = [...DEFAULT_MODELS.fallbackChain];
  st.stage = clampInt(st.stage, 1, 4, 1);
  st.timerPreset = TIMER_PRESETS.includes(Number(st.timerPreset)) ? Number(st.timerPreset) : 5;
  if (!INPUT_MODES[st.inputMode]) st.inputMode = 'record';
  for (const k of ['excludeWaitTime', 'autoStopOnSilence', 'showSubtitles', 'useAnalysisModelForDeepTalk', 'onlyCoreTracksInRandom', 'showDebugTiming', 'handsFree']) {
    if (typeof st[k] !== 'boolean') st[k] = d.settings[k];
  }
  if (!VOICES.some(v => v.name === st.voiceName)) st.voiceName = DEFAULT_VOICE;
  s.settings = st;

  const rp = isObj(raw.profile) ? raw.profile : {};
  const p = { ...d.profile, ...rp };
  p.stats = { ...d.profile.stats, ...(isObj(rp.stats) ? rp.stats : {}) };
  p.exp = Math.max(0, Math.round(Number(p.exp) || 0));
  p.level = Math.max(1, Math.round(Number(p.level) || 1));
  p.rankStage = clampInt(p.rankStage, 1, 4, 1);
  if (!Array.isArray(p.bossHistory)) p.bossHistory = [];
  if (p.pendingBoss === undefined) p.pendingBoss = null;
  s.profile = p;

  s.topicProgress = {};
  if (isObj(raw.topicProgress)) {
    for (const [k, v] of Object.entries(raw.topicProgress)) {
      if (!isObj(v)) continue;
      s.topicProgress[k] = {
        clearCount: Math.max(0, Math.round(Number(v.clearCount) || 0)),
        lastClearedAt: Number(v.lastClearedAt) || null,
        summaries: (Array.isArray(v.summaries) ? v.summaries : []).map(String).slice(-5),
        anglesCovered: (Array.isArray(v.anglesCovered) ? v.anglesCovered : []).map(String)
      };
    }
  }

  s.customTopics = (Array.isArray(raw.customTopics) ? raw.customTopics : [])
    .filter(t => isObj(t) && t.id && t.title).map(t => normalizeTopic(t, 'custom'));

  s.dex = (Array.isArray(raw.dex) ? raw.dex : []).filter(x => isObj(x) && x.id).map(x => ({
    id: String(x.id),
    type: ['hud', 'sos', 'report'].includes(x.type) ? x.type : 'hud',
    original: String(x.original ?? ''),
    native: String(x.native ?? ''),
    tipKo: String(x.tipKo ?? ''),
    topicId: x.topicId ?? null,
    createdAt: Number(x.createdAt) || Date.now(),
    box: Math.max(1, Math.round(Number(x.box) || 1)),
    lastReviewedAt: Number(x.lastReviewedAt) || null,
    reviewCount: Math.max(0, Math.round(Number(x.reviewCount) || 0))
  }));

  s.sessions = (Array.isArray(raw.sessions) ? raw.sessions : []).filter(x => isObj(x) && x.id)
    .sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0)).slice(0, MAX_SESSIONS);
  return s;
}

// 변경 후 500ms 디바운스 저장
function saveState() {

}
function persistNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!state) return;
  state.meta.updatedAt = Date.now();
  try { localStorage.setItem(LS_STATE, JSON.stringify(state)); }
  catch (e) { console.error(e); toastOnce('persist-fail', '브라우저 저장소에 저장하지 못했어요 (저장 공간 부족 또는 개인정보 보호 모드)', 'error', 60000); }
}

function setSecret(key, value) {

  try { localStorage.setItem(LS_SECRETS, JSON.stringify(s)); } catch (e) { toast('API 키를 저장하지 못했어요', 'error'); }
}

// 내보내기용 사본: 비밀값 키를 명시적으로 제거한다 (세이브 코드·내보내기·클라우드 동기화 공통)
function exportState() {
  const copy = JSON.parse(JSON.stringify(state));
  for (const k of ['secrets', 'rpg_secrets', 'apiKey', 'geminiApiKey', 'firebaseToken', 'authToken']) delete copy[k];
  if (copy.settings) for (const k of ['apiKey', 'geminiApiKey', 'firebaseToken']) delete copy.settings[k];
  return copy;
}

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function base64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function makeSaveCode() {
  return SAVE_PREFIX + utf8ToBase64(JSON.stringify(exportState()));
}
function parseSaveCode(code) {
  let s = String(code || '').replace(/\s+/g, '');
  if (!s) throw new Error('세이브 코드를 붙여넣어 주세요');
  if (s.startsWith(SAVE_PREFIX)) s = s.slice(SAVE_PREFIX.length);
  let obj;
  try { obj = JSON.parse(base64ToUtf8(s)); } catch { throw new Error('세이브 코드 형식이 올바르지 않아요 (일부만 복사됐는지 확인)'); }
  if (!isObj(obj) || typeof obj.version !== 'number' || !isObj(obj.settings)) throw new Error('이 앱의 세이브 코드가 아니에요');
  if (obj.version > STATE_VERSION) throw new Error('더 최신 버전 앱에서 만든 세이브 코드예요');
  for (const k of ['secrets', 'rpg_secrets', 'apiKey', 'geminiApiKey']) delete obj[k];
  return migrateState(obj);
}

// 합치기: dex·customTopics = id 합집합, topicProgress = clearCount 큰 쪽, profile.exp = 큰 쪽
function mergeStates(local, incoming) {
  const out = JSON.parse(JSON.stringify(local));
  const dexMap = new Map(out.dex.map(d => [d.id, d]));
  for (const d of incoming.dex) {
    const cur = dexMap.get(d.id);
    if (!cur || (d.reviewCount || 0) > (cur.reviewCount || 0)) dexMap.set(d.id, d);
  }
  out.dex = [...dexMap.values()].sort((a, b) => b.createdAt - a.createdAt);

  const topicMap = new Map(out.customTopics.map(t => [t.id, t]));
  for (const t of incoming.customTopics) if (!topicMap.has(t.id)) topicMap.set(t.id, t);
  out.customTopics = [...topicMap.values()];

  for (const [id, inc] of Object.entries(incoming.topicProgress)) {
    const cur = out.topicProgress[id];
    if (!cur || inc.clearCount > cur.clearCount || (inc.clearCount === cur.clearCount && (inc.lastClearedAt || 0) > (cur.lastClearedAt || 0))) {
      out.topicProgress[id] = inc;
    }
  }

  if (incoming.profile.exp > out.profile.exp) out.profile = incoming.profile;

  const sesMap = new Map(out.sessions.map(x => [x.id, x]));
  for (const x of incoming.sessions) if (!sesMap.has(x.id)) sesMap.set(x.id, x);
  out.sessions = [...sesMap.values()].sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0)).slice(0, MAX_SESSIONS);
  return migrateState(out);
}

class GeminiError extends Error {
  constructor(message, opts = {}) {
    super(message);
    this.name = 'GeminiError';
    Object.assign(this, { status: 0, retryable: false, retryDelay: null, parseFail: false, thinkingIssue: false, model: null }, opts);
  }
}

function modelForRole(role) {
  const m = state.settings.models;
  if (role === 'analysis') return m.analysis || DEFAULT_MODELS.analysis;
  if (role === 'tts') return (state.settings.ttsPreference === 'quality' ? m.ttsQuality : m.tts) || DEFAULT_MODELS.tts;
  if (role === 'ttsQuality') return m.ttsQuality || DEFAULT_MODELS.ttsQuality;
  if (role === 'transcribe') return m.transcribe || DEFAULT_MODELS.transcribe;
  return m.chat || DEFAULT_MODELS.chat;
}
function chainForRole(role, override) {
  const first = normalizeModelId(override || modelForRole(role));
  const m = state.settings.models;
  if (role === 'tts') return uniq([first, m.tts, m.ttsQuality, ...TTS_FALLBACKS].map(normalizeModelId).filter(Boolean));
  return uniq([first, ...m.fallbackChain.map(normalizeModelId)].filter(Boolean));
}

// 회화는 모델이 지원하는 가장 낮은 thinking, 분석은 'high'. 모델 세대별로 설정 형식이 다르다 (ai.google.dev/gemini-api/docs/thinking):
// - 2.5: thinkingBudget (0 = 끔, -1 = 동적). 2.5 Pro는 끌 수 없어 최소 128.
// - 3.x 이상: thinkingLevel만. thinkingBudget과 같이 보내면 400이고, 3.x에 thinkingBudget:0도 400.
//   'minimal'은 3.6 Flash·Flash-Lite 계열만 지원. 3.7·3.8 Flash, Pro, Argon은 'low'가 최저 (minimal → 400 "Thinking level MINIMAL is not supported").
function supportsMinimalThinking(model) {
  if (/pro|argon/i.test(model)) return false;
  if (/lite/i.test(model)) return true;
  const v = /gemini-(\d+)\.(\d+)-flash/i.exec(model);
  return !v || Number(v[1]) < 3 || (Number(v[1]) === 3 && Number(v[2]) <= 6);
}
function thinkingConfigFor(model, level) {
  if (!level || /tts/i.test(model)) return null;
  // 이 모델이 전에 거부한 thinking 값은 보내지 않는다 (400은 하루 요청 한도도 깎는다)
  const floor = modelCaps[model]?.thinkingFloor;
  if (level !== 'high' && floor === 'none') return null;
  if (level === 'minimal' && floor === 'low') level = 'low';
  if (/gemini-(1\.|2\.0)/i.test(model)) return null;
  if (/gemini-2\.5/i.test(model)) {
    if (level === 'high') return { thinkingBudget: -1 };
    return { thinkingBudget: /pro/i.test(model) ? 128 : 0 };
  }
  if (level === 'high') return { thinkingLevel: 'high' };
  if (level === 'minimal' && supportsMinimalThinking(model)) return { thinkingLevel: 'minimal' };
  return { thinkingLevel: 'low' };
}

function parseRetryDelay(json) {
  const details = json?.error?.details;
  if (Array.isArray(details)) {
    const info = details.find(d => String(d['@type'] || '').includes('RetryInfo'));
    if (info?.retryDelay) { const n = parseFloat(info.retryDelay); if (Number.isFinite(n)) return n; }
  }
  const m = /retry in ([\d.]+)\s*s/i.exec(json?.error?.message || '');
  return m ? parseFloat(m[1]) : null;
}

// fetch 대신 XHR: 오디오 업로드 완료 시점(upload.onload)과 스트리밍 진행(onprogress)을 둘 다 잴 수 있다
function xhrPost(url, body, { signal, onUploaded, onProgress } = {}) {
  return new Promise((resolve, reject) => {
    if (signal?.aborted) { reject(new DOMException('Aborted', 'AbortError')); return; }
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.timeout = 90000; // 응답이 영영 안 오는 경우에도 대화가 멈추지 않도록
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('x-goog-api-key', getApiKey());
    if (onUploaded) xhr.upload.onload = () => onUploaded(performance.now());
    if (onProgress) xhr.onprogress = () => onProgress(xhr.responseText, xhr.status);
    xhr.onload = () => resolve({ status: xhr.status, statusText: xhr.statusText, text: xhr.responseText });
    xhr.onerror = () => reject(Object.assign(new Error('network error'), { gotStatus: xhr.status, partialText: xhr.responseText }));
    xhr.ontimeout = () => reject(new Error('timeout'));
    xhr.onabort = () => reject(new DOMException('Aborted', 'AbortError'));
    if (signal) signal.addEventListener('abort', () => xhr.abort(), { once: true });
    xhr.send(JSON.stringify(body));
  });
}

// SSE 응답 텍스트에서 완성된 이벤트만 잘라 data JSON을 넘긴다 (cursor로 이어서 처리)
function consumeSse(sse, text, onData) {
  const chunk = text.slice(sse.cursor);
  const re = /\r?\n\r?\n/g;
  let m, start = 0;
  while ((m = re.exec(chunk))) {
    const evt = chunk.slice(start, m.index);
    start = m.index + m[0].length;
    const data = evt.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).trimStart()).join('\n');
    if (!data) continue;
    let obj;
    try { obj = JSON.parse(data); } catch { continue; }
    onData(obj);
  }
  sse.cursor += start;
}
function parseErrorBody(text) {
  try { return JSON.parse(text); } catch {}
  const m = /data:\s*(\{[\s\S]*\})/.exec(text || '');
  if (m) { try { return JSON.parse(m[1]); } catch {} }
  return null;
}

/**
 * 모델 1개에 1회 요청. stream=true면 streamGenerateContent(SSE)로 받아 누적 텍스트를 onText로 흘려준다.
 * 반환: 일반 → GenerateContentResponse JSON, 스트림 → { streamed, text, modelVersion, blockReason, finishReason }
 */
async function requestModel(model, body, signal, { stream = false, onUploaded = null, onText = null } = {}) {
  if (!getApiKey()) throw new GeminiError('Gemini API 키가 없어요. ⚙️ 설정에서 입력해 주세요.', { code: 'NO_KEY' });
  if (navigator.onLine === false) throw new GeminiError('인터넷 연결이 끊겨 있어요. 연결 후 다시 시도해 주세요.', { code: 'OFFLINE' });
  const url = `${API_BASE}/models/${encodeURIComponent(model)}:${stream ? 'streamGenerateContent?alt=sse' : 'generateContent'}`;
  countRequest(model); // 보낸 요청은 일단 센다 (429로 거절되면 아래에서 되돌림)
  let acc = '', modelVersion = null, finishReason = null, blockReason = null, sseError = null;
  const sse = { cursor: 0 };
  const handleData = obj => {
    if (obj.error) { sseError = obj.error; return; }
    modelVersion = obj.modelVersion || modelVersion;
    blockReason = obj.promptFeedback?.blockReason || blockReason;
    const c = obj.candidates?.[0];
    if (c?.finishReason) finishReason = c.finishReason;
    const t = (c?.content?.parts || []).filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
    if (t) { acc += t; onText && onText(acc); }
  };
  let res;
  try {
    res = await xhrPost(url, body, {
      signal,
      onUploaded,
      onProgress: stream ? (text, status) => { if (status === 200) consumeSse(sse, text, handleData); } : null
    });
  } catch (e) {
    if (isAbort(e)) throw e;
    throw new GeminiError(`네트워크 오류 (${e.message || 'request failed'})`, { retryable: true, model, streamBroken: stream });
  }
  if (res.status !== 200) {
    const json = parseErrorBody(res.text);
    const msg = json?.error?.message || res.statusText || `HTTP ${res.status}`;
    const badKey = res.status === 400 && /api key not valid|API_KEY_INVALID/i.test(msg);
    const retryDelay = res.status === 429 ? parseRetryDelay(json) : null;
    const daily = res.status === 429 && isDailyQuotaError(json, retryDelay);
    if (res.status === 429) { countRequest(model, -1); if (daily) markDailyExhausted(model); }
    throw new GeminiError(msg, {
      status: res.status,
      model,
      daily,
      // 400은 같은 모델로 다시 보내도 똑같이 실패하니 다음 모델로 (키 오류만 즉시 중단)
      retryable: [404, 429, 500, 502, 503, 504].includes(res.status) || (res.status === 400 && !badKey),
      retryDelay,
      thinkingIssue: res.status === 400 && /thinking/i.test(msg)
    });
  }
  if (!stream) {
    try { return JSON.parse(res.text); } catch { throw new GeminiError('응답 JSON 파싱 실패', { parseFail: true, retryable: true, model }); }
  }
  consumeSse(sse, `${res.text}\n\n`, handleData);
  if (sseError) throw new GeminiError(sseError.message || '스트림 오류', { status: sseError.code || 0, retryable: true, model, streamBroken: true });

}

function extractText(json) {
  const parts = json?.candidates?.[0]?.content?.parts || [];
  return parts.filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('').trim();
}
function parseJsonLoose(text) {
  try { return JSON.parse(text); } catch {}
  const cleaned = text.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(cleaned); } catch {}
  const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(cleaned.slice(a, b + 1));

// 스트리밍 중인 미완성 JSON에서 문자열 필드 하나가 닫히는 즉시 그 값을 꺼낸다 (아직이면 null)

  const m = new RegExp(`"${key}"\\s*:\\s*"`).exec(text);
  if (!m) return null;
  const start = m.index + m[0].length - 1;
  let escaped = false;
  for (let i = start + 1; i < text.length; i++) {
    const c = text[i];
    if (escaped) { escaped = false; continue; }
    if (c === '\\') { escaped = true; continue; }
    if (c === '"') { try { return JSON.parse(text.slice(start, i + 1)); } catch { return null; } }
  }
  return null;
}

function friendlyError(e) {

  const msg = String(e.message || '');
  let out = msg;
  if (e.status === 400 && /api key not valid|API_KEY_INVALID/i.test(msg)) out = 'API 키가 올바르지 않아요. ⚙️ 설정에서 확인해 주세요.';
  else if (e.status === 401 || e.status === 403) out = `API 키 권한 오류 (${e.status}). 키 또는 결제/지역 설정을 확인해 주세요.`;
  else if (e.status === 429) out = `요청 한도 초과 (429)${e.retryDelay ? ` — 약 ${Math.ceil(e.retryDelay)}초 후 다시 시도해 주세요` : ' — 잠시 후 다시 시도해 주세요'}`;
  else if (e.status >= 500) out = `Gemini 서버 오류 (${e.status}) — 잠시 후 다시 시도해 주세요`;

  else if (e.parseFail) out = 'AI 응답 형식이 올바르지 않아요. 다시 시도해 주세요.';
  const err = new Error(out);
  err.status = e.status;
  return err;
}

function noteResponder(model, role, fallbackUsed) {
  if (role === 'tts' || role === 'transcribe') return;
  runtime.lastResponder = { model, role, fallbackUsed, at: Date.now() };
  renderCornerBadge();
}
const shortReason = e => (e?.status ? String(e.status) : e?.parseFail ? 'parse' : e?.streamBroken ? 'stream' : 'net');


// ---- 오늘의 API 사용량 (이 기기에서 보낸 요청 수 기준) ----
// Gemini API는 남은 한도를 알려주지 않는다. 그래서 요청 수를 직접 세고, 모델별 하루 한도(직접 입력 또는
// 하루 한도 429가 났을 때 그때까지의 요청 수로 자동 학습)와 비교한다. 하루 한도는 태평양 시간 자정에 초기화된다.
const LS_USAGE = 'rpg_usage';               // { day, counts: { model: n }, exhausted: { model: true } }
const LS_USAGE_LIMITS = 'rpg_usage_limits'; // { model: { limit, learned } }
let usage = null;
let usageLimits = {};

function ptDayKey(d = new Date()) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}
function nextQuotaReset() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  const passed = (Number(p.hour) % 24) * 3600 + Number(p.minute) * 60 + Number(p.second);
  return new Date(Date.now() + (24 * 3600 - passed) * 1000);
}
const fmtLocalTime = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

function loadUsage() {
  try { const u = JSON.parse(localStorage.getItem(LS_USAGE) || 'null'); usage = isObj(u) ? u : null; } catch { usage = null; }
  try { const l = JSON.parse(localStorage.getItem(LS_USAGE_LIMITS) || '{}'); usageLimits = isObj(l) ? l : {}; } catch { usageLimits = {}; }
  ensureUsageDay();
}
function saveUsage() { try { localStorage.setItem(LS_USAGE, JSON.stringify(usage)); } catch {} }
function saveUsageLimits() { try { localStorage.setItem(LS_USAGE_LIMITS, JSON.stringify(usageLimits)); } catch {} }
function ensureUsageDay() {
  const day = ptDayKey();
  if (!usage || usage.day !== day || !isObj(usage.counts) || !isObj(usage.exhausted)) {
    usage = { day, counts: {}, exhausted: {} };
    saveUsage();
  }
}
function countRequest(model, delta = 1) {
  ensureUsageDay();
  usage.counts[model] = Math.max(0, (usage.counts[model] || 0) + delta);
  saveUsage();
  renderUsageBar();
}
function markDailyExhausted(model) {
  ensureUsageDay();
  usage.exhausted[model] = true;
  const used = usage.counts[model] || 0;
  if (used > 0 && !(usageLimits[model] && !usageLimits[model].learned)) { // 직접 입력한 한도는 덮어쓰지 않는다
    usageLimits[model] = { limit: used, learned: true };
    saveUsageLimits();
  }
  saveUsage();
  renderUsageBar();
}
function isDailyQuotaError(json, retryDelay) {
  const details = Array.isArray(json?.error?.details) ? json.error.details : [];
  const qf = details.find(d => String(d['@type'] || '').includes('QuotaFailure'));
  if (qf && (qf.violations || []).some(v => /perday|per_day|daily/i.test(`${v.quotaId || ''} ${v.quotaMetric || ''}`))) return true;
  if (/per day|daily|perday/i.test(json?.error?.message || '')) return true;
  return retryDelay != null && retryDelay > 3600;
}
function usageInfo(model) {
  ensureUsageDay();
  const used = usage.counts[model] || 0;
  const lim = Number(usageLimits[model]?.limit) || null;
  const exhausted = !!usage.exhausted[model];
  const pct = exhausted ? 100 : lim ? Math.min(100, Math.round((used / lim) * 100)) : null;
  return { used, lim, exhausted, pct, learned: !!usageLimits[model]?.learned };
}
function usageRoles() {
  const roles = [{ icon: '💬', label: '회화', model: modelForRole('chat') }, { icon: '🎧', label: '전사', model: modelForRole('transcribe') }];
  if (state.settings.ttsPreference !== 'browser') roles.push({ icon: '🔊', label: '음성', model: modelForRole('tts') });
  return roles.map(r => ({ ...r, ...usageInfo(r.model) }));
}
const usageColor = pct => (pct == null ? 'bg-slate-600' : pct >= 85 ? 'bg-rose-400' : pct >= 60 ? 'bg-amber-400' : 'bg-emerald-400');

// ---- 모델 상태 기억 ----
// 회화 호출 시간 제한: 첫 토큰이 10초 안에 안 오면 그 모델은 포기. 8초 안에 첫 토큰이 없으면 다음 모델에도 동시 요청(헤징).
// (3.6-flash 첫 응답 1.7~7.1초 실측: 4초로 두면 절반 넘게 헤징돼 다음 모델의 하루 한도만 깎였다)
// 첫 토큰 후 대사 완성까지 10초, 대사 도착 후 HUD까지 20초. 스트리밍이 아닌 회화 호출(SOS·첫 질문 미리 준비)은 응답 전체가 첫 토큰.
const FAST = { hedgeMs: 8000, firstTokenMs: 10000, replyAfterTokenMs: 10000, afterReplyMs: 20000 };
const RETRY_503_DELAY_MS = 1000; // 503은 1초 뒤 같은 모델로 1회만 재시도, 그다음 폴백
const SESSION_SKIP_AFTER = 2;    // 한 대화에서 연속 2번 실패한 모델은 대화가 끝날 때까지 건너뜀
const MODEL_DOWN_MS = 3 * 60000;     // 503·429·5xx·네트워크 오류 → 3분간 뒤로 미룸
const MODEL_HUNG_MS = 30 * 60000;    // 시간초과(응답이 아예 없음) → 30분간 뒤로 미룸
const MODEL_MISSING_MS = 30 * 60000; // 404·미지원 → 30분간 뒤로 미룸
const LS_MODEL_CAPS = 'rpg_model_caps';
const modelHealth = new Map(); // model → { downUntil, reason }
let modelCaps = {};            // model → { thinkingFloor: 'low' | 'none' } (거부된 thinking 값 기억, 기기에 저장)

function loadModelCaps() {
  try { const v = JSON.parse(localStorage.getItem(LS_MODEL_CAPS) || '{}'); modelCaps = isObj(v) ? v : {}; } catch { modelCaps = {}; }
}
function setThinkingFloor(model, floor) {
  modelCaps[model] = { ...(modelCaps[model] || {}), thinkingFloor: floor };
  try { localStorage.setItem(LS_MODEL_CAPS, JSON.stringify(modelCaps)); } catch {}
}
function markModelDown(model, e) {
  if (e?.thinkingIssue) return; // thinking 값만 거부된 것 → 바뀐 값으로 다음 요청은 정상
  let ms = MODEL_DOWN_MS;
  if (e?.status === 404 || e?.status === 400) ms = MODEL_MISSING_MS;
  if (e?.status === 'timeout') ms = MODEL_HUNG_MS;
  if (e?.status === 429 && e.retryDelay) ms = Math.max(ms, e.retryDelay * 1000);
  if (e?.daily) ms = Math.max(ms, nextQuotaReset() - Date.now()); // 하루 한도 소진 → 초기화 시각까지
  modelHealth.set(model, { downUntil: Date.now() + ms, reason: e?.daily ? '하루 한도' : shortReason(e) });
}
const markModelUp = model => modelHealth.delete(model);
const isModelDown = model => (modelHealth.get(model)?.downUntil || 0) > Date.now();
// 최근 실패한 모델은 체인 뒤로 보낸다 (마지막 수단으로는 여전히 시도)
const orderByHealth = chain => [...chain.filter(m => !isModelDown(m)), ...chain.filter(isModelDown)];
// 대화 중(S가 있을 때)만 모델별 연속 실패를 센다. 성공하면 0으로. 대화가 끝나면 S와 함께 사라진다
function noteSessionResult(model, ok) {
  if (!S) return;
  const f = S.modelFails || (S.modelFails = {});
  if (ok) { delete f[model]; return; }
  f[model] = (f[model] || 0) + 1;
  if (f[model] === SESSION_SKIP_AFTER) toastOnce(`skip:${S.id}:${model}`, `⏭ ${model} 연속 ${SESSION_SKIP_AFTER}번 실패 → 이번 대화에서는 건너뛸게요`, 'warn', 6000);
}
const isSessionSkipped = model => (S?.modelFails?.[model] || 0) >= SESSION_SKIP_AFTER;
const sessionSkippedText = () => Object.keys(S?.modelFails || {}).filter(isSessionSkipped).join(', ');
// 건너뛸 모델을 빼고 건강한 순서로. 전부 빠지면 마지막 수단으로 원래 체인
function usableChain(chain) {
  const left = chain.filter(m => !isSessionSkipped(m));
  return orderByHealth(left.length ? left : chain);
}
function downModelsText() {
  return [...modelHealth.entries()]
    .filter(([, h]) => h.downUntil > Date.now())
    .map(([m, h]) => {
      const left = h.downUntil - Date.now();
      return `${m} (${h.reason}, ${left > 90 * 60000 ? `${fmtLocalTime(new Date(h.downUntil))}까지` : `${Math.ceil(left / 60000)}분`})`;
    })
    .join(', ');
}

function logAttempt(meta, model, status, startedAt, reason = '') {
  if (!meta) return;
  const row = { model, status: String(status), ms: Math.round(performance.now() - startedAt), reason: String(reason || '').slice(0, 120) };
  meta.trace.push(row);
  if (!['ok', 'cancel'].includes(row.status)) meta.attempts.push(row);
}
function prepMeta(meta, chain) {
  if (!meta) return;
  meta.requested = meta.requested || chain[0];
  meta.attempts = meta.attempts || [];
  meta.trace = meta.trace || [];
}
function finishMeta(meta, res, role, firstModel) {
  noteResponder(res.model, role, res.model !== firstModel);
  if (!meta) return;
  meta.responder = res.model;
  meta.tFull = performance.now();
  if (meta.tReply == null) meta.tReply = meta.tFull;
  if (res.streamed) meta.streamed = true;
  if (res.partial) meta.partial = true;
}

/**
 * 모델 1개에 대한 시도. 같은 모델 안에서의 재시도는 이것뿐이다:
 * 503은 1초 뒤 1회, 스트림이 실패하면 일반 요청으로, JSON 파싱 실패는 1회.
 * 400은 재시도 없이 바로 던진다 (thinking 값 거부였으면 낮춘 값을 기억해 다음 요청부터 적용).

async function attemptModel(model, { contents, systemInstruction, schema, thinking, generationConfig = {}, raw, signal, wantStream, onReply, onFirstToken, onUploaded, meta }) {
  const startedAt = performance.now();
  let level = thinking, parseRetried = false, retried503 = false, useStream = wantStream, emitted = null, gotToken = false;
  for (let step = 0; step < 6; step++) {
    const body = { contents, generationConfig: { ...generationConfig } };
    if (systemInstruction) body.systemInstruction = { parts: [{ text: systemInstruction }] };
    if (schema) { body.generationConfig.responseMimeType = 'application/json'; body.generationConfig.responseSchema = schema; }
    const tc = thinkingConfigFor(model, level);
    if (tc) body.generationConfig.thinkingConfig = tc;
    try {
      if (useStream) {
        const res = await requestModel(model, body, signal, {
          stream: true,
          onUploaded,
          onText: acc => {
            if (!gotToken) { gotToken = true; onFirstToken && onFirstToken(); }
            if (emitted != null) return;
            const r = extractJsonStringField(acc, 'reply');
            if (r == null) return;
            emitted = r;
            onReply && onReply(r);
          }
        });
        const responder = normalizeModelId(res.modelVersion) || model;
        let data = null;
        if (res.text) { try { data = parseJsonLoose(res.text); } catch {} }
        if (data) return { data, model: responder, streamed: true };
        if (emitted != null) return { data: { reply: emitted }, model: responder, streamed: true, partial: true };
        logAttempt(meta, model, 'stream', startedAt, `스트림 응답 비어 있음 (${res.blockReason || res.finishReason || 'empty'}) → 일반 요청`);
        if (meta) meta.streamFallback = res.blockReason || res.finishReason || 'empty';
        useStream = false;
        continue;
      }
      const json = await requestModel(model, body, signal, { onUploaded });
      const responder = normalizeModelId(json.modelVersion) || model;
      if (raw) return { json, model: responder };
      const text = extractText(json);
      if (!text) {
        const reason = json?.promptFeedback?.blockReason || json?.candidates?.[0]?.finishReason || 'EMPTY';
        throw new GeminiError(`빈 응답 (${reason})`, { parseFail: true, retryable: true, model });
      }
      if (!schema) return { text, model: responder };
      try { return { data: parseJsonLoose(text), model: responder }; }
      catch { throw new GeminiError('JSON 파싱 실패', { parseFail: true, retryable: true, model }); }
    } catch (e) {
      if (isAbort(e)) throw e;
      if (e.thinkingIssue && level && level !== 'high') {
        if (level === 'minimal') setThinkingFloor(model, 'low');
        else if (level === 'low') setThinkingFloor(model, 'none');
      }
      if (useStream && emitted != null) return { data: { reply: emitted }, model, streamed: true, partial: true };
      if (e.status === 503 && !retried503) {
        retried503 = true;
        logAttempt(meta, model, 503, startedAt, `1초 뒤 재시도: ${e.message}`);
        await sleep(RETRY_503_DELAY_MS, signal);
        continue;
      }
      if (useStream && (e.streamBroken || e.status === 0)) {
        logAttempt(meta, model, 'stream', startedAt, `스트림 실패 → 일반 요청: ${e.message}`);
        if (meta) meta.streamFallback = shortReason(e);
        useStream = false;
        continue;
      }

}

/**
 * 공통 호출 함수.
 * - schema가 있으면 JSON 모드 + responseSchema, 파싱 실패 시 같은 모델로 1회 재요청
 * - 400·404·429·5xx·시간초과면 폴백 체인의 다음 모델로 (대기 없이 바로. 503만 같은 모델로 1초 뒤 1회).
 *   체인을 다 돌아도 실패하면 1초 뒤 한 바퀴 더 (400 난 모델은 빼고). 회화(fast)는 한 바퀴만.
 * - 최근 실패한 모델은 몇 분간 체인 뒤로 보내고, 대화 중 연속 2번 실패한 모델은 그 대화 동안 건너뛴다.
 * - fast: true (회화용) → 시간 제한 + 헤징. stream: { onReply } 면 streamGenerateContent로 대사를 먼저 받는다.
 * - meta: 계측 객체 (requested / responder / attempts / trace / tReqStart / tUploaded / tReply / tFull ...)
 */
async function callGemini(opts = {}) {
  if (opts.fast) return callGeminiFast(opts);
  const { role = 'chat', signal, meta = null, quiet = false, rounds = 2 } = opts;
  const baseChain = chainForRole(role, opts.modelOverride);
  prepMeta(meta, baseChain);
  let lastErr = null;
  const rejected = new Set(); // 400 난 모델: 다시 보내도 같은 400
  for (let round = 0; round < rounds; round++) {
    if (round > 0) await sleep(1000 * 2 ** (round - 1), signal);
    for (const model of usableChain(baseChain).filter(m => !rejected.has(m))) {
      const t = performance.now();
      if (meta && meta.tReqStart == null) meta.tReqStart = t;
      const onUploaded = meta?.trackUpload ? at => { if (meta.tUploaded == null) meta.tUploaded = at; } : null;
      // JSON 응답(리포트·토픽 생성·보스 평가 등)은 스트리밍으로 받아 첫 토큰 제한을 건다.
      // 응답 자체가 없는 모델을 90초씩 기다리지 않도록. 첫 토큰이 오면 제한을 풀고 끝까지 받는다
      const wantStream = !!(opts.schema && !opts.raw);
      const ac = new AbortController();
      const onOuterAbort = () => ac.abort();
      signal?.addEventListener('abort', onOuterAbort, { once: true });
      const firstTokenMs = FAST.firstTokenMs * (opts.thinking === 'high' ? 3 : 1) * (opts.timeScale || 1);
      let timedOut = false;
      const deadT = wantStream ? setTimeout(() => { timedOut = true; ac.abort(); }, firstTokenMs) : null;
      try {
        const res = await attemptModel(model, { ...opts, signal: ac.signal, wantStream, onFirstToken: () => clearTimeout(deadT), onUploaded, meta });
        markModelUp(model);
        noteSessionResult(model, true);
        logAttempt(meta, model, 'ok', t);
        finishMeta(meta, res, role, baseChain[0]);
        return res;
      } catch (caught) {
        const e = timedOut && isAbort(caught) && !signal?.aborted
          ? new GeminiError(`첫 토큰 ${firstTokenMs / 1000}초 초과`, { status: 'timeout', retryable: true, model })
          : caught;
        if (isAbort(e)) throw e;
        lastErr = e;
        logAttempt(meta, model, shortReason(e), t, e.message);
        if (!e.retryable) throw friendlyError(e);
        if (e.status === 400) rejected.add(model);
        markModelDown(model, e);
        noteSessionResult(model, false);
        if (!quiet && e.status === 429) toastOnce(`429:${model}`, `⏳ ${model} 요청 한도 초과${e.retryDelay ? ` — ${Math.ceil(e.retryDelay)}초 후 재사용 가능` : ''}. 다른 모델로 전환할게요`, 'warn', 30000);
      } finally {
        clearTimeout(deadT);
        signal?.removeEventListener('abort', onOuterAbort);
      }
    }
  }
  throw friendlyError(lastErr);
}

/** 회화용: 모델별 시간 제한 + 헤징(대사가 늦으면 다음 모델에도 동시 요청, 먼저 온 쪽 사용) */
function callGeminiFast(opts) {
  const { role = 'chat', schema, signal, meta = null, quiet = false, stream = null, thinking } = opts;
  const wantStream = !!(stream && schema && !opts.raw);

  prepMeta(meta, baseChain);

    let settled = false, winner = null, lastErr = null, qi = 0;
    const queue = usableChain(baseChain);

      for (const a of live) { a.cancelled = true; a.ac.abort(); }
      if (!settled) { settled = true; reject(new DOMException('Aborted', 'AbortError')); }
    };

      a.hedgeT = setTimeout(() => { if (!settled && !winner && launchNext() && meta) meta.hedged = true; }, hedgeMs);

        ...opts,
        wantStream,
        signal: a.ac.signal,
        meta,
        onUploaded: at => {
          // 오디오 업로드가 끝난 시점부터 시간 제한을 다시 잰다 (느린 회선에서 업로드 때문에 포기하지 않도록)

          }

          armDeadline(a, FAST.replyAfterTokenMs * slow);
        },
        onReply: r => {
          if (settled || (winner && winner !== a)) return;
          winner = a;
          a.reply = r;

        live.delete(a);
        clearTimeout(a.hedgeT);
        clearTimeout(a.deadT);
        if (settled || (winner && winner !== a)) return;
        winner = a;
        markModelUp(model);
        noteSessionResult(model, true);
        logAttempt(meta, model, 'ok', a.t);
        finishMeta(meta, res, role, baseChain[0]);
        settle(resolve, res);
      }, e => {
        live.delete(a);
        clearTimeout(a.hedgeT);
        clearTimeout(a.deadT);

        }

        if (isAbort(e) && !a.timedOut) return;
        const err = a.timedOut
          ? new GeminiError(a.gotToken ? `첫 토큰 후 대사 ${FAST.replyAfterTokenMs * slow / 1000}초 초과` : `첫 토큰 ${deadMs / 1000}초 초과`, { status: 'timeout', retryable: true, model })

        afterFailure();
      });
    };
    launchNext();
  });
}

async function fetchModelList() {
  const key = getApiKey();
  if (!key) throw new Error('먼저 API 키를 저장해 주세요');
  const models = [];
  let pageToken = '';
  for (let page = 0; page < 5; page++) {
    const url = `${API_BASE}/models?pageSize=1000${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ''}`;
    let res;
    try { res = await fetch(url, { headers: { 'x-goog-api-key': key } }); }
    catch (e) { throw new Error('네트워크 오류로 모델 목록을 가져오지 못했어요'); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw friendlyError(new GeminiError(json?.error?.message || `HTTP ${res.status}`, { status: res.status }));
    for (const m of json.models || []) {
      if ((m.supportedGenerationMethods || []).includes('generateContent')) {
        models.push({ id: normalizeModelId(m.name), displayName: m.displayName || '' });
      }
    }
    if (!json.nextPageToken) break;
    pageToken = json.nextPageToken;
  }
  if (!models.length) throw new Error('generateContent를 지원하는 모델이 없어요');
  runtime.modelList = models;
  try { localStorage.setItem(LS_MODEL_CACHE, JSON.stringify({ fetchedAt: Date.now(), models })); } catch {}
  return models;
}
function loadModelCache() {
  try { const c = JSON.parse(localStorage.getItem(LS_MODEL_CACHE) || 'null'); if (c && Array.isArray(c.models)) runtime.modelList = c.models; } catch {}
}
function modelOptionsFor(role) {
  const ids = runtime.modelList ? runtime.modelList.map(m => m.id) : DEFAULT_MODEL_OPTIONS;
  const isTts = id => /tts/i.test(id);
  const wantTts = role === 'tts' || role === 'ttsQuality';
  const nonChat = /embedding|imagen|image-generation|veo|aqa|native-audio|live|learnlm/i;
  let list = wantTts ? ids.filter(isTts) : ids.filter(id => !isTts(id) && !nonChat.test(id));
  if (!list.length) list = DEFAULT_MODEL_OPTIONS.filter(id => wantTts === isTts(id));
  return uniq([state.settings.models[role] || modelForRole(role), ...list]);
}

// 반환: { buffer, model, attempts }
async function geminiTTS(text, voiceName) {
  const meta = { attempts: [] };
  const { json, model } = await callGemini({
    role: 'tts',
    contents: [{ role: 'user', parts: [{ text }] }],
    generationConfig: {
      responseModalities: ['AUDIO'],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } }
    },
    raw: true,
    meta,
    quiet: true,
    rounds: 1
  });
  const part = (json?.candidates?.[0]?.content?.parts || []).find(p => p.inlineData?.data || p.inline_data?.data);
  const inline = part?.inlineData || part?.inline_data;
  if (!inline) throw new Error('TTS 응답에 오디오가 없어요');
  const mime = inline.mimeType || inline.mime_type || '';
  const rate = Number((/rate=(\d+)/i.exec(mime) || [])[1]) || 24000;
  return { buffer: pcm16Base64ToBuffer(inline.data, rate), model, attempts: meta.attempts, requested: meta.requested };
}

// Gemini TTS 응답(Base64 16-bit PCM, little-endian, mono) → Float32 AudioBuffer
// 모델에 따라 헤더 없는 PCM(audio/L16;rate=24000)이거나 WAV(audio/wav)로 온다. WAV는 앞에 RIFF 헤더,
// 뒤에 C2PA(AI 생성 출처) 메타데이터 청크가 붙어 있어서 통째로 재생하면 문장 앞뒤로 큰 지지직 소리가 난다 → data 청크만 쓴다
function pcm16Base64ToBuffer(b64, sampleRate = 24000) {
  const ctx = ensureAudioContext();
  if (!ctx) throw new Error('오디오 재생을 지원하지 않는 브라우저예요');
  const bin = atob(b64);
  let off = 0, end = bin.length;
  if (bin.startsWith('RIFF') && bin.slice(8, 12) === 'WAVE') {
    const u16 = i => bin.charCodeAt(i) | (bin.charCodeAt(i + 1) << 8);
    const u32 = i => (u16(i) | (u16(i + 2) << 16)) >>> 0;
    end = 0;
    for (let pos = 12; pos + 8 <= bin.length;) {
      const id = bin.slice(pos, pos + 4), size = u32(pos + 4);
      if (id === 'fmt ') {
        if (u16(pos + 8) !== 1 || u16(pos + 10) !== 1 || u16(pos + 22) !== 16) throw new Error('지원하지 않는 TTS 오디오 형식이에요');

      }
      if (id === 'data') { off = pos + 8; end = Math.min(bin.length, off + size); break; }
      pos += 8 + size + (size & 1);
    }
    if (!end) throw new Error('TTS 응답에 오디오 데이터가 없어요');
  }
  const len = (end - off) >> 1;
  const buffer = ctx.createBuffer(1, Math.max(1, len), sampleRate);
  const ch = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) {
    let v = bin.charCodeAt(off + 2 * i) | (bin.charCodeAt(off + 2 * i + 1) << 8);
    if (v >= 0x8000) v -= 0x10000;
    ch[i] = v / 32768;
  }
  return buffer;
}

function stopPlayback() {
  const resolveFn = audio.playResolve;
  if (audio.currentSource) {
    try { audio.currentSource.onended = null; audio.currentSource.stop(); } catch {}
    audio.currentSource = null;
  }
  audio.playResolve = null;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch {}
  if (resolveFn) resolveFn();
}

function pickBrowserVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices() || [];
  let pool = voices.filter(v => /^en[-_]US/i.test(v.lang));
  if (!pool.length) pool = voices.filter(v => /^en/i.test(v.lang));
  if (!pool.length) return null;
  const score = v => {
    const n = v.name || '';
    let s = 0;
    if (/premium/i.test(n)) s += 5;
    if (/enhanced/i.test(n)) s += 4;
    if (/natural|neural/i.test(n)) s += 3;
    if (/google/i.test(n)) s += 2;
    if (/samantha|alex|ava|evan|zoe|nathan/i.test(n)) s += 1;
    if (/compact|novelty|bad news|bells|bubbles|whisper|zarvox|trinoids|cellos|organ|boing|jester|superstar|wobble/i.test(n)) s -= 10;
    if (v.localService) s += 0.5;
    return s;
  };
  return pool.slice().sort((a, b) => score(b) - score(a))[0];
}

function speakBrowser(text, metric) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { resolve(); return; }
    try { speechSynthesis.cancel(); } catch {}
    const u = new SpeechSynthesisUtterance(text);
    const v = pickBrowserVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    const stage = state.settings.stage;
    u.rate = stage === 1 ? 0.92 : stage >= 4 ? 1.08 : 1;
    let finished = false;
    const fin = () => { if (finished) return; finished = true; clearTimeout(guard); if (audio.playResolve === fin) audio.playResolve = null; resolve(); };
    const guard = setTimeout(fin, Math.max(5000, text.length * 110));
    u.onend = fin;
    u.onerror = fin;
    audio.playResolve = fin;
    markPlay(metric);
    speechSynthesis.speak(u);
  });
}

// 같은 문장의 TTS는 캐시 → 진행 중 요청 공유 → 새 요청 순으로 얻는다 (첫 질문 미리 준비와 공유)
function getTtsAudio(text, voiceName) {
  const key = `${modelForRole('tts')}|${voiceName}|${text}`;
  const cached = audio.ttsCache.get(key);
  if (cached) return Promise.resolve({ ...cached, cached: true });
  let p = audio.ttsInflight.get(key);
  if (!p) {
    p = geminiTTS(text, voiceName)
      .then(r => {
        audio.ttsCache.set(key, r);
        if (audio.ttsCache.size > 40) audio.ttsCache.delete(audio.ttsCache.keys().next().value);
        return r;
      })
      .finally(() => audio.ttsInflight.delete(key));
    audio.ttsInflight.set(key, p);
  }
  return p;
}
const TTS_TIMEOUT_MS = 12000;
function withTimeout(promise, ms, label) {
  let t;
  return Promise.race([promise, new Promise((_, reject) => { t = setTimeout(() => reject(new Error(`${label} ${ms / 1000}초 초과`)), ms); })])
    .finally(() => clearTimeout(t));
}
function abortable(promise, signal) {
  if (!signal) return promise;
  if (signal.aborted) return Promise.reject(new DOMException('Aborted', 'AbortError'));
  return new Promise((resolve, reject) => {
    signal.addEventListener('abort', () => reject(new DOMException('Aborted', 'AbortError')), { once: true });
    promise.then(resolve, reject);
  });
}

// 대사를 [첫 문장, 나머지]로 나눈다. 첫 문장이 3단어 이하면 다음 문장과 합친다. ("2.5"처럼 공백 없는 마침표는 나누지 않음)
function splitForTts(text) {
  const parts = String(text).replace(/([.!?…]+["'”’)\]]*)\s+/g, '$1\u0000').split('\u0000').map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return [String(text)];
  let first = parts[0], i = 1;
  while (i < parts.length && first.split(/\s+/).length <= 3) first += ` ${parts[i++]}`;
  const rest = parts.slice(i).join(' ');
  return rest ? [first, rest] : [first];
}

/**
 * reply 음성 출력. 설정의 TTS 선호에 따라 Gemini TTS(속도/품질) 또는 브라우저 음성.
 * Gemini TTS는 문장 단위로 나눠 동시에 생성하고, 첫 문장이 준비되는 즉시 재생한 뒤 나머지를 이어 재생한다.
 * 첫 문장 TTS가 실패하면 전체를 speechSynthesis로 폴백. 반환값 'gemini' | 'browser' | 'none'
 * metric을 주면 tTtsStart / tTtsReady(첫 문장) / tPlay / ttsMode / ttsModel 을 기록한다.
 */
async function speak(text, { voice, signal, onStart, quietFallback = false, metric = null } = {}) {
  if (!text) return 'none';
  const voiceName = voice || state.settings.voiceName;
  const gen = ++audio.playGen; // 새 speak가 시작되면 이전 speak의 남은 문장은 재생하지 않는다
  const stillMine = () => gen === audio.playGen && !signal?.aborted;
  if (state.settings.ttsPreference === 'browser') {
    if (metric) metric.ttsMode = 'browser';
    onStart && onStart('browser');
    await speakBrowser(text, metric);
    return 'browser';
  }
  if (metric) metric.tTtsStart = performance.now();
  const chunks = splitForTts(text);
  const jobs = chunks.map(c => withTimeout(getTtsAudio(c, voiceName), TTS_TIMEOUT_MS, 'TTS 응답'));
  jobs.forEach(j => j.catch(() => {}));
  let first;
  try {
    first = await abortable(jobs[0], signal);
  } catch (e) {
    if (isAbort(e) || !stillMine()) return 'none';
    console.warn('TTS fallback', e);
    if (metric) { metric.tTtsReady = performance.now(); metric.ttsMode = 'browser(폴백)'; metric.ttsFallback = `Gemini TTS 실패: ${String(e.message).slice(0, 60)}`; }
    if (!quietFallback) toastOnce('tts-fallback', `🔊 Gemini 음성 실패 → 브라우저 음성으로 대체 (${e.message})`, 'warn', 60000);
    onStart && onStart('browser');
    await speakBrowser(text, metric);
    return 'browser';
  }
  if (!stillMine()) return 'none';
  if (metric) {
    metric.tTtsReady = performance.now();
    metric.ttsMode = `${first.cached ? 'gemini(캐시)' : 'gemini'}${chunks.length > 1 ? ` ·${chunks.length}분할` : ''}`;
    metric.ttsModel = first.model;
    const failed = (first.attempts || []).map(a => `${a.model}:${a.status}`);
    if (failed.length) metric.ttsFallback = `${first.requested} → ${first.model} (${failed.join(', ')})`;
  }
  onStart && onStart('gemini');
  await playBuffer(first.buffer, metric);
  for (let k = 1; k < jobs.length; k++) {
    if (!stillMine()) return 'gemini';
    let r;
    try { r = await abortable(jobs[k], signal); }
    catch (e) {
      if (isAbort(e) || !stillMine()) return 'gemini';
      await speakBrowser(chunks[k]); // 남은 문장만 브라우저 음성으로
      continue;
    }
    if (!stillMine()) return 'gemini';
    await playBuffer(r.buffer);
  }
  return 'gemini';
}

function sttErrorMsg(code) {
  return ({
    'not-allowed': '음성 인식 권한이 거부됐어요 (아이폰은 설정 > Siri에서 받아쓰기 허용 필요)',
    'service-not-allowed': '이 브라우저에서 음성 인식 서비스를 쓸 수 없어요',
    'audio-capture': '마이크를 찾지 못했어요',
    'network': '음성 인식 네트워크 오류예요',
    'language-not-supported': '이 언어의 음성 인식을 지원하지 않아요'
  })[code] || `음성 인식 오류 (${code})`;
}
function startBrowserStt({ lang = 'en-US', continuous = false, onInterim } = {}) {
  return new Promise((resolve, reject) => {
    if (!SR) { reject(new Error('이 브라우저는 음성 인식을 지원하지 않아요')); return; }
    const rec = new SR();
    rec.lang = lang;
    rec.interimResults = true;
    rec.continuous = continuous;
    rec.maxAlternatives = 1;
    let finalText = '', interim = '', errCode = null;
    rec.onresult = e => {
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript + ' ';
        else interim += r[0].transcript;
      }
      onInterim && onInterim((finalText + interim).trim());
    };
    rec.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') errCode = e.error; };
    rec.onend = () => {
      if (stt.active === rec) stt.active = null;
      const text = (finalText + interim).trim();
      if (errCode && !text) reject(new Error(sttErrorMsg(errCode)));
      else resolve(text);
    };
    stt.active = rec;
    try { rec.start(); } catch (e) { stt.active = null; reject(e); }
  });
}
function stopBrowserStt() { try { stt.active?.stop(); } catch {} }
function abortBrowserStt() { try { stt.active?.abort(); } catch {} stt.active = null; }

// ===== [SECTION: CONVERSATION] =====
const CONVERSATION_PROMPT_TEMPLATE = `You are {persona}, a native English speaker chatting with a Korean friend who is practicing speaking.
Topic: {title} — {subtitle}. Track concept: {trackConcept}.
Stage {stage} style: {stageStyle}.

VOICE CHANNEL RULES
- Never correct, explain, or mention the user's grammar, word choice, or pronunciation in "reply". Corrections go ONLY in the "hud" field.
- Talk like a curious friend, not a teacher or examiner. React naturally to what they said (show you actually listened), then ask exactly ONE follow-up question.
- Dig into specifics: when, where, who, why, how it felt, what happened next, what they would do differently.
- Keep "reply" short so the user talks more: max 35 words in Stage 1–2, max 55 words in Stage 3–4. Target talk ratio: user 70%, you 30%.
- Stage 3: push back politely with a counterpoint or "what if" every 2–3 turns.
- Stage 4: native speed phrasing, idioms, light humor, diplomatic hedging.
- Track 4: never take a partisan side. Present both sides' strongest arguments and ask for the user's reasoning.
- If the user answers very briefly, ask a narrower, easier question instead of a broader one.
- Naturally create chances for the user to use these expressions (never list them): {keyExpressions}.

TOPIC HISTORY
This topic has been cleared {clearCount} times.
Previous session summaries: {summaries}
Angles already covered: {anglesCovered}
If clearCount > 0: do NOT reuse the basic starter questions or covered angles. Open from a fresh angle: a specific past episode, an unexpected dilemma, the opposite viewpoint, or a future plan.
If clearCount = 0: open with one of these starters: {starterQuestions}.

Respond ONLY with JSON matching the schema.`;

const SIGNAL_KEYS = ['fluency', 'vocab', 'grammar', 'logic', 'nuance'];
const STAT_LABELS = { fluency: '유창성', vocab: '어휘', grammar: '문법', logic: '논리', nuance: '뉘앙스·발음' };

const TURN_SCHEMA = {
  type: 'OBJECT',
  properties: {
    transcript: { type: 'STRING', description: 'What the user actually said in English, verbatim as heard. Do NOT fix grammar errors. Empty string if nothing intelligible was said.' },
    reply: { type: 'STRING', description: 'Your next spoken line: a short natural reaction + exactly ONE follow-up question. Never any correction here.' },
    hud: {
      type: 'OBJECT',
      properties: {
        original: { type: 'STRING', description: "The user's sentence (or its key part) being upgraded, verbatim." },
        upgrade: { type: 'STRING', description: 'How a native speaker would most naturally say it. If it was already natural, give a more native-sounding alternative.' },
        tipKo: { type: 'STRING', description: '시제·구동사·뉘앙스 핵심 1줄 (한국어). 이미 자연스러우면 "👍 자연스러움"으로 시작.' }
      },
      required: ['original', 'upgrade', 'tipKo']
    },
    pronunciationNoteKo: { type: 'STRING', nullable: true, description: '오디오 입력일 때만: 발음·억양 1줄 피드백 (한국어). 텍스트 입력이거나 지적할 게 없으면 null.' },
    signals: {
      type: 'OBJECT',
      description: '0-100 scores for this single turn.',
      properties: { fluency: { type: 'INTEGER' }, vocab: { type: 'INTEGER' }, grammar: { type: 'INTEGER' }, logic: { type: 'INTEGER' }, nuance: { type: 'INTEGER' } },
      required: SIGNAL_KEYS
    },
    angleTag: { type: 'STRING', description: 'The conversation angle covered in this turn, 3-5 English words.' }
  },
  required: ['transcript', 'reply', 'hud', 'signals', 'angleTag'],
  // reply를 맨 앞에 생성시켜 스트리밍으로 대사부터 받는다
  propertyOrdering: ['reply', 'transcript', 'hud', 'pronunciationNoteKo', 'signals', 'angleTag']
};
const OPENING_SCHEMA = {
  type: 'OBJECT',
  properties: {
    reply: { type: 'STRING', description: 'Your opening line: a one-line casual greeting + your first question.' },
    angleTag: { type: 'STRING', description: 'The angle of your opening question, 3-5 English words.' }
  },
  required: ['reply', 'angleTag'],
  propertyOrdering: ['reply', 'angleTag']
};
const CLOSING_SCHEMA = {
  type: 'OBJECT',
  properties: { reply: { type: 'STRING', description: 'A short, natural, warm wrap-up line (1-2 sentences). No question.' } },
  required: ['reply']
};

let S = null; // 진행 중인 회화 세션 (런타임 전용)
const talk = { pending: null, report: null };

function fillTemplate(tpl, vars) {
  return tpl.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
}
function buildSystemInstruction(topic, stage, tp) {
  const st = STAGES[stage];
  const track = TRACKS[topic.track] || CUSTOM_TRACK;
  const keyExpr = topic.keyExpressions?.length ? topic.keyExpressions.map(k => k.en).join('; ') : '(none given — use natural, useful expressions for this topic)';
  const starters = topic.starterQuestions?.length
    ? topic.starterQuestions.map(q => `"${q}"`).join(' / ')
    : `a natural question asking what happened or what they want to share about "${topic.userInput || topic.title}"`;
  return fillTemplate(CONVERSATION_PROMPT_TEMPLATE, {
    persona: st.persona,
    title: topic.title,
    subtitle: topic.subtitle || topic.titleKo || '',
    trackConcept: track.concept,
    stage,
    stageStyle: st.style,
    keyExpressions: keyExpr,
    clearCount: tp.clearCount,
    summaries: tp.summaries.length ? tp.summaries.map((s, i) => `(${i + 1}) ${s}`).join(' ') : 'none',
    anglesCovered: tp.anglesCovered.length ? tp.anglesCovered.slice(-25).join(', ') : 'none',
    starterQuestions: starters
  });
}
const historyToContents = history => history.map(h => ({ role: h.role, parts: [{ text: h.text }] }));

function buildTurnNote(kind, timeUp) {
  let note;
  if (kind === 'voiceText') note = '[Voice turn] I spoke my answer out loud. Below is a verbatim transcript made separately from my recording (my mistakes are kept; [inaudible] marks parts that could not be heard). Copy it into "transcript" exactly. Do not assume I said anything that is not in it; if most of it is [inaudible], briefly ask me to say it again. pronunciationNoteKo must be null.';
  else if (kind === 'edited') note = '[Corrected turn] My voice answer was mis-transcribed, so I typed what I actually said below. Copy it into "transcript" as-is and respond to this version. pronunciationNoteKo must be null; set signals.nuance to 0.';
  else if (kind === 'stt') note = '[Browser speech-to-text turn] My answer below came from the browser speech recognizer and may contain recognition errors. Copy it into "transcript" as-is. pronunciationNoteKo must be null; set signals.nuance to 0.';
  else note = '[Typed turn] I typed my answer below (no audio). Copy it into "transcript" as-is. pronunciationNoteKo must be null; set signals.nuance to 0.';
  if (timeUp) note += ' [TIME IS UP] In "reply": react briefly to what I said, then wrap up the chat warmly in 1–2 short sentences. Do NOT ask a question.';
  return note;
}

// ---- 첫 질문 미리 준비: 토픽을 고르는 시점에 요청하고, 같은 토픽·같은 Stage로 시작할 때만 사용 ----
const OPENING_KICKOFF = "(Session start. You speak first: one short casual greeting line + your opening question. I haven't said anything yet.)";
function sessionRoleFor(topic, stage) {
  return state.settings.useAnalysisModelForDeepTalk && stage >= 3 && topic.track === 4 ? 'analysis' : 'chat';
}
const prefetchKey = (topic, stage) => `${topic.id}|${stage}|${sessionRoleFor(topic, stage)}`;
const chatThinking = () => (S && S.chatRole === 'analysis' ? 'high' : 'minimal');

function discardPrefetch() {
  const p = runtime.prefetch;
  runtime.prefetch = null;
  if (p) p.abort.abort();
}
function startOpeningPrefetch(topic) {
  discardPrefetch();
  if (!getApiKey() || navigator.onLine === false) return;
  const stage = state.settings.stage;
  const role = sessionRoleFor(topic, stage);
  const entry = { key: prefetchKey(topic, stage), abort: new AbortController(), meta: { attempts: [] } };
  entry.promise = callGemini({
    role,
    contents: [{ role: 'user', parts: [{ text: OPENING_KICKOFF }] }],
    systemInstruction: buildSystemInstruction(topic, stage, topicProgressOf(topic.id)),
    schema: OPENING_SCHEMA,
    thinking: role === 'analysis' ? 'high' : 'minimal',
    signal: entry.abort.signal,
    meta: entry.meta,
    quiet: true,
    fast: true
  }).then(r => {
    // 대사 음성도 미리 받아 둔다 (브라우저 음성 모드 제외, 문장 단위)
    const reply = String(r.data?.reply || '').trim();
    if (reply && runtime.prefetch === entry && state.settings.ttsPreference !== 'browser') {
      splitForTts(reply).forEach(c => getTtsAudio(c, state.settings.voiceName).catch(() => {}));
    }
    return r;
  });
  entry.promise.catch(() => {});
  runtime.prefetch = entry;
}
function takePrefetch(key) {
  const p = runtime.prefetch;
  runtime.prefetch = null;
  if (!p) return null;
  if (p.key !== key) { p.abort.abort(); return null; }
  return p;
}

function openSetup(topic, { isRandom = false, onCooldown = false } = {}) {
  if (S) { toast('진행 중인 대화가 있어요. 먼저 종료해 주세요', 'warn'); switchView('talk'); return; }
  talk.pending = { topic, isRandom, onCooldown };
  talk.report = null;
  startOpeningPrefetch(topic);
  switchView('talk');
  renderTalk();
}

async function startSession() {
  const p = talk.pending;
  if (!p || S) return;
  const clickAt = performance.now();
  if (!getApiKey()) { toast('먼저 ⚙️ 설정에서 Gemini API 키를 입력해 주세요', 'warn'); openSettings(); return; }
  // iOS: 탭 이벤트 안에서 오디오 잠금 해제

  let mode = state.settings.inputMode;

  if (mode === 'record') {

    catch (e) {

  const topic = p.topic;
